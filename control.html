<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controlling Microbes | MicroLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
<link rel="stylesheet" href="lab.css">
</head>
<body>
<div class="wrap" id="app"></div>

<script src="drag.js"></script>
<script src="lab.js"></script>
<script>
(function(){
  const {$, f1, clamp, rnd, esc, shuffle, q, T, plateSVG, pie, sliceGrowth, tubeSVG, scoreTxt, orderGame, pictureGame, onCleanup, ideas, explore} = MicroLab;
  const AGAR = "#efe0b0";
  const SCORE_TBL = `<table class="tbl" style="max-width:320px;min-width:0"><tr><th>Score</th><th>Growth</th></tr>${[["−", "none"], ["+", "minimum"], ["2+", "moderate"], ["3+", "heavy"], ["4+", "maximum"]].map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table>`;

  /* a pie-sectioned plate: labels[], scores[] (or null), opts {streaked:[bools], hot:[bools], click:true, tag} */
  function sectPlate(labels, scores, o){
    o = o || {};
    const cx = 150, cy = 150, r = 118, sl = pie(cx, cy, r, labels.length);
    let s = plateSVG(cx, cy, r, o.agar || AGAR);
    sl.forEach((p, i) => {
      if (o.hot && o.hot[i]) s += `<path d="${p.path}" fill="#3f4cc0" opacity=".12" class="pulse"/>`;
      if (scores && scores[i] !== null && scores[i] !== undefined) s += sliceGrowth(cx, cy, r, p, scores[i], (o.seed || 1) * 31 + i * 17, o.col);
      else if (o.streaked && o.streaked[i]){
        const am = (p.a0 + p.a1) / 2, pts = [];
        for (let k = 0; k < 7; k++){ const d = r * (.22 + k * .095), sw = (k % 2 ? 1 : -1) * .22; pts.push(`${f1(cx + Math.cos(am + sw) * d)},${f1(cy + Math.sin(am + sw) * d)}`); }
        s += `<polyline points="${pts.join(" ")}" fill="none" stroke="#c9b26f" stroke-width="2.5" stroke-linejoin="round" opacity=".9"/>`;
      }
      const a = p.a0; s += `<line x1="${cx}" y1="${cy}" x2="${f1(cx + Math.cos(a) * r)}" y2="${f1(cy + Math.sin(a) * r)}" stroke="#4b2a8a" stroke-width="2"/>`;
    });
    sl.forEach((p, i) => {
      const [mx, my] = p.mid;
      s += `<rect x="${f1(mx - 30)}" y="${f1(my - 13)}" width="60" height="${scores ? 40 : 24}" rx="7" fill="#fff" opacity=".85"/>` + T(mx, my + 4, labels[i], {fs:14, c:"#4b2a8a"});
      if (scores && scores[i] !== null && scores[i] !== undefined) s += T(mx, my + 22, scoreTxt(scores[i]), {fs:15, c:scores[i] ? "#1b7f4e" : "#b83a34"});
      if (o.click) s += `<path d="${p.path}" fill="transparent" class="svgbtn" data-sec="${i}"><title>${labels[i]}</title></path>`;
    });
    return `<svg class="gsvg" viewBox="0 0 300 ${o.tag ? 322 : 300}" role="img" aria-label="${esc(o.aria || "Plate divided into sections")}">${s}${o.tag ? T(150, 316, o.tag, {fs:15, c:"#4b2a8a"}) : ""}</svg>`;
  }

  /* ================================================================= EXERCISE 22: heat */
  const HORG = {bsub:{n:"Bacillus subtilis", s:"B. subtilis", note:"Makes endospores"}, ecoli:{n:"Escherichia coli", s:"E. coli", note:"No endospores"}, sepi:{n:"Staphylococcus epidermidis", s:"S. epidermidis", note:"No endospores"}};
  const HTEMP = {t0:{n:"0°C ice up front", where:"on the ice"}, t4:{n:"4°C fridge up front", where:"in the fridge"}, t65:{n:"63 to 70°C water bath", where:"in the water bath"}, t75:{n:"about 75°C water bath", where:"in the water bath"}, t88:{n:"about 88°C water bath", where:"in the water bath"}};
  const HSECT = ["0", "30 sec", "2 min", "5 min", "15 min"];
  /* practice data that follows the class deck: E. coli dies fastest, S. epidermidis is more tolerant, B. subtilis spores can survive 15 min at about 88°C, cold only slows growth */
  const HGROW = {
    bsub:{t0:[4, 4, 4, 4, 4], t4:[4, 4, 4, 4, 4], t65:[4, 3, 2, 2, 1], t75:[4, 2, 1, 1, 1], t88:[4, 2, 1, 1, 1]},
    ecoli:{t0:[4, 4, 4, 4, 4], t4:[4, 4, 4, 4, 4], t65:[4, 2, 0, 0, 0], t75:[4, 1, 0, 0, 0], t88:[4, 0, 0, 0, 0]},
    sepi:{t0:[4, 4, 4, 4, 4], t4:[4, 4, 4, 4, 4], t65:[4, 3, 1, 0, 0], t75:[4, 2, 0, 0, 0], t88:[4, 1, 0, 0, 0]}};
  const TDT_OPTS = ["Killed in under 30 sec", "Killed between 30 sec and 2 min", "Killed between 2 and 5 min", "Killed between 5 and 15 min", "Survived all 15 min"];

  /* temperature bar: tap a growth range or one of our test temperatures */
  const TZINFO = {
    psy:["Psychrophiles (0 to 20°C)", "Cold-loving microbes. They can grow even at 0°C and are found in cold places like polar oceans. They can't grow at body temperature."],
    meso:["Mesophiles (25 to 40°C)", "Moderate-temperature lovers. Most bacteria are mesophiles, including the ones that live in and on us (body temperature is 37°C) and most pathogens. All three of our Ex 22 bacteria are mesophiles."],
    thermo:["Thermophiles (45 to 65°C)", "Heat-loving microbes, found in places like compost piles and hot springs."],
    hyper:["Hyperthermophiles (above 80°C)", "Extreme heat lovers, found in places like deep-sea hydrothermal vents. Most of them are archaea, not bacteria."],
    cold:["0°C ice and 4°C fridge", "Below a mesophile's growth range. Cold <b>slows</b> growth but does <b>not kill</b>, so it is bacteriostatic. That's why the 0°C and 4°C plates grew 4+ in every section."],
    hot:["63 to 70°C, about 75°C, about 88°C", "Above a mesophile's growth range, so the heat <b>kills</b>. Hotter or longer = fewer survivors. Endospores (<i>B. subtilis</i>) survive the longest."]};
  function tempScaleSVG(narrow){
    if (narrow){
      const y = c => 440 - c * 4;
      let v = `<line x1="80" y1="${y(100)}" x2="80" y2="${y(0)}" stroke="#4b2a8a" stroke-width="3"/>` + T(180, 18, "°C", {fs:14, c:"#4b2a8a"});
      for (let c = 0; c <= 100; c += 20) v += `<line x1="72" y1="${y(c)}" x2="88" y2="${y(c)}" stroke="#4b2a8a" stroke-width="2"/>` + T(64, y(c) + 5, c + "°", {a:"end", fs:14, w:400});
      [["psy", 0, 20, "Psychrophiles", "0 to 20°C", "#e7e9fb"], ["meso", 25, 40, "Mesophiles", "25 to 40°C", "#fff4d6"], ["thermo", 45, 65, "Thermophiles", "45 to 65°C", "#fbe8e7"], ["hyper", 80, 100, "Hyperthermophiles", "above 80°C", "#e1f3ef"]].forEach(([k, a, b, n, r, c]) => {
        const top = y(b), h = y(a) - y(b), mid = top + h / 2;
        v += `<g data-x="${k}"><rect class="xhit" x="150" y="${top + 2}" width="200" height="${h - 4}" rx="8" fill="${c}" stroke="#b9a8e0"/>` + T(250, mid - 2, n, {fs:16}) + T(250, mid + 17, r, {fs:14, w:400}) + `</g>`;
      });
      v += `<g data-x="cold"><rect class="xhit" x="90" y="${y(4) - 14}" width="52" height="${y(0) - y(4) + 28}" rx="8" fill="#3f4cc0" fill-opacity=".08" stroke="none"/><circle cx="80" cy="${y(0)}" r="7" fill="#3f7bd1"/><circle cx="80" cy="${y(4)}" r="7" fill="#3f7bd1"/>` + T(96, y(2) + 5, "0, 4", {a:"start", fs:14, c:"#3f7bd1"}) + `</g>`;
      v += `<g data-x="hot"><rect class="xhit" x="90" y="${y(88) - 14}" width="52" height="${y(63) - y(88) + 28}" rx="8" fill="#b83a34" fill-opacity=".08" stroke="none"/><rect x="74" y="${y(70)}" width="12" height="${y(63) - y(70)}" rx="3" fill="#b83a34"/><circle cx="80" cy="${y(75)}" r="7" fill="#b83a34"/><circle cx="80" cy="${y(88)}" r="7" fill="#b83a34"/>` + T(96, y(88) + 5, "88", {a:"start", fs:14, c:"#b83a34"}) + T(96, y(75) + 5, "75", {a:"start", fs:14, c:"#b83a34"}) + T(96, y(66) + 5, "63-70", {a:"start", fs:13, c:"#b83a34"}) + `</g>`;
      v += T(180, 470, "Dots = our test temperatures", {fs:14, w:400, c:"#5a6376"});
      return `<svg class="gsvg" viewBox="0 0 360 480" role="img" aria-label="Temperature scale with growth ranges and our test temperatures. Tap one to learn more.">${v}</svg>`;
    }
    const x = c => 40 + c * 6.8;
    let s = "";
    [["psy", 0, 20, "Psychrophiles", "0 to 20°C", "#e7e9fb"], ["meso", 25, 40, "Mesophiles", "25 to 40°C", "#fff4d6"], ["thermo", 45, 65, "Thermophiles", "45 to 65°C", "#fbe8e7"], ["hyper", 80, 100, "Hyperthermophiles", "above 80°C", "#e1f3ef"]].forEach(([k, a, b, n, r, c], i) => {
      const y = i % 2 ? 60 : 18;
      s += `<g data-x="${k}"><rect class="xhit" x="${x(a)}" y="${y}" width="${x(b) - x(a)}" height="36" rx="6" fill="${c}" stroke="#b9a8e0"/>` + T((x(a) + x(b)) / 2, y + 16, n, {fs:12}) + T((x(a) + x(b)) / 2, y + 30, r, {fs:11, w:400}) + `</g>`;
    });
    s += `<line x1="${x(0)}" y1="118" x2="${x(100)}" y2="118" stroke="#4b2a8a" stroke-width="2.5"/>`;
    for (let c = 0; c <= 100; c += 20) s += `<line x1="${x(c)}" y1="112" x2="${x(c)}" y2="124" stroke="#4b2a8a" stroke-width="2"/>` + T(x(c), 140, c + "°C", {fs:12, w:400});
    s += `<g data-x="cold"><rect class="xhit" x="${x(0) - 14}" y="104" width="${x(4) - x(0) + 28}" height="66" rx="8" fill="#3f4cc0" fill-opacity=".06" stroke="none"/>`;
    [[0, "0"], [4, "4"]].forEach(([c, l]) => { s += `<circle cx="${x(c)}" cy="118" r="7" fill="#3f7bd1"/>` + T(x(c) + (c === 0 ? -6 : 8), 162, l, {fs:12, c:"#3f7bd1"}); });
    s += `</g><g data-x="hot"><rect class="xhit" x="${x(63) - 10}" y="104" width="${x(88) - x(63) + 20}" height="66" rx="8" fill="#b83a34" fill-opacity=".06" stroke="none"/>`;
    [[75, "75"], [88, "88"]].forEach(([c, l]) => { s += `<circle cx="${x(c)}" cy="118" r="7" fill="#b83a34"/>` + T(x(c), 162, l, {fs:12, c:"#b83a34"}); });
    s += `<rect x="${x(63)}" y="112" width="${x(70) - x(63)}" height="12" rx="3" fill="#b83a34"/>` + T(x(66.5), 162, "63 to 70", {fs:12, c:"#b83a34"}) + `</g>`;
    s += T(380, 188, "Dots = our test temperatures. Tap a group or a set of dots.", {fs:12, w:400, c:"#5a6376"});
    return `<svg class="gsvg" viewBox="0 0 760 198" role="img" aria-label="Temperature scale with growth ranges and our test temperatures. Tap one to learn more.">${s}</svg>`;
  }

  function renderHeat(body){
    body.innerHTML = `
      <div class="parthead first">Main ideas</div>
      ${ideas("Key vocab", [
        ["Sterilization", "Kills <b>all</b> microbial life, including endospores. The autoclave, the hot-air oven, and incineration sterilize."],
        ["Thermal death time (TDT)", "The shortest <b>time</b> to kill all cells in a culture at a given temperature. Your Ex 22 plates estimate TDT."],
        ["Thermal death point (TDP)", "The lowest <b>temperature</b> that kills all bacteria in a liquid culture in <b>10 minutes</b>."],
        ["Decimal reduction time (D-value)", "The time to kill <b>90%</b> of the population at a given temperature."],
        ["Endospores", "The most heat-resistant form of bacterial life. Boiling doesn't kill them, but the autoclave does."]], {vocab:true})}
      ${ideas("Types of heat (and cold)", [
        ["Autoclave (moist heat + pressure)", "Steam under pressure. The pressure lets the steam get hotter than boiling water (121°C instead of 100°C), which kills endospores. <b>Sterilizes.</b>", "121°C · 15 psi · 15 min"],
        ["Boiling (moist)", "Kills vegetative cells, but <b>not endospores</b>, so it does not sterilize.", "100°C"],
        ["Pasteurization (moist)", "Kills pathogens in a liquid, like milk, <b>without sterilizing</b> it.", "63°C for 30 min, or 72°C for 15 sec"],
        ["Hot-air oven (dry)", "Dry heat is less effective, so it needs a higher temperature for longer than the autoclave. <b>Sterilizes.</b>", "170°C · 2 hours"],
        ["Incineration (dry)", "Burns contaminated materials. Flaming your loop red-hot is incineration. <b>Sterilizes.</b>", "open flame"],
        ["Fridge and freezer (cold)", "Cold <b>slows growth but does not kill</b> (bacteriostatic). Warm things back up and the bacteria grow again.", "4°C fridge · 0°C and below"]],
        {lead:"<b>Moist heat</b> denatures (coagulates) proteins and works better than dry heat. <b>Dry heat</b> kills by oxidation and dehydration, so it needs higher temperatures and more time."})}
      <div class="sect">Where do microbes grow? Tap the bar</div><div id="hZones"></div>
      <div class="parthead">Try the experiment <small>Exercise 22</small></div>
      <div class="sect">1. Run the heat test</div>
      <p class="labq" style="margin:0 0 6px">You get one organism and two temperatures, so you make two plates. Here you run one plate at a time. Pick an organism and a temperature, then streak each section at the right moment.</p>
      <div class="row"><span class="lbl">Organism</span><span id="hOrg"></span></div>
      <div class="row"><span class="lbl">Temperature</span><span id="hTemp"></span></div>
      <div class="bench2"><div class="panel tight" id="hPlate" style="max-width:400px;justify-self:center;width:100%"></div>
        <div><div class="clock" id="hClock"></div><div class="benchhint" id="hMsg" role="status"></div><div class="row" id="hBtns"></div><div id="hAsk"></div></div></div>
      <div class="sect">2. What does this plate mean?</div>
      <p class="labq" style="margin:0 0 6px">These are the patterns from the "what your pattern means" slide. Read each plate and pick what it means.</p>
      <div class="row" style="align-items:flex-start;gap:16px"><div style="flex:1;min-width:260px" id="hRead"></div></div>
      <div class="sect">Scoring growth</div>${SCORE_TBL}`;
    let org = "ecoli", temp = "t65", ph = 0, streaked = [];
    const chips = () => {
      $("hOrg").innerHTML = Object.keys(HORG).map(k => `<button class="chip ${k === org ? "on" : ""}" data-o="${k}"><i>${HORG[k].s}</i></button>`).join(" ");
      $("hTemp").innerHTML = Object.keys(HTEMP).map(k => `<button class="chip ${k === temp ? "on" : ""}" data-t="${k}">${HTEMP[k].n}</button>`).join(" ");
    };
    const CLOCK = ["Start (before the heat)", "Start", "30 sec", "2 min", "5 min", "5 to 15 min", "15 min", "Done", "Next period"];
    const draw = (msg, kind) => {
      const res = ph >= 8 ? HGROW[org][temp] : null, want = {0:0, 2:1, 3:2, 4:3, 6:4}[ph];
      $("hPlate").innerHTML = sectPlate(HSECT, res, {streaked, click:ph < 8, hot:HSECT.map((_, i) => i === want), tag:`${HORG[org].s} · ${HTEMP[temp].n}`, seed:Object.keys(HTEMP).indexOf(temp) + 3});
      $("hClock").innerHTML = `⏱ ${CLOCK[ph]} <small>total time ${HTEMP[temp].where}</small>`;
      const m = $("hMsg"); m.className = "benchhint " + (kind || ""); m.innerHTML = msg;
      let b = "";
      if (ph === 1) b = `<button class="btn primary" data-a="in">Both tubes go in ${HTEMP[temp].where}</button>`;
      if (ph === 5) b = `<button class="btn primary" data-a="wait">Make your unknown smear (skip to 15 min)</button>`;
      if (ph === 7) b = `<button class="btn primary" data-a="inc">Plate inverted on the tray. Read it next period</button>`;
      b += `<button class="btn secondary" data-a="reset">↺ Start over</button>`;
      $("hBtns").innerHTML = b;
      $("hAsk").innerHTML = ph === 8 ? `<p class="qq" style="margin:10px 0 6px">Find the first section with no growth. What is your TDT estimate at this temperature?</p><div class="ans" style="flex-direction:column;align-items:stretch">${TDT_OPTS.map((t, i) => `<button data-tdt="${i}" style="text-align:left">${t}</button>`).join("")}</div>` : "";
    };
    const start = () => { ph = 0; streaked = [false, false, false, false, false]; draw(`Label the bottom: name, day, class time, organism, temperature. Then <b>streak the 0 section</b> before the tube goes ${HTEMP[temp].where}. Tap the 0 section.`); };
    const instr = {2:"30 sec", 3:"2 min", 4:"5 min", 6:"15 min"};
    body.onclick = e => {
      const o = e.target.closest("[data-o]"); if (o){ org = o.dataset.o; chips(); start(); return; }
      const t = e.target.closest("[data-t]"); if (t){ temp = t.dataset.t; chips(); start(); return; }
      const a = e.target.closest("[data-a]");
      if (a){
        const k = a.dataset.a;
        if (k === "reset") start();
        if (k === "in"){ ph = 2; draw(`The tube has been ${HTEMP[temp].where} for <b>30 sec</b>. Remove it, mix, and streak a loopful on the right section. Tap it.`); }
        if (k === "wait"){ ph = 6; draw(`<b>15 min</b>. Remove, mix, and streak the last section. Tap it.`); }
        if (k === "inc"){ ph = 8; const g = HGROW[org][temp]; draw(`Here are the results: ${g.map((x, i) => `${HSECT[i]} <b>${scoreTxt(x)}</b>`).join(", ")}. The <b>0</b> section is your control, and it grew.`, "good"); }
        return;
      }
      const td = e.target.closest("[data-tdt]");
      if (td){
        const g = HGROW[org][temp], first = g.findIndex(x => x === 0), right = first === -1 ? 4 : first - 1, ok = +td.dataset.tdt === right;
        td.classList.add(ok ? "right" : "wrong");
        const why = first === -1 ? (temp === "t0" || temp === "t4" ? "Cold did not kill it. Cold only slows growth." : `It grew in every section, so it survived 15 min at this temperature. ${org === "bsub" ? "<i>B. subtilis</i> makes endospores, the most heat-resistant form of bacterial life." : ""}`)
          : `The last growth was at ${HSECT[first - 1]} and the first section with no growth was ${HSECT[first]}, so it was killed between them. That bracket is your TDT estimate.`;
        if (ok){ $("hMsg").className = "benchhint good"; $("hMsg").innerHTML = `<b>Yes!</b> ${why} Try another temperature or organism and compare.`; $("hAsk").querySelectorAll("button").forEach(x => x.disabled = true); }
        else { td.disabled = true; $("hMsg").className = "benchhint warn"; $("hMsg").innerHTML = "Not quite. Look for the first section with no growth (−), and the section just before it."; }
        return;
      }
      const sec = e.target.closest("[data-sec]");
      if (sec && ph !== 1 && ph !== 5 && ph < 7){
        const i = +sec.dataset.sec, want = {0:0, 2:1, 3:2, 4:3, 6:4}[ph];
        if (i !== want){ $("hMsg").className = "benchhint warn"; $("hMsg").innerHTML = `That's the <b>${HSECT[i]}</b> section. ${ph === 0 ? "The 0 section gets streaked first, before any heat." : `The clock says <b>${instr[ph]}</b>.`}`; return; }
        streaked[i] = true;
        if (ph === 0){ ph = 1; draw(`The 0 section is your control: no heat at all. Now put the tubes in. Both tubes go in at the same time.`); }
        else if (ph === 2){ ph = 3; draw(`Return the tube to the heat. Now it's <b>2 min</b>. Remove, mix, streak. Tap the right section.`); }
        else if (ph === 3){ ph = 4; draw(`Return it. <b>5 min</b> now. Remove, mix, streak.`); }
        else if (ph === 4){ ph = 5; draw(`Back in the heat. Now there's a <b>10 minute wait</b> until 15 min. Use it to make your unknown smear.`); }
        else if (ph === 6){ ph = 7; draw(`Tubes are done. Broth tubes go to the To Be Autoclaved area. Plates go inverted on the tray up front.`, "good"); }
      }
    };
    chips(); start();
    explore($("hZones"), tempScaleSVG, TZINFO, "Tap <b>Psychrophiles</b>, <b>Mesophiles</b>, <b>Thermophiles</b>, or <b>Hyperthermophiles</b> for a definition, or tap our test temperatures (the dots).");
    const RP = [[[4, 4, 4, 4, 4], 0, "Heavy growth everywhere, and this plate sat on ice (0°C)."], [[4, 3, 1, 0, 0], 1, ""], [[0, 3, 2, 1, 0], 2, ""], [[4, 2, 0, 0, 2], 3, ""], [[4, 3, 3, 2, 2], 4, "This plate came out of the 88°C bath."]];
    const MEAN = ["Cold did not kill. It only slows growth", "Killed between the last growth and the first no growth section: your TDT estimate", "Control failed. Check your streak and ask your instructor", "Uneven loopful or contamination. Note it in your results", "Survived 15 min at that temperature (endospores?)"];
    pictureGame($("hRead"), RP.map(([g, a, ctx], k) => ({svg:sectPlate(HSECT, g, {seed:k + 11}), ask:(ctx ? ctx + " " : "") + "What does this pattern mean?", opts:MEAN, a, why:MEAN[a] + "."})), {picW:300});
  }

  /* ================================================================= EXERCISE 23: UV */
  function uvPlateSVG(st, o){
    o = o || {};
    const cx = 150, cy = 140, r = 112, xs = [cx - r, cx - r / 3, cx + r / 3, cx + r], k = MicroLab.id("uv");
    let s = "";
    if (o.lamp) s += `<rect x="70" y="0" width="160" height="22" rx="8" fill="#3b4250"/><rect x="82" y="16" width="136" height="8" rx="4" fill="${st.on ? "#c9b8ff" : "#8a90a0"}"/>` + (st.on ? Array.from({length:7}, (_, i) => `<line x1="${92 + i * 19}" y1="26" x2="${92 + i * 19}" y2="${cy - r - 2}" stroke="#a58bff" stroke-width="3" stroke-dasharray="6 5" opacity=".8"/>`).join("") : "");
    s += `<g transform="translate(0 ${o.lamp ? 30 : 0})">`;
    s += plateSVG(cx, cy, r, AGAR, "", {noshine:true});
    s += `<clipPath id="${k}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath><g clip-path="url(#${k})">`;
    if (st.swab) for (let i = 0; i < 12; i++){ s += `<line x1="${cx - r}" y1="${cy - r + 10 + i * 18}" x2="${cx + r}" y2="${cy - r + 10 + i * 18}" stroke="#d9c58a" stroke-width="3" opacity=".7"/>`; if (st.swab > 1) s += `<line x1="${cx - r + 10 + i * 18}" y1="${cy - r}" x2="${cx - r + 10 + i * 18}" y2="${cy + r}" stroke="#d9c58a" stroke-width="3" opacity=".7"/>`; }

        q("All three of our bacteria are…", ["Mesophiles: they grow best at 25 to 40°C", "Psychrophiles", "Thermophiles", "Hyperthermophiles"], 0, "Heat above their growth range kills."),
        q("Growth at 30 sec and 2 min, then none at 5 and 15 min. Your TDT estimate is…", ["Between 2 and 5 min", "Under 30 sec", "Between 5 and 15 min", "More than 15 min"], 0, "Killed between the last growth and the first no-growth section.")]},
    uv:{tab:"23: UV", title:"Physical Methods of Control: Ultraviolet Radiation", ex:"Exercise 23", render:renderUV,
      question:"Does UV kill bacteria, does more UV kill more, can UV get through foil, and does light afterward help survival?",
      how:["UV is <b>nonionizing</b>: less energy and a longer wavelength. X rays and gamma rays are <b>ionizing</b>: they make free radicals that break DNA strands.",
        "<b>UVC (200 to 290 nm)</b> is the most lethal: DNA absorbs it best. Our lamp is <b>260 nm</b>. UVB (290 to 320) can also damage DNA. UVA (320 to 400) is not readily absorbed and is less active. Below 200 nm is absorbed by air.",
        "UV makes <b>thymine dimers</b> in DNA → mutation in a critical gene → cell death unless repaired.",
        "<b>Light repair (photoreactivation):</b> visible light activates <b>photolyases</b>, which split the dimers. <b>Dark repair</b> needs no light: <b>endonuclease</b> removes the dimers, <b>DNA polymerase</b> replaces the nucleotides, and <b>DNA ligase</b> seals the backbone.",
        "UV is used to sterilize heat-labile solutions, decontaminate hospital operating rooms and food-processing areas, and disinfect water. Its limit: <b>poor penetrating ability</b>."],
      more:[["The UV spectrum", "spectrum", []], ["How UV kills", "dimer", ["This is why the Light plate matters: if light repair works, the Light plate should grow more than the Dark plate."]],
        ["What your two plates test", null, ["<b>C vs. 30 and 60:</b> did UV penetrate the foil? <b>30 vs. 60:</b> does more UV kill more? <b>Dark vs. Light:</b> does light after UV help survival (light repair)?", "Your hypotheses: \"UV radiation ___ bacteria. Incubation in light will increase/decrease/not affect survival.\" and \"The bacterial species that will survive UV radiation the best is ___.\""]]],
      quiz:[
        q("Which UV range is the most lethal?", ["UVC, 200 to 290 nm", "UVA, 320 to 400 nm", "UVB, 290 to 320 nm", "Below 200 nm"], 0, "DNA absorbs it best. Our lamp: 260 nm."),
        q("What happens to UV below 200 nm?", ["It's absorbed by air and doesn't reach living organisms", "It's the most lethal", "It passes through foil", "It repairs DNA"], 0, "That's why our lamp uses 260 nm."),
        q("UV vs. X rays: which statement is right?", ["UV is nonionizing; X rays and gamma rays are ionizing and make free radicals that break DNA", "UV is ionizing", "X rays make thymine dimers only", "They have the same energy"], 0, "UV has less energy and a longer wavelength."),
        q("What damage does UV cause in DNA?", ["Thymine dimers", "Double-strand breaks from free radicals", "Extra phosphate groups", "Protein coagulation"], 0, "Dimers → mutation → death unless repaired."),
        q("What is light repair?", ["Visible light activates photolyases, which split the dimers", "Endonuclease cuts out the dimers in the dark", "UV light repairs DNA", "Heat repairs DNA"], 0, "Also called photoreactivation."),
        q("Which enzymes carry out dark repair?", ["Endonuclease, DNA polymerase, and DNA ligase", "Photolyases only", "Catalase and oxidase", "Amylase and gelatinase"], 0, "Dark repair doesn't need light."),
        q("What is the main limit of UV?", ["Poor penetrating ability", "It's too expensive", "It only works in water", "It's ionizing"], 0, "Today you test whether UV gets through aluminum foil."),
        q("Why is the lid removed under the lamp?", ["UV penetrates poorly, so the lid would block it", "So the plate dries out", "To let air in", "It isn't removed"], 0, "Your manual asks this one. Write it in your notebook!"),
        q("For the first 30 seconds, the foil covers…", ["C and 30", "C only", "All three strips", "Nothing"], 0, "Then slide it to cover only C for the second 30 sec."),
        q("Which strip is covered by foil the whole time?", ["C, the control", "30", "60", "None"], 0, "C shows what growth looks like with no UV."),
        q("In your manual's table, Dark 30 = A, Light 30 = B, and Dark 60 = …", ["C", "D", "A", "B"], 0, "From the class slides."),
        q("The Light plate grew more than the Dark plate. That's evidence of…", ["Light repair: photolyases split the dimers", "Dark repair", "Contamination", "UV penetrating the foil"], 0, "If they look the same, there's no clear light repair."),
        q("Where does the Light plate go?", ["The tray labeled \"Light,\" at room temperature", "The back room", "The 37°C incubator", "The fridge"], 0, "The Dark plate goes to the back room. Both stay at room temperature."),
        q("Which species is expected to survive UV least?", ["Staphylococcus epidermidis: no endospores and no strong pigment", "Bacillus subtilis", "Micrococcus luteus", "Serratia marcescens"], 0, "Spores (B. subtilis) and pigments (M. luteus, S. marcescens) may protect."),
        q("Name one use of UV.", ["Disinfecting water", "Sterilizing the inside of a sealed bottle", "Killing bacteria through foil", "Pasteurizing milk"], 0, "Also: heat-labile solutions, operating rooms, food-processing areas.")]},
    dis:{tab:"24: Disinfectants", title:"Chemical Methods of Control: Disinfectants and Antiseptics", ex:"Exercise 24", render:renderDis,
      question:"How long does a disinfectant or antiseptic need to kill bacteria, and does it work equally on every organism?",
      how:["<b>Disinfectants</b> are used on inanimate objects to lower the level of microbes on their surfaces. <b>Antiseptics</b> are used on living tissue to decrease the number of microbes.",
        "<b>Bactericidal</b> agents result in bacterial death. <b>Bacteriostatic</b> agents cause temporary inhibition of growth.",
        "No single chemical is best in all situations. Important criteria: <b>concentration</b>, <b>length of contact</b>, and whether it is <b>-cidal or -static</b>. Also consider pH, solubility, toxicity, organic material present, and cost.",
        "<b>Decimal reduction time (DRT):</b> the time to kill 90% of the microbial population. Determine it for the most common and persistent microbes at a health care facility before choosing a disinfectant.",
        "<b>The use-dilution test:</b> dip metal rings in culture and dry them, place them in disinfectant for 10 min at 20°C, then transfer them to nutrient medium. Growth shows how effective it is. The disinfectant is used at the manufacturer's recommended concentration. The test is limited to bactericidal compounds: it <b>cannot evaluate bacteriostatic</b> compounds.",
        "Today is a <b>modified</b> use-dilution test: a loopful moves from each tube to a plate at each time point."],
      more:[["Your hypothesis", null, ["\"The disinfectants tested will kill all bacteria in ___ minutes.\"", "Cultures, as assigned: <i>Escherichia coli</i>, <i>Staphylococcus epidermidis</i>, <i>Pseudomonas aeruginosa</i>, <i>Staphylococcus aureus</i>. Work with another group: same chemical, two different bacteria."]]],
      quiz:[
        q("What is the difference between a disinfectant and an antiseptic?", ["Disinfectants go on inanimate objects; antiseptics go on living tissue", "Disinfectants are stronger", "Antiseptics go on surfaces", "There is no difference"], 0, "From the class slides."),
        q("A bacteriostatic agent…", ["Temporarily inhibits growth", "Kills bacteria", "Kills endospores", "Sterilizes"], 0, "Bactericidal agents kill."),
        q("Which can the use-dilution test evaluate?", ["Bactericidal compounds only", "Bacteriostatic compounds only", "Both", "Neither"], 0, "Growth after exposure only shows whether cells were killed."),
        q("In the standard use-dilution test, the rings sit in disinfectant for…", ["10 min at 20°C", "20 min at 37°C", "2.5 min at 4°C", "15 min at 121°C"], 0, "Then they go to nutrient medium."),
        q("What concentration is the disinfectant used at?", ["The concentration the manufacturer recommends", "Full strength always", "Diluted 1:1000", "Whatever is left in the bottle"], 0, "Dilute the test substance to the strength it's normally used at."),
        q("What is the decimal reduction time (DRT)?", ["The time to kill 90% of the microbial population", "The time to kill 100%", "The dilution of the disinfectant", "The time before growth starts"], 0, "Determine it for the most common, persistent microbes before choosing a disinfectant."),
        q("What is the 0 sector?", ["Bacteria with no chemical: the control", "The longest exposure", "Lab disinfectant at 0 minutes", "An empty sector"], 0, "No growth on 0 means the control failed."),
        q("When do you transfer a loopful from each tube?", ["At 2.5, 5, 10, and 20 minutes", "At 1, 2, 3, and 4 minutes", "Only at 20 minutes", "At 10 minutes only"], 0, "Flame your loop between every transfer."),
        q("How much culture goes into each 5 ml tube?", ["0.5 ml", "5 ml", "1 loopful", "10 ml"], 0, "Aseptically add 0.5 ml of the assigned culture to each tube."),
        q("Growth fades, then stops at 10 min. What does that mean?", ["That's about how long the chemical needs to kill this bacterium", "It never killed the bacterium", "The control failed", "It killed it in 2.5 min or less"], 0, "Growth stops at one time point = the kill time."),
        q("Your two bacteria give different results with the same chemical. What does that show?", ["The same chemical does not work equally on every organism", "One group made a mistake", "The chemical was contaminated", "Both should always match"], 0, "That's why there's no single best disinfectant."),
        q("What does D stand for on the plate labels?", ["Laboratory disinfectant", "Dilution", "Dead", "Day"], 0, "The other plate is for the test substance.")]},
    drugs:{tab:"25: Kirby-Bauer", title:"Chemical Methods of Control: Antimicrobial Drugs", ex:"Exercise 25", render:renderKB,
      question:"Which antimicrobial drugs inhibit each bacterium, and are they equally effective against gram-positive and gram-negative bacteria?",
      how:["<b>Antibiotic:</b> a substance produced by a microorganism that inhibits other microorganisms. <b>Antimicrobial drug:</b> any chemical, natural or synthetic, used in the body to kill or inhibit microbes. <b>MIC</b> (minimum inhibitory concentration): the lowest concentration of a drug that inhibits growth.",
        "Disinfectants and antiseptics (Ex 24) go <b>on</b> surfaces and skin. Antimicrobial drugs go <b>into</b> the patient.",
        "<b>1928:</b> Alexander Fleming sees <i>Penicillium</i> mold inhibit <i>Staphylococcus</i>. <b>1940:</b> Selman Waksman isolates streptomycin, made by an actinomycete. <b>Today:</b> <i>Streptomyces</i> bacteria produce nearly 70% of all antibiotics.",
        "Each paper disk holds a known amount of one drug. The drug diffuses into the agar and is most concentrated next to the disk. Where it's above the MIC, bacteria can't grow: that clear ring is the <b>zone of inhibition</b>.",
        "Zone size depends on the diffusion rate of the drug, the growth rate of the organism, and how susceptible the organism is. So the method is standardized: <b>Mueller-Hinton agar</b> every time (it lets the drug diffuse freely) and complete plate coverage.",
        "A bigger zone is not always a better drug: every drug has its own cutoffs in <b>Table 25.1</b>. <b>S</b> = standard dose should work. <b>I</b> = may work at a higher dose or where the drug concentrates. <b>R</b> = not likely to work."],
      more:[["How the test works", "kb", []],
        ["From the bench to the bedside", null, ["Culture and sensitivity (C&S) reports use this same S, I, R language. Collect cultures <b>before</b> the first antibiotic dose, or results can be wrong. Results let the team switch to the right, narrowest drug, and using the right drug slows antibiotic resistance."]],
        ["Your setup", null, ["Cultures: <i>Staphylococcus epidermidis</i>, <i>Escherichia coli</i>, <i>Pseudomonas aeruginosa</i> (BSL-2). Disks: penicillin (P), ampicillin (AM), erythromycin (E), tetracycline (Te), chloramphenicol (C), streptomycin (S).",
          "Hypotheses (agree or disagree): 1. All antibiotics will be equally effective against gram-positive and gram-negative bacteria. 2. All antibiotics will be equally effective against gram-negative <i>E. coli</i> and <i>P. aeruginosa</i>."]]],
      quiz:[
        q("What is an antibiotic?", ["A substance produced by a microorganism that inhibits other microorganisms", "Any synthetic drug", "A disinfectant", "The lowest concentration that inhibits growth"], 0, "An antimicrobial drug can be natural or synthetic."),
        q("What is the MIC?", ["The lowest concentration of a drug that inhibits growth", "The highest safe dose", "The zone diameter", "The disk size"], 0, "Minimum inhibitory concentration."),
        q("Who isolated streptomycin, made by an actinomycete, in 1940?", ["Selman Waksman", "Alexander Fleming", "Ignaz Semmelweis", "Louis Pasteur"], 0, "Fleming saw Penicillium inhibit Staphylococcus in 1928."),
        q("Which bacteria produce nearly 70% of all antibiotics?", ["Streptomyces", "Penicillium", "Escherichia", "Bacillus"], 0, "Streptomyces are actinomycetes."),
        q("Why use Mueller-Hinton agar?", ["It allows the antimicrobial agent to diffuse freely", "It's selective for staph", "It changes color", "It's cheaper"], 0, "It's part of the standardized method."),
        q("How do you swab the lawn?", ["Three directions: no gaps, then perpendicular, then at 45° to the first", "One direction only", "Just the center", "Stab with a needle"], 0, "Complete plate coverage. Then let it stand at least 5 minutes."),
        q("How far apart do the disks go?", ["At least 24 mm apart", "Touching", "At least 5 mm apart", "Distance doesn't matter"], 0, "Up to 6 disks per plate."),
        q("How do you sterilize the forceps?", ["Dip in alcohol and burn it off, holding the forceps pointed down", "Hold them in the flame until red-hot", "Wipe them on your coat", "Rinse in water"], 0, "Keep the beaker of alcohol away from the flame."),
        q("How do you measure a zone?", ["Diameter in mm with a ruler on the underside (or radius × 2)", "Radius in cm on the lid", "Count the colonies", "Estimate by eye"], 0, "Then compare to Table 25.1."),
        q("Colonies are growing inside a zone of inhibition. They are…", ["Resistant", "Susceptible", "Contaminants that don't matter", "Dead"], 0, "From the class slides: colonies inside a zone are resistant."),
        q("Is a bigger zone always a better drug?", ["No: every drug diffuses differently, so each has its own cutoffs", "Yes, always", "Only for gram-negatives", "Only on blood agar"], 0, "The same zone size can be S for one drug and R for another."),
        q("What does \"I\" (intermediate) mean?", ["May work at a higher dose or where the drug concentrates", "Standard dose should work", "Not likely to work", "The test failed"], 0, "S = should work, R = not likely to work."),
        q("When should cultures for a C&S be collected?", ["Before the first antibiotic dose", "After a week of antibiotics", "Only after symptoms go away", "It doesn't matter"], 0, "Otherwise results can be wrong."),
        q("Antimicrobial drugs vs. disinfectants: which goes into the patient?", ["Antimicrobial drugs", "Disinfectants", "Antiseptics", "Both disinfectants and antiseptics"], 0, "Disinfectants and antiseptics go on surfaces and skin.")]},
    hands:{tab:"26: Hand scrubbing", title:"Effectiveness of Hand Scrubbing", ex:"Exercise 26", render:renderHands,
      question:"How well do water and soap remove bacteria from your hands, and why never all of them?",
      how:["<b>Normal (resident) microbiota:</b> permanent residents of the skin (the skin microbiome). <b>Transient microbiota:</b> picked up from contact with the environment.",
        "<b>Semmelweis, 1846:</b> handwashing cut puerperal fever deaths from 12% to 1.2%. The <b>CDC</b>: handwashing is the single most important way to prevent infection.",
        "A clinical scrub of <b>3 to 5 minutes</b> with antimicrobial soap removes transient microbiota, but <b>not all resident</b> microbiota. Skin is never sterile, which is why surgeons also wear gloves.",
        "<b>Water only:</b> colony counts drop some with each wash as transient bacteria rinse off. <b>Soap:</b> counts usually drop faster, because soap lifts oils and debris that hold bacteria. <b>Never zero?</b> Expected! Resident microbiota live deeper in skin layers and hair follicles."],
      more:[["Reading your plates", null, ["Water plate: 4 sections. Soap plate: 5 sections. Read the sections in the order you touched them, count colonies in each (or estimate if crowded), note different colony types (color, size, shape), and compare the water trend to the soap trend.", "In your notebook: record colony counts for every section of both plates, then answer the Exercise 26 Conclusions and Questions from your lab manual."]]],
      quiz:[
        q("What are transient microbiota?", ["Microbes picked up from contact with the environment", "Permanent residents of the skin", "Bacteria inside hair follicles only", "Endospores"], 0, "Resident microbiota are the permanent skin microbiome."),
        q("What did Semmelweis show in 1846?", ["Handwashing cut puerperal fever deaths from 12% to 1.2%", "Penicillin kills staph", "UV kills bacteria", "Soap sterilizes skin"], 0, "One of the first proofs that hand hygiene saves lives."),
        q("According to the CDC, what is the single most important way to prevent infection?", ["Handwashing", "Antibiotics", "Masks", "Vaccines"], 0, "From the class slides."),
        q("A 3 to 5 minute clinical scrub with antimicrobial soap removes…", ["Transient microbiota, but not all resident microbiota", "All microbes on the skin", "Only resident microbiota", "Nothing"], 0, "That's why surgeons also wear gloves."),
        q("Why do soap counts usually drop faster than water counts?", ["Soap lifts oils and debris that hold bacteria", "Soap is hotter", "Water adds bacteria", "Soap sterilizes the hands"], 0, "Soap helps remove what bacteria cling to."),
        q("Why do counts never reach zero?", ["Resident microbiota live deeper in skin layers and hair follicles", "The plates were contaminated", "Water adds bacteria", "You need 30 minutes of scrubbing"], 0, "Skin is never sterile."),
        q("How many sections are on the water plate and the soap plate?", ["Water: 4, soap: 5", "Water: 5, soap: 4", "Both: 4", "Both: 5"], 0, "Read them in the order you touched them."),
        q("Why do surgeons wear gloves even after scrubbing?", ["Skin is never sterile", "Gloves are warmer", "Scrubbing adds bacteria", "Gloves replace scrubbing"], 0, "Resident microbiota survive the scrub."),
        q("What should you note besides the number of colonies?", ["Different colony types: color, size, and shape", "The smell", "The plate's weight", "Nothing else"], 0, "Different types suggest different organisms.")]}
