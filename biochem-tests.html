<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biochemical Tests | MicroLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
<style>
  .labtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .labtab{border:2px solid var(--line);background:#fff;color:var(--muted);font:700 .85rem var(--font);padding:8px 14px;border-radius:12px;cursor:pointer}
  .labtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .labwrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
  .labhead{margin-bottom:4px}
  .labhead h2{margin:0 0 4px;font-size:1.25rem}
  .labq{color:var(--muted);font-size:.95rem;margin:0 0 16px}
  .labgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:760px){.labgrid{grid-template-columns:1fr}}
  .labstage{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:360px;background:#f7f8fb;border-radius:14px;padding:18px 10px}
  .labpanel h3{font-size:.9rem;font-weight:800;color:var(--ink);margin:0 0 8px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
  .orgrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .orgchip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:.88rem;font-weight:700;cursor:pointer;text-align:left}
  .orgchip i{font-weight:700}
  .orgchip.on{border-color:var(--accent);background:var(--accent-soft)}
  .stepbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .labnote{background:#fff8e6;border:1px solid #f0d99a;border-radius:10px;padding:8px 12px;font-size:.85rem;color:#8a5a00;margin:8px 0}
  .labsafety{background:#fbe8e7;border:1px solid #f0bcb8;border-radius:10px;padding:8px 12px;font-size:.83rem;color:#7a2e28;margin:8px 0}
  .result{border-radius:14px;padding:12px 16px;margin-top:10px;font-size:.95rem}
  .result.pos{background:var(--good-soft);border:2px solid #9fd3b5}
  .result.neg{background:var(--bad-soft);border:2px solid #eab3af}
  .result .tag{display:inline-block;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.8rem;margin-bottom:6px}
  .result.pos .tag{background:var(--good);color:#fff}
  .result.neg .tag{background:var(--bad);color:#fff}
  .explain{font-size:.92rem;line-height:1.55;color:var(--ink)}
  .ctrltag{font-size:.72rem;font-weight:700;color:var(--muted);background:#eef1f5;border-radius:999px;padding:1px 8px;margin-left:6px}
  .labfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:16px}
  .why{background:#f3effd;border:1px solid #d9cdf5;border-radius:10px;padding:10px 14px;font-size:.9rem;color:#3d2a6b;margin-top:12px}
  .result{background:#f3f5f9;border:2px solid var(--line)}
  .result .tag{background:#5a6376;color:#fff}
  .bench{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;margin:8px 0 10px}
  .bench svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
  .bench [data-item],.bench [data-org],.bench [data-bottle]{cursor:grab}
  .pulse{animation:benchpulse 1.1s ease-in-out infinite}
  @keyframes benchpulse{50%{opacity:.25}}
  .benchsteps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
  .bstep{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:#eef1f5;color:var(--muted)}
  .bstep.cur{background:var(--accent);color:#fff}
  .bstep.ok{background:var(--good-soft);color:var(--good)}
  .benchhint{background:var(--accent-soft);border-radius:12px;padding:9px 14px;font-size:.95rem;color:#2c3796;min-height:1.4em}
  .benchhint .muted{color:var(--muted);font-size:.88rem}
  .benchbtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .benchbtns [hidden]{display:none}
  .sugrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
  .sugl{font-size:.85rem;font-weight:700;color:var(--muted);margin-right:4px}
  .sugchip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:700 .85rem var(--font);cursor:pointer;color:var(--ink)}
  .sugchip.on{border-color:#e0a020;background:#fff3d6}
  .quiz{margin-top:22px;border-top:2px dashed var(--line);padding-top:14px}
  .quiz h3{margin:0 0 10px;font-size:1.1rem;color:var(--more)}
  .qcard{background:#faf8ff;border:1px solid #e3dbf6;border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .qq{margin:0 0 8px;font-weight:700}
  .qopts{display:flex;flex-direction:column;gap:6px}
  .qopt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:400 .92rem var(--font);color:var(--ink);cursor:pointer}
  .qopt:hover:not(:disabled){border-color:var(--more)}
  .qopt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
  .qopt.wrong{border-color:#eab3af;background:var(--bad-soft);opacity:.75;cursor:default}
  .qcard.done .qopt:not(.right){opacity:.55}
  .qfb{margin-top:8px;font-size:.9rem;border-radius:10px;padding:7px 12px}
  .qfb.good{background:var(--good-soft);color:#14593a}
  .qfb.bad{background:var(--bad-soft);color:#7a2e28}
  .qscore{font-weight:700;color:var(--more)}
  .labhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .quizhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
  .quizhead h3{margin:0}
  .tmodal{position:fixed;inset:0;background:rgba(20,24,36,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
  .tmodal[hidden]{display:none}
  .tcard{background:#fff;border-radius:22px;max-width:920px;width:100%;padding:22px 24px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:tpop .25s ease-out}
  @keyframes tpop{from{transform:translateY(14px);opacity:0}}
  .thead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
  .thead h2{margin:2px 0 0;font-size:1.35rem}
  .tkick{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9a6212}
  .tclose{border:none;background:#eef1f5;border-radius:50%;width:38px;height:38px;font-size:1.4rem;cursor:pointer;color:var(--ink);flex:none}
  .tasks{background:linear-gradient(135deg,#fff4de,#fdeceb);border-radius:16px;padding:12px 16px;margin-bottom:12px}
  .tasks p{margin:4px 0 0;font-size:1.08rem;line-height:1.45}
  .tlabel{display:block;font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .tsec{margin:14px 0}
  .tsec h3{font-size:.95rem;margin:0 0 8px;color:var(--accent)}
  .tsec p{margin:0;line-height:1.55;font-size:.95rem}
  .tsec p + p{margin-top:10px}
  .tflowwrap{background:#f7f8fb;border-radius:14px;padding:8px;overflow-x:auto}
  .tflow{display:block;width:100%;min-width:720px;height:auto}
  .teqs{display:flex;flex-direction:column;gap:6px}
  .teq{background:#f3effd;border-left:4px solid var(--more);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
  .tq{font-weight:700;font-size:1rem;color:#2a1f4a;font-family:"Atkinson Hyperlegible",ui-monospace,monospace}
  .tn{font-size:.82rem;color:var(--muted);font-style:italic}
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:720px){.tgrid{grid-template-columns:1fr}.tcard{padding:16px}}
  .tind{display:block;width:100%;max-width:440px;height:auto}
  .tnoind{background:#f7f8fb;border-radius:12px;padding:10px 12px}
  .tio{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tio>div:not(.tarrow){flex:1;min-width:150px}
  .tarrow{font-size:1.6rem;color:var(--muted);font-weight:700}
  .tchip{display:inline-block;background:#eef1f5;border-radius:999px;padding:4px 11px;margin:3px 4px 0 0;font-size:.86rem;font-weight:700}
  .textra{margin-top:8px!important;background:#fff8e6;border-radius:10px;padding:8px 12px;color:#6b4a00}
  .treads{display:flex;flex-wrap:wrap;gap:12px}
  .tread{display:flex;flex-direction:column;align-items:center;background:#f7f8fb;border-radius:14px;padding:8px 10px;min-width:104px;text-align:center}
  .tread b{font-size:.9rem;margin-top:2px}
  .tread span{font-size:.8rem;color:var(--muted)}
  .tmini{width:84px;height:auto}
  .tlinks{display:flex;flex-wrap:wrap;gap:8px}
  .treadnote{margin-top:10px!important;background:#eef1fb;border-radius:10px;padding:8px 12px;font-size:.9rem;color:#2c3796}
  .tfoot{display:flex;justify-content:flex-end;margin-top:8px}
  .trun{margin:0;padding:0;list-style:none;counter-reset:run;display:grid;gap:8px}
  .trun li{counter-increment:run;display:flex;gap:10px;align-items:flex-start;background:#f7f8fb;border-radius:12px;padding:9px 12px;font-size:1rem;line-height:1.45}
  .trun li::before{content:counter(run);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.9rem;display:flex;align-items:center;justify-content:center}
  .ttblwrap{overflow-x:auto}
  .ttbl{width:100%;border-collapse:collapse;font-size:.98rem}
  .ttbl th,.ttbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  .ttbl th{background:#eef1f8;font-size:.9rem}
  .tdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#8b93a3;margin-right:7px;vertical-align:1px}
  .tdot.pos{background:var(--good)} .tdot.neg{background:var(--bad)}
  .ttips{margin:0;padding-left:20px;line-height:1.6;font-size:1rem}
  .ttips li{margin-bottom:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  /* ================= Test definitions ================= */
  const C_RED = "#d9443a", C_YEL = "#f2d23c", C_PINK = "#e0679e", C_COPPER = "#b98a52", C_BROTH = "#f3e6bd", C_PURPLE = "#4b2a8a";
  const SUGARS = ["glucose", "lactose", "sucrose"];
  const SUGAR_LABEL = {glucose:"Glucose", lactose:"Lactose", sucrose:"Sucrose"};
  const q = (q, opts, a, why) => ({q, opts, a, why});

  const TESTS = [
    {key:"msa", tab:"MSA", title:"Mannitol Salt Agar (MSA)", medium:"plate", tools:["loop"], incubate:true, base:{fill:"#ef9a8c"},
     question:"Is this bacterium salt-tolerant, and does it ferment mannitol?",
     setup:"7.5% NaCl selects for salt-tolerant bacteria (mostly <i>Staphylococcus</i>); mannitol + phenol red is the differential part.",
     orgs:[
       {name:"Staphylococcus aureus", short:"S. aureus", cap:"#e0a020", growth:true, man:true},
       {name:"Staphylococcus epidermidis", short:"S. epidermidis", cap:"#9a6212", growth:true, man:false},
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", growth:false},
       {name:"Alcaligenes faecalis", short:"A. faecalis", cap:"#5a6376", growth:false}
     ],
     reagents:[],
     outcome:o => !o.growth
       ? {vis:{colonies:null}, cls:"neg", tag:"No growth", text:`Nothing grows: <i>${o.short}</i> can't tolerate 7.5% salt.`}
       : o.man
       ? {vis:{colonies:{fill:"#f2d23c", halo:"#f2d23c"}}, cls:"pos", tag:"Grows, mannitol +", text:`<b>Yellow colonies with yellow agar around them.</b> <i>${o.short}</i> tolerates salt and ferments mannitol; the acid turns phenol red yellow.`}
       : {vis:{colonies:{fill:"#f6e8e0", stroke:"#d9b7ab"}}, cls:"neg", tag:"Grows, mannitol −", text:`<b>It grows, but the agar stays pink-red.</b> <i>${o.short}</i> is salt-tolerant but doesn't ferment mannitol.`},
     why:"One plate, two questions: does it grow in 7.5% salt (selective), and does it ferment mannitol (differential)?",
     quiz:[q("What makes MSA selective?", ["7.5% NaCl (high salt)", "Bile salts", "Crystal violet", "Iodine"], 0, "Only salt-tolerant bacteria grow."),
       q("What is the pH indicator?", ["Phenol red", "Neutral red", "Methyl red", "Bromothymol blue"], 0, "Phenol red turns yellow when mannitol fermentation makes acid."),
       q("Yellow agar around colonies means…", ["The organism fermented mannitol (acid)", "No growth", "It's gram-negative", "It made H₂S"], 0, "Acid from mannitol turns phenol red yellow.")]},
    {key:"emb", tab:"EMB", title:"Eosin Methylene Blue (EMB) Agar", medium:"plate", tools:["loop"], incubate:true, base:{fill:"#6c4a7e"},
     question:"Is this bacterium gram-negative, and does it ferment lactose?",
     setup:"Eosin Y and methylene blue dyes inhibit gram-positives and double as lactose-fermentation indicators.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", growth:true, kind:"sheen"},
       {name:"Alcaligenes faecalis", short:"A. faecalis", cap:"#5a6376", growth:true, kind:"none"},
       {name:"Staphylococcus aureus", short:"S. aureus", cap:"#e0a020", growth:false},
       {name:"Staphylococcus epidermidis", short:"S. epidermidis", cap:"#9a6212", growth:false}
     ],
     reagents:[],
     outcome:o => !o.growth
       ? {vis:{colonies:null}, cls:"neg", tag:"No growth", text:`Nothing grows: the dyes inhibit gram-positive <i>${o.short}</i>.`}
       : o.kind === "sheen"
       ? {vis:{colonies:{fill:"#1f2f28", sheen:true}}, cls:"pos", tag:"Strong fermenter", text:`Dark colonies with a <b>green metallic sheen</b>: <i>${o.short}</i> ferments lactose fast and hard enough to precipitate the dyes.`}
       : {vis:{colonies:{fill:"#efe7d6", stroke:"#cdbfa0"}}, cls:"neg", tag:"Non-fermenter", text:`<b>Colorless to translucent colonies.</b> <i>${o.short}</i> is gram-negative (it grew) but does not ferment lactose, so no acid is made and the dyes are not absorbed.`},
     why:"One plate, two questions: does it grow (selective) and does it ferment lactose (differential)? Strong fermenters make dark colonies with a metallic green sheen; non-fermenters stay colorless.",
     quiz:[q("What do eosin Y and methylene blue do on EMB?", ["Inhibit gram-positives AND indicate lactose fermentation", "Only add color", "Kill gram-negatives", "Detect H₂S"], 0, "The same dyes are both selective and differential."),
       q("A green metallic sheen means…", ["Strong, fast lactose fermentation (like <i>E. coli</i>)", "No growth", "Gram-positive", "Urease positive"], 0, "So much acid that the dyes precipitate on the colony."),
       q("After incubation, what do you add?", ["Nothing: just read the plate", "Methyl red", "Zinc", "Iodine"], 0, "Read the colonies directly.")]},
    {key:"starch", tab:"Starch", title:"Starch Hydrolysis Test", medium:"plate", tools:["loop"], incubate:true, base:{fill:"#efe2bf"},
     question:"Does this bacterium secrete amylase to break down starch?",
     setup:"A starch agar plate. Streak, incubate, then flood with Gram's iodine.",
     orgs:[
       {name:"Bacillus subtilis", short:"B. subtilis", cap:"#2f9e63", pos:true},
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", pos:false}
     ],
     reagents:[{name:"Gram's iodine", drops:"flood", liquid:"#7a4a1f", bottle:"#5a3a1a", note:"Flood the whole plate, then wait about 30 seconds."}],
     outcome:o => o.pos
       ? {vis:{colonies:{fill:"#f4ecd6", stroke:"#c9b98f"}, iodine:true, halo:true}, cls:"pos", tag:"Starch hydrolyzed", text:`Iodine turns the starch <b>blue-black</b>, but there's a <b>clear zone</b> around the growth. <i>${o.short}</i> secreted amylase, which broke the starch down before the iodine could stain it.`}
       : {vis:{colonies:{fill:"#f4ecd6", stroke:"#c9b98f"}, iodine:true, halo:false}, cls:"neg", tag:"No hydrolysis", text:`The whole plate turns <b>blue-black</b> right up to the growth. <i>${o.short}</i> didn't break down the starch.`},
     why:"Starch is too big to enter a cell, so amylase is secreted OUTSIDE to chop it into sugars small enough to feed glycolysis.",
     quiz:[q("What does the starch test detect?", ["Amylase secreted outside the cell", "Urease", "Lactose fermentation", "Nitrate reductase"], 0, "Amylase breaks starch into smaller sugars."),
       q("What reagent is added and what does it stain?", ["Gram's iodine: stains intact starch blue-black", "Methyl red: stains acid red", "Kovac's: stains indole red", "Phenol red: stains acid yellow"], 0, "Iodine binds starch, not the broken-down sugars."),
       q("A clear zone around the growth means…", ["The starch there was broken down (amylase positive)", "No growth", "The iodine didn't work", "The organism is gram-negative"], 0, "No starch left to stain = clear.")]},
    {key:"of", tab:"OF-Dextrose", title:"OF-Dextrose (Hugh-Leifson) Test", medium:"of", tools:["needle", "loop"], incubate:true, base:{},
     step:{when:"pre", label:"Add mineral oil", name:"Add mineral oil", title:"Adding mineral oil", sub:"about 1 cm on the right-hand tube", dur:1800,
       drop:{name:"Mineral oil", amt:"about 1 cm", liquid:"#f3e7a6", bottle:"#9c8530"},
       hint:"Inoculated both tubes! Now drag the <b>dropper</b> to the <b>mineral oil</b> bottle, then over the <b>right-hand tube</b> to add about 1 cm of oil. The left tube stays open to the air.", need:"Add the mineral oil to one tube first (drag the dropper to the oil bottle, then to the right-hand tube), then tap Incubate."},
     question:"Does this bacterium use dextrose (glucose) with oxygen, without oxygen, or not at all?",
     setup:"Two tubes of OF-dextrose medium: low peptone, high dextrose, and phenol red. Inoculate both tubes, cover one with about 1 cm of mineral oil to keep air out, and leave the other open. Yellow means acid was made.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", r:"F"},
       {name:"Pseudomonas aeruginosa", short:"P. aeruginosa", cap:"#2f9e63", r:"O"},
       {name:"Alcaligenes faecalis", short:"A. faecalis", cap:"#5a6376", r:"N"}
     ],
     reagents:[],
     outcome:o => o.r === "F"
       ? {vis:{open:{top:C_YEL, bot:C_YEL}, sealed:{top:C_YEL, bot:C_YEL}, oil:true, growth:true}, cls:"pos", tag:"Fermentative", text:`<b>Both tubes are yellow.</b> <i>${o.short}</i> made acid from dextrose even in the oil-sealed tube, where there is no oxygen. It uses dextrose without O₂, so it is fermentative.`}
       : o.r === "O"
       ? {vis:{open:{top:C_YEL, bot:"#e9923a"}, sealed:{top:C_RED, bot:C_RED}, oil:true, growth:true}, cls:"pos", tag:"Oxidative", text:`<b>The open tube is yellow, the sealed tube is not.</b> <i>${o.short}</i> only makes acid from dextrose when oxygen is available, so it is oxidative.`}
       : {vis:{open:{top:C_RED, bot:C_RED}, sealed:{top:C_RED, bot:C_RED}, oil:true, growth:true}, cls:"neg", tag:"Neither", text:`<b>Neither tube changed.</b> <i>${o.short}</i> is not using dextrose. It is breaking down the peptone instead, so no acid builds up.`},
     why:"Open tube = air, oil tube = no air. Low peptone keeps alkaline waste from hiding the weak acid made from dextrose, and yellow means acid.",
     quiz:[q("What does the mineral oil do?", ["Keeps oxygen out of that tube", "Adds more sugar", "Kills the bacteria", "Changes the pH"], 0, "The oil layer blocks air, so the sealed tube shows what the organism can do without oxygen."),
       q("The open tube is yellow and the sealed tube is not. The organism is…", ["Oxidative", "Fermentative", "Neither", "Contaminated"], 0, "Acid only with oxygen means it needs O₂ to use dextrose."),
       q("Both tubes are yellow. The organism is…", ["Fermentative", "Oxidative", "Neither", "Gram-positive"], 0, "Acid even without oxygen means it ferments dextrose."),
       q("Neither tube changes color. What does that mean?", ["It uses peptone, not dextrose", "It ferments dextrose", "It needs oxygen to use dextrose", "Phenol red failed"], 0, "No acid from dextrose in either tube: the organism is using the peptone."),
       q("Why does OF medium have low peptone and high dextrose?", ["So alkaline waste from peptone doesn't hide a weak acid from dextrose", "To make the medium solid", "To kill gram-positives", "To stop gas"], 0, "Less peptone means less alkaline waste, so a weak acid still turns phenol red yellow.")]},
    {key:"durham", tab:"Durham sugar", title:"Durham Sugar Fermentation Test", medium:"broth", tools:["loop"], durham:true, incubate:true,
     base:{fill:C_RED}, sugars:true,
     question:"Can this bacterium ferment the sugar in the tube, and does it make gas?",
     setup:"Phenol red broth with one sugar (0.5 to 1%) and a small upside-down Durham tube inside to trap gas. Pick a sugar, then inoculate.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", sug:{glucose:"AG", lactose:"AG", sucrose:"-"}, note:{sucrose:"Most lab strains of <i>E. coli</i> can't ferment sucrose (a few strains can)."}},
       {name:"Enterobacter aerogenes", short:"E. aerogenes", cap:"#c4532f", sug:{glucose:"AG", lactose:"AG", sucrose:"AG"}},
       {name:"Alcaligenes faecalis", short:"A. faecalis", cap:"#5a6376", sug:{glucose:"-", lactose:"-", sucrose:"-"}, alk:true},
       {name:"Proteus vulgaris", short:"P. vulgaris", cap:"#9a6212", sug:{glucose:"AG", lactose:"-", sucrose:"AG"}}
     ],
     outcome:(o, c) => {
       const r = o.sug[c.sugar], sugar = SUGAR_LABEL[c.sugar].toLowerCase(), extra = o.note && o.note[c.sugar] ? " " + o.note[c.sugar] : "";
       if (r === "AG") return {vis:{fill:C_YEL, gas:true, turbid:true}, cls:"pos", tag:"Acid + gas", text:`<b>Yellow broth and a bubble</b> in the Durham tube. <i>${o.short}</i> fermented ${sugar}: lactic acid dropped the pH so phenol red turned yellow, and alcohol fermentation made ethanol and CO₂ gas, which rose into the little tube as a bubble.`};
       if (r === "A") return {vis:{fill:C_YEL, gas:false, turbid:true}, cls:"pos", tag:"Acid, no gas", text:`<b>Yellow, but no bubble.</b> <i>${o.short}</i> fermented ${sugar} and made acid, but its fermentation pathway doesn't release gas. Color = acid; bubble = gas. They're two separate readouts.`};
       return {vis:{fill:o.alk ? "#e0457a" : C_RED, gas:false, turbid:true}, cls:"neg", tag:"No fermentation", text:`<b>Still red (or even pinker), no bubble.</b> <i>${o.short}</i> grew (the broth is cloudy) but didn't ferment ${sugar}, so no acid and no gas.${o.alk ? " The deeper pink means it broke down peptones instead, releasing ammonia, which raises the pH." : ""}${extra}`};
     },
     reagents:[],
     why:"Acid from fermentation turns phenol red yellow; gas from fermentation collects as a bubble in the Durham tube. Running the same organism in different sugars builds a fingerprint used to identify it.",
     quiz:[q("What does the Durham sugar test tell you?", ["Whether the organism ferments that sugar (acid) and makes gas", "Whether the organism has urease", "Whether it can use citrate as its only carbon source", "Whether it is gram-negative"], 0, "It reads two things at once: acid from fermenting the sugar, and gas from the fermentation pathway."),
       q("What is the pH indicator?", ["Phenol red", "Methyl red", "Bromothymol blue", "Crystal violet"], 0, "Phenol red: red/pink at neutral or alkaline pH, yellow when acid builds up."),
       q("The broth turns yellow but the Durham tube has NO bubble. That means…", ["Acid was made, but no gas", "Gas was made, but no acid", "No fermentation at all", "The tube is contaminated"], 0, "Color = acid, bubble = gas. Yellow without a bubble means the sugar was fermented by a pathway that doesn't release gas."),
       q("What does the bubble in the Durham tube actually show?", ["CO₂ gas released by fermentation", "Oxygen being used up", "The pH dropped", "The bacteria are motile"], 0, "Alcohol fermentation makes ethanol and CO₂. The CO₂ gas rises into the upside-down tube."),
       q("After incubation, what do you add before reading it?", ["Nothing: read it directly", "4 drops of methyl red", "Kovac's reagent", "Zinc dust"], 0, "The indicator is already in the broth and the Durham tube is already inside, so you just read the color and look for a bubble.")]},
    {key:"mr", tab:"Methyl Red", title:"Methyl Red (MR) Test", medium:"broth", tools:["loop"], incubate:true, base:{fill:C_BROTH},
     question:"Does this bacterium make lots of stable acid (mixed-acid fermentation)?",
     setup:"MRVP broth (glucose broth). After incubation, add 5 drops of methyl red and read the color right away.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", pos:true},
       {name:"Enterobacter aerogenes", short:"E. aerogenes", cap:"#c4532f", pos:false},
       {name:"Alcaligenes faecalis", short:"A. faecalis", cap:"#5a6376", pos:false, nofer:true},
       {name:"Proteus vulgaris", short:"P. vulgaris", cap:"#9a6212", pos:true}
     ],
     reagents:[{name:"Methyl red", drops:5, liquid:"#d9443a", bottle:"#7a2b1f"}],
     outcome:o => o.pos
       ? {vis:{fill:C_RED, turbid:true}, cls:"pos", tag:"MR positive", text:`<b>Red</b> right away. <i>${o.short}</i> uses mixed-acid fermentation, which piles up enough stable acid (lactic, acetic, succinic, formic) to push the pH below 4.4, where methyl red is red.`}
       : {vis:{fill:C_YEL, turbid:true}, cls:"neg", tag:"MR negative", text:o.nofer ? `<b>Yellow.</b> <i>${o.short}</i> does not ferment glucose, so no stable acid builds up and the pH stays above about 6.` : `<b>Yellow.</b> <i>${o.short}</i> still fermented glucose, but through the butanediol pathway, which makes much less acid, so the pH stays above about 6. Check its VP test: it's probably positive.`},
     why:"MR and VP use the same broth and usually give opposite results: the mixed-acid pathway (MR+) and the butanediol pathway (VP+) both start at pyruvate.",
     quiz:[q("What does the MR test detect?", ["Lots of stable acid from mixed-acid fermentation", "Acetoin from the butanediol pathway", "Gas from fermentation", "Urease"], 0, "A positive means so much stable acid that the pH drops below 4.4."),
       q("What is the pH indicator?", ["Methyl red", "Phenol red", "Bromothymol blue", "Neutral red"], 0, "Methyl red is the indicator: red below pH 4.4, yellow above about 6.2."),
       q("After incubation, how do you finish the test?", ["Add 5 drops of methyl red and read right away", "Add 18 drops of α-naphthol then KOH and wait", "Flood with iodine", "Add zinc dust"], 0, "Just a few drops of methyl red; the color shows up immediately."),
       q("A tube is yellow after adding methyl red. That organism most likely…", ["Fermented glucose with the butanediol pathway (less acid)", "Didn't grow", "Made lots of stable acid", "Is urease positive"], 0, "Yellow means the pH stayed above ~6: less acid, typical of the butanediol (VP+) pathway.")]},
    {key:"vp", tab:"Voges-Proskauer", title:"Voges-Proskauer (VP) Test", medium:"broth", tools:["loop"], incubate:true, base:{fill:C_BROTH},
     question:"Does this bacterium use the butanediol pathway (making acetoin)?",
     setup:"The second MRVP tube, tested for acetoin instead of acid. Add 12 drops of VP reagent I, then 3 drops of VP reagent II, shake, then let it sit 15 to 30 minutes.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", pos:false},
       {name:"Enterobacter aerogenes", short:"E. aerogenes", cap:"#c4532f", pos:true},
       {name:"Alcaligenes faecalis", short:"A. faecalis", cap:"#5a6376", pos:false, nofer:true},
       {name:"Proteus vulgaris", short:"P. vulgaris", cap:"#9a6212", pos:false}
     ],
     reagents:[{name:"VP reagent I", drops:12, liquid:"#f1ead0", bottle:"#6b5a2f"}, {name:"VP reagent II", drops:3, liquid:"#eef1f5", bottle:"#3b4250", wait:"Shake, then let it sit 15 to 30 min"}],
     outcome:o => o.pos
       ? {vis:{fill:"#d0455d", turbid:true}, cls:"pos", tag:"VP positive", text:`<b>Pink-red</b> after shaking and waiting. <i>${o.short}</i> made acetoin through the butanediol pathway; the reagents react with acetoin (with oxygen from shaking) to form the red color.`}
       : {vis:{fill:C_COPPER, turbid:true}, cls:"neg", tag:"VP negative", text:o.nofer ? `<b>Copper-brown</b> (no pink). <i>${o.short}</i> does not ferment glucose, so it made no acetoin.` : `<b>Copper-brown</b> (no pink). <i>${o.short}</i> made no acetoin, so it isn't using the butanediol pathway. Its MR test is probably positive.`},
     why:"VP has no pH indicator: the color comes from a chemical reaction with acetoin. Waiting long enough matters, or you can get a false negative.",
     quiz:[q("What does the VP test detect?", ["Acetoin, made by the butanediol pathway", "Mixed acids", "Indole", "Hydrogen sulfide"], 0, "Acetoin is the clue that an organism uses the 2,3-butanediol pathway."),
       q("Is there a pH indicator in the VP test?", ["No: the color comes from acetoin reacting with the reagents", "Yes, phenol red", "Yes, methyl red", "Yes, bromothymol blue"], 0, "The pink-red is a chemical reaction product, not a pH change."),
       q("After incubation, how do you finish the test?", ["Add 12 drops of VP reagent I, then 3 drops of VP reagent II, shake, and let it sit 15 to 30 minutes", "Add 4 drops of methyl red", "Add Kovac's reagent", "Read it directly"], 0, "Two reagents, I then II, then shake and give it time to develop."),
       q("Which other test is run in the same MR-VP broth?", ["Methyl red (MR)", "Indole", "Citrate", "Nitrate reduction"], 0, "MR and VP share one broth: split the culture into two tubes, add methyl red to one and the VP reagents to the other.")]},
    {key:"citrate", tab:"Citrate", title:"Citrate Utilization (Simmons Citrate Slant)", medium:"slant", tools:["needle", "loop"], incubate:true, base:{slant:"#4f9a4a", butt:"#4f9a4a"},
     question:"Can this bacterium use citrate as its only carbon source?",
     setup:"A Simmons citrate agar slant: citrate is the only carbon source, with bromothymol blue as the pH indicator. Streak the slant.",
     orgs:[
       {name:"Enterobacter aerogenes", short:"E. aerogenes", cap:"#c4532f", pos:true},
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", pos:false}
     ],
     reagents:[],
     outcome:o => o.pos
       ? {vis:{slant:"#2f5fbf", butt:"#2f5fbf", growth:true}, cls:"pos", tag:"Citrate positive", text:`The slant turns <b>Prussian blue</b> with growth along the streak. <i>${o.short}</i> has citrate permease, pulls citrate in, and uses it as fuel; the byproducts raise the pH, turning bromothymol blue blue.`}
       : {vis:{slant:"#4f9a4a", butt:"#4f9a4a", growth:false}, cls:"neg", tag:"Citrate negative", text:`<b>Stays green, no growth.</b> <i>${o.short}</i> can't bring citrate into the cell, so it has no carbon source here.`},
     why:"Citrate is a Krebs cycle intermediate. This test asks whether a bacterium can take it in from outside and use it as its only fuel.",
     quiz:[q("What does the citrate test ask?", ["Can the organism use citrate as its ONLY carbon source?", "Can it ferment glucose?", "Does it make H₂S?", "Does it have urease?"], 0, "Citrate is the sole carbon source in Simmons citrate agar."),
       q("What is the pH indicator?", ["Bromothymol blue", "Phenol red", "Methyl red", "Neutral red"], 0, "Green at neutral pH, Prussian blue when alkaline."),
       q("Why does a positive turn blue?", ["Using citrate makes alkaline byproducts that raise the pH", "Acid from fermentation", "Oxygen bubbles", "Iron sulfide"], 0, "Alkaline = blue for bromothymol blue."),
       q("How do you inoculate it?", ["Streak the slant surface (a light inoculum), then incubate; nothing is added", "Swirl in broth and add methyl red", "Flood with iodine", "Add zinc"], 0, "A light streak on the slant, then just read the color.")]},
    {key:"gel", tab:"Gelatin", title:"Gelatin Hydrolysis Test", medium:"slant", deep:true, tools:["needle"], incubate:true, base:{slant:"#ead9a0", butt:"#ead9a0"},
     incTitle:"On the back bench", incSub:"room temperature, never the incubator", incMsg:"Resting on the back bench at room temperature…",
     step:{when:"post", label:"Chill in crushed ice", name:"Chill in ice (if liquid)", title:"Chilling in crushed ice", sub:"a few minutes", dur:2000,
       hint:"It looks liquid. Tap <b>Chill in crushed ice</b> for a few minutes, then tilt it again (gently, do not shake)."},
     question:"Can this bacterium break down gelatin with an exoenzyme (gelatinase)?",
     setup:"A tube of nutrient gelatin. Stab straight down the middle with your needle and pull it back out the same path. Gelatin melts above about 28°C, so it stays at room temperature on the back bench, not in the incubator.",
     orgs:[
       {name:"Bacillus subtilis", short:"B. subtilis", cap:"#2f9e63", pos:true},
       {name:"Pseudomonas aeruginosa", short:"P. aeruginosa", cap:"#e0a020", pos:true},
       {name:"Proteus vulgaris", short:"P. vulgaris", cap:"#9a6212", pos:true}
     ],
     reagents:[],
     outcome:(o, c) => !o.pos
       ? {vis:{slant:"#ead9a0", butt:"#ead9a0", gel:"solid", growth:true}, cls:"neg", tag:"Gelatinase negative", text:`The gelatin is still <b>solid</b>. <i>${o.short}</i> grew along the stab but did not break the gelatin down.`}
       : !c.step
       ? {vis:{slant:"#dcb95f", butt:"#dcb95f", gel:"liquid", growth:true}, cls:"", tag:"Looks liquid…", text:`The gelatin looks <b>liquid</b>. That could be gelatinase, or the tube could just be warm. Chill it in crushed ice for a few minutes, then tilt it again.`, needStep:true}
       : {vis:{slant:"#dcb95f", butt:"#dcb95f", gel:"liquid", growth:true}, cls:"pos", tag:"Gelatinase positive", text:`Still <b>liquid</b> after chilling. <i>${o.short}</i> secreted gelatinase (an exoenzyme) that broke the gelatin down, so it can no longer solidify.`},
     why:"Gelatin is a protein too large to enter the cell, so gelatinase is secreted outside. If the tube looks liquid, chill it first: only gelatin that was truly broken down stays liquid in ice.",
     quiz:[q("What does the gelatin test detect?", ["Gelatinase, an exoenzyme that breaks gelatin down", "Acid from a sugar", "H₂S", "Urease"], 0, "Gelatinase breaks gelatin down so it can no longer solidify."),
       q("Why does the gelatin tube stay on the back bench?", ["Gelatin melts above about 28°C, so the incubator would ruin the test", "Bacteria grow faster there", "It needs light", "It needs to stay sterile"], 0, "In a warm incubator even intact gelatin would melt."),
       q("The tube looks liquid. What do you do next?", ["Chill it in crushed ice, then tilt it again", "Shake it hard", "Add iodine", "Add Kovac's reagent"], 0, "Chilling tells you whether it is really broken down or just warm."),
       q("After chilling, the gelatin is still liquid. The result is…", ["Positive: gelatinase broke it down", "Negative: the gelatin is intact", "The test failed", "Acid was made"], 0, "Gelatin that can no longer solidify has been broken down.")]},
    {key:"urea", tab:"Urease", title:"Urease Test (Urea Agar)", medium:"slant", tools:["loop"], incubate:true, base:{slant:"#f4c9a0", butt:"#f4c9a0"},
     question:"Can this bacterium break down urea with urease?",
     setup:"A urea agar slant with phenol red. Use your loop to streak up the slanted surface. No reagents are added: compare the slant to an uninoculated control.",
     orgs:[
       {name:"Staphylococcus epidermidis", short:"S. epidermidis", cap:"#9a6212", pos:true},
       {name:"Bacillus subtilis", short:"B. subtilis", cap:"#2f9e63", pos:false},
       {name:"Proteus vulgaris", short:"P. vulgaris", cap:"#c4532f", pos:true}
     ],
     reagents:[],
     outcome:o => o.pos
       ? {vis:{slant:"#d62a76", butt:"#d62a76", growth:true}, cls:"pos", tag:"Urease positive", text:`The slant turns <b>bright pink (magenta)</b>. <i>${o.short}</i> has urease: it split urea and released ammonia, which raised the pH and turned phenol red pink.`}
       : {vis:{slant:"#f4c9a0", butt:"#f4c9a0", growth:true}, cls:"neg", tag:"Urease negative", text:`<b>Peach, unchanged.</b> <i>${o.short}</i> has no urease, so no ammonia was released and the pH did not rise.`},
     why:"Phenol red is yellow at pH 6.8 and below, and fuchsia at pH 8.4 and above. Urease releases ammonia, so a positive slant turns bright pink.",
     quiz:[q("What does the urease test detect?", ["Urease splitting urea and releasing ammonia", "Acid from a sugar", "Gelatinase", "H₂S"], 0, "Urease releases ammonia from urea."),
       q("Why does a positive slant turn bright pink?", ["Ammonia raises the pH, and phenol red turns pink", "Acid lowers the pH", "Iron reacts with H₂S", "The bacteria are red"], 0, "Alkaline pH turns phenol red fuchsia."),
       q("What color is a negative urea slant?", ["Peach, unchanged", "Bright pink", "Blue", "Black"], 0, "No urease means no color change."),
       q("How do you inoculate a urea slant?", ["Streak up the slanted surface with a loop; add no reagents", "Stab a deep with a needle", "Add 5 drops of methyl red", "Flood with iodine"], 0, "A loop streak on the slant, then compare it to the uninoculated control.")]},
    {key:"phe", tab:"Phenylalanine", title:"Phenylalanine Deaminase Test", medium:"slant", tools:["loop"], incubate:true, base:{slant:"#f1e6b8", butt:"#f1e6b8"},
     question:"Does this bacterium have phenylalanine deaminase, an enzyme that removes the amine group from phenylalanine?",
     setup:"A phenylalanine agar slant. Streak the slant, incubate, then add 4 to 5 drops of ferric chloride directly onto the slant and read it immediately, because the color fades within minutes.",
     orgs:[
       {name:"Proteus mirabilis", short:"P. mirabilis", cap:"#9a6212", pos:true},
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", pos:false}
     ],
     reagents:[{name:"Ferric chloride", drops:5, liquid:"#d9b34a", bottle:"#7a5a1f", note:"4 to 5 drops. Tip the tube to wash it over the slant, and read right away."}],
     outcome:o => o.pos
       ? {vis:{slant:"#2f6b3a", butt:"#f1e6b8", growth:true}, cls:"pos", tag:"Deaminase positive", text:`The slant turns <b>dark green or brown-green</b>. <i>${o.short}</i> removed the amine group from phenylalanine, making phenylpyruvic acid, and ferric chloride reacts with phenylpyruvic acid to give the green color.`}
       : {vis:{slant:"#f1e6b8", butt:"#f1e6b8", growth:true}, cls:"neg", tag:"Deaminase negative", text:`<b>Yellow only, no color change.</b> <i>${o.short}</i> grew but did not make phenylpyruvic acid, so ferric chloride has nothing to react with.`},
     why:"The reagent is added after incubation. Ferric chloride only turns green if phenylalanine was deaminated to phenylpyruvic acid.",
     quiz:[q("What does the phenylalanine test detect?", ["Phenylalanine deaminase activity (phenylpyruvic acid)", "H₂S", "Acid from glucose", "Indole"], 0, "Deaminase removes the amine group from phenylalanine, making phenylpyruvic acid."),
       q("What reagent do you add after incubation?", ["Ferric chloride", "Methyl red", "Kovac's reagent", "Gram's iodine"], 0, "Ferric chloride is added to the growth on the slant."),
       q("What does a positive look like?", ["Dark green", "Cherry red", "Blue-black", "Pink"], 0, "Ferric chloride + phenylpyruvic acid = green."),
       q("Which organism is the classic positive?", ["Proteus mirabilis", "Escherichia coli", "Staphylococcus epidermidis", "Bacillus subtilis"], 0, "P. mirabilis deaminates phenylalanine.")]},
    {key:"h2s", tab:"Peptone Iron Deep", title:"Peptone Iron Deep (H₂S)", medium:"slant", deep:true, tools:["needle"], incubate:true, base:{slant:"#ecdcab", butt:"#ecdcab"},
     question:"Does this bacterium break down sulfur-containing amino acids and release hydrogen sulfide (H₂S)?",
     setup:"A peptone iron deep: the peptone supplies sulfur amino acids and the iron traps any H₂S. There is no sugar and no pH indicator. Stab straight down into the deep with a needle, incubate, then just look: no reagent is added.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", h2s:false},
       {name:"Proteus mirabilis", short:"P. mirabilis", cap:"#9a6212", h2s:true}
     ],
     reagents:[],
     outcome:o => o.h2s
       ? {vis:{slant:"#ecdcab", butt:"#ecdcab", black:true, growth:true}, cls:"pos", tag:"H₂S positive", text:`A <b>black precipitate</b> forms in the tube. <i>${o.short}</i> broke down sulfur-containing amino acids and released H₂S, which reacted with the iron to make black iron sulfide.`}
       : {vis:{slant:"#ecdcab", butt:"#ecdcab", black:false, growth:true}, cls:"neg", tag:"H₂S negative", text:`<b>No black.</b> <i>${o.short}</i> grew along the stab but did not release H₂S, so no iron sulfide formed.`},
     why:"H₂S is a colorless gas, so the iron in the deep is what makes it visible. Black along the stab means H₂S was made.",
     quiz:[q("What are you reading a peptone iron deep for?", ["H₂S production (black iron sulfide)", "Acid from a sugar", "Indole", "Citrate use"], 0, "Black precipitate along the stab = H₂S positive."),
       q("How do you inoculate it?", ["Stab straight down into the deep with a needle", "Swirl a loop in broth", "Streak the surface with a loop", "Smear on a slide"], 0, "A needle stab carries the cells down into the deep."),
       q("What makes the black color?", ["H₂S reacting with iron to make iron sulfide", "Too much acid", "Dead bacteria", "Gas bubbles"], 0, "Black = FeS precipitate = H₂S positive."),
       q("Which amino acids supply the sulfur?", ["Sulfur-containing amino acids in the peptone", "Glucose", "Citrate", "Starch"], 0, "The peptone is the sulfur source; there is no sugar in this deep.")]},
    {key:"mio", tab:"MIO", title:"MIO Medium (Motility, Indole, Ornithine)", medium:"slant", deep:true, tools:["needle"], incubate:true, early:true, base:{slant:"#7d55a8", butt:"#7d55a8"},
     question:"From one stab: is this bacterium motile, does it make indole, and does it have ornithine decarboxylase?",
     setup:"MIO is a semisolid medium that answers three questions from one tube. Stab straight down with your needle and incubate. Read the motility and the medium color first, then add 5 drops of Kovac's reagent last, without shaking.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", mot:true, ind:true, odc:true},
       {name:"Proteus mirabilis", short:"P. mirabilis", cap:"#9a6212", mot:true, ind:false, odc:true},
       {name:"Proteus vulgaris", short:"P. vulgaris", cap:"#c4532f", mot:true, ind:true, odc:false},
       {name:"Klebsiella pneumoniae", short:"K. pneumoniae", cap:"#8e5bd0", mot:false, ind:false, odc:false}
     ],
     reagents:[{name:"Kovac's", drops:5, liquid:"#f0dc7a", bottle:"#8a6d1a", note:"Do not shake it. Let it layer on top.", wait:"Wait 1 to 2 minutes"}],
     outcome:o => ({vis:{slant:o.odc ? "#7d55a8" : "#e6d23a", butt:o.odc ? "#7d55a8" : "#e6d23a", growth:true, haze:o.mot, ring:o.ind ? "#d0243a" : "#efd35a"}, cls:"",
       tag:`${o.mot ? "Motile" : "Non-motile"} · indole ${o.ind ? "+" : "−"} · ornithine ${o.odc ? "+" : "−"}`,
       text:`<b>Motility:</b> ${o.mot ? `growth spreads out from the stab line, so <i>${o.short}</i> is motile (+).` : `growth stays along the stab line only, so <i>${o.short}</i> is non-motile (−).`} `
         + `<b>Indole:</b> ${o.ind ? "a cherry-red ring forms at the top after Kovac's reagent, so tryptophanase made indole (+)." : "the ring at the top stays yellow, so no indole was made (−)."} `
         + `<b>Ornithine decarboxylase:</b> ${o.odc ? "the medium stays purple. Glucose was fermented first, then the decarboxylase made alkaline amines (+)." : "the medium is yellow. Glucose was fermented, but there is no decarboxylase to raise the pH again (−)."}`}),
     why:"One stab, three tests. Motility and the medium color need no reagent. Add Kovac's last, on top and without shaking, and read the top layer after 1 to 2 minutes.",
     quiz:[q("How do you read motility in MIO?", ["Diffuse growth spreading out from the stab line means motile", "A red ring at the top", "A purple medium", "A black precipitate"], 0, "Growth only along the stab line means non-motile."),
       q("What do you add to test for indole, and how?", ["5 drops of Kovac's reagent, without shaking, so it layers on top", "5 drops of methyl red, then shake", "Ferric chloride on the slant", "Zinc dust"], 0, "Kovac's reagent layers on top; a cherry-red ring at the top is positive."),
       q("The MIO medium is purple. What does that show?", ["Ornithine decarboxylase positive", "Ornithine decarboxylase negative", "The organism is motile", "Indole positive"], 0, "Glucose is fermented first (yellow), then the decarboxylase makes alkaline amines and the medium returns to purple."),
       q("A yellow medium in MIO means…", ["Ornithine decarboxylase negative", "Ornithine decarboxylase positive", "Indole positive", "Non-motile"], 0, "Yellow means the acid from glucose was never reversed.")]},
    {key:"nitrate", tab:"Nitrate Reduction", title:"Nitrate Reduction Test", medium:"broth", tools:["loop"], incubate:true, incTitle:"Incubating at 37°C", incSub:"you read it two weeks later", base:{fill:"#f3ecd2"},
     question:"Can this bacterium use nitrate as its final electron acceptor?",
     setup:"Nitrate broth. After incubation, add 5 drops of Nitrate A (sulfanilic acid), then 5 drops of Nitrate B (α-naphthylamine), and wait 1 minute. If there is no color, add a tiny amount of zinc dust and wait 5 minutes.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", res:"nitrite"},
       {name:"Pseudomonas aeruginosa", short:"P. aeruginosa", cap:"#2f9e63", res:"gas"},
       {name:"Micrococcus luteus", short:"M. luteus", cap:"#e0a020", res:"none"}
     ],
     reagents:[{name:"Nitrate A", drops:5, liquid:"#f4f0e0", bottle:"#5a6376"}, {name:"Nitrate B", drops:5, liquid:"#f4f0e0", bottle:"#3b4250", wait:"Wait 1 minute"}],
     zinc:true,
     outcome:(o, c) => {
       if (o.res === "nitrite") return {vis:{fill:C_RED, turbid:true}, cls:"pos", tag:"Positive (nitrite)", text:`<b>Red</b> right after A + B. <i>${o.short}</i> reduced nitrate (NO₃⁻) to nitrite (NO₂⁻), and the reagents turn nitrite red. It can run anaerobic respiration with nitrate as the final electron acceptor. No zinc needed.`};
       if (!c.zinc) return {vis:{fill:"#f3ecd2", turbid:true}, cls:"", tag:"No color yet…", text:`No color after A + B. That's ambiguous: either the nitrate was never touched, or it was reduced all the way past nitrite. Add zinc dust to find out.`, needZinc:true};
       if (o.res === "gas") return {vis:{fill:"#f3ecd2", turbid:true}, cls:"pos", tag:"Positive (reduced past nitrite)", text:`Zinc changes <b>nothing</b>. Zinc would have turned any leftover nitrate red, so there's none left: <i>${o.short}</i> reduced it all the way to N₂ gas (denitrification). That's a positive.`};
       return {vis:{fill:C_RED, turbid:true}, cls:"neg", tag:"Confirmed negative", text:`Zinc turns it <b>red</b>. Zinc reduced the leftover nitrate to nitrite, so the nitrate was still there: <i>${o.short}</i> never used it. Negative.`};
     },
     safety:"Nitrate reagent B is a carcinogen in real labs: gloves, always. Here you can see the chemistry without the hazard.",
     why:"No color after A + B is the tricky case. Zinc settles it: red after zinc = negative (nitrate still there); still no color = positive (reduced past nitrite).",
     quiz:[q("What does the nitrate test ask?", ["Can the organism use nitrate as a final electron acceptor (nitrate reductase)?", "Can it ferment lactose?", "Does it make indole?", "Does it have urease?"], 0, "Nitrate stands in for O₂ in anaerobic respiration."),
       q("What do Nitrate A and B detect?", ["Nitrite (NO₂⁻): it turns red", "Nitrate (NO₃⁻)", "Acid", "Ammonia"], 0, "A + B react with nitrite to make the red color."),
       q("After incubation, how do you finish the test?", ["Add 5 drops each of Nitrate A and B and wait 1 minute; if no color, add zinc dust and wait 5 minutes", "Add 4 drops of methyl red", "Flood with iodine", "Read it directly"], 0, "A + B first; zinc only when there's no color."),
       q("No color after A + B, and it turns red after zinc. The result is…", ["Negative: the nitrate was never reduced", "Positive: reduced to nitrite", "Positive: reduced to N₂ gas", "The test failed"], 0, "Zinc reduced the leftover nitrate itself, so the bacteria never touched it.")]}
  ];

  const MNAME = {durham:s => `Phenol red ${s} broth`, mr:() => "MR-VP broth", vp:() => "MR-VP broth", nitrate:() => "Nitrate broth",
    emb:() => "EMB agar", msa:() => "Mannitol salt agar", citrate:() => "Simmons citrate slant", starch:() => "Starch agar plate",
    phe:() => "Phenylalanine slant", h2s:() => "Peptone iron deep", of:() => "OF-dextrose tubes", gel:() => "Nutrient gelatin deep",
    urea:() => "Urea agar slant", mio:() => "MIO medium"};
  const CULTURE = "#efe3c0";
  const f1 = n => Math.round(n * 10) / 10;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  const seg = (k, a, b) => clamp((k - a) / (b - a), 0, 1);
  const rnd = k => { const v = Math.sin(k * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
  const txt = (x, y, s, o) => { o = o || {}; return `<text x="${f1(x)}" y="${f1(y)}" font-size="${o.fs || 13}" font-weight="${o.w || 700}" fill="${o.col || "#343b4a"}" text-anchor="${o.a || "middle"}"${o.it ? ` font-style="italic"` : ""}${o.cls ? ` class="${o.cls}"` : ""}>${s}</text>`; };

  let active = TESTS[0].key, S = null, anim = null, drag = null, msgOverride = "", sugar = "glucose";
  const $ = id => document.getElementById(id);
  const T = () => TESTS.find(x => x.key === active);

  /* ---------------- layout (wide bench, or a taller one for phones) ---------------- */
  let L = null;
  function layout(){
    const narrow = ($("bench") ? $("bench").clientWidth : innerWidth) < 640, t = T(), n = t.orgs.length;
    if (!narrow){
      L = {narrow, W:900, H:510, fs:1, stagger:false,
        rack:i => ({x:54 + i * 96, y:44}), rackLabelDy:150,
        loop:{x:110, y:418}, needle:{x:110, y:452}, trayY:396,
        med:{x:560, top:118, h:280}, plate:{x:560, y:268, r:132},
        bottle:j => ({x:828, y:110 + j * 150}), zinc:{x:828, y:420}, dropper:{x:715, y:452}};
    } else {
      const dx = Math.min(112, 520 / Math.max(n - 1, 1));
      L = {narrow, W:600, H:820, fs:1.3, stagger:n > 3,
        rack:i => ({x:300 - (n - 1) * dx / 2 + i * dx, y:36}), rackLabelDy:152,
        loop:{x:110, y:690}, needle:{x:110, y:735}, trayY:660,
        med:{x:300, top:260, h:300}, plate:{x:300, y:420, r:150},
        bottle:j => ({x:395 + j * 105, y:700}), zinc:{x:555, y:700}, dropper:{x:430, y:785}};
    }
  }

  /* ---------------- run state ---------------- */
  function reset(){ S = {loaded:null, inoc:false, inocTool:null, streak:1, incubated:false, rIdx:0, filled:null, zinc:false, stepDone:false, done:false, overlay:null}; anim = null; drag = null; msgOverride = ""; }
  const needsIncubate = () => T().incubate;
  const reagentPhase = () => S.inoc && (S.incubated || !needsIncubate()) && S.rIdx < T().reagents.length;
  const ctx = () => ({sugar, zinc:S.zinc, step:S.stepDone});
  const outcome = () => S.loaded ? T().outcome(T().orgs[S.loaded.org], ctx()) : null;
  const needZinc = () => S.done && T().zinc && !S.zinc && outcome() && outcome().needZinc;
  const stepPre = () => !!T().step && T().step.when === "pre";
  /* OF: the mineral oil goes on with the dropper, before incubating */
  const oilDrop = () => T().step && T().step.drop;
  const oilPhase = () => !!oilDrop() && S.inoc && !S.stepDone && !S.incubated;
  const fillCol = () => S.filled === "oil" ? oilDrop().liquid : S.filled !== null ? T().reagents[S.filled].liquid : null;
  const needStep = () => S.done && !!T().step && T().step.when === "post" && !S.stepDone && outcome() && outcome().needStep;
  const orgName = () => S.loaded ? T().orgs[S.loaded.org].short : "";

  /* ---------------- drawing: glassware ---------------- */
  function tubePath(cx, top, w, h, inset){
    const l = cx - w / 2 + inset, r = cx + w / 2 - inset, rr = (r - l) / 2, b = top + h - inset;
    return `M${f1(l)},${f1(top)} L${f1(l)},${f1(b - rr)} A${f1(rr)},${f1(rr)} 0 0 0 ${f1(r)},${f1(b - rr)} L${f1(r)},${f1(top)} Z`;
  }
  function glass(cx, top, w, h){
    return `<path d="${tubePath(cx, top, w, h, 0).replace(/ Z$/, "")}" fill="none" stroke="#8b93a3" stroke-width="3.5" stroke-linejoin="round"/>` +
      `<line x1="${f1(cx - w / 2 + 9)}" y1="${f1(top + 14)}" x2="${f1(cx - w / 2 + 9)}" y2="${f1(top + h - w / 2 - 4)}" stroke="#fff" stroke-width="3" opacity=".7" stroke-linecap="round"/>` +
      `<rect x="${f1(cx - w / 2 - 4)}" y="${f1(top - 4)}" width="${w + 8}" height="7" rx="3" fill="#d6dbe4"/>`;
  }
  const turb = (x0, x1, y0, y1, n, seed) => Array.from({length:n}, (_, k) => `<circle cx="${f1(lerp(x0, x1, rnd(seed + k)))}" cy="${f1(lerp(y0, y1, rnd(seed + k + 97)))}" r="${f1(1.2 + rnd(seed + k + 7) * 1.6)}" fill="#fffdf2" opacity=".75"/>`).join("");

  /* organism source tube in the rack */
  function orgTube(i, o, hot){
    const {x, y} = L.rack(i), w = 30, h = 112, liq = y + 46;
    let s = `<g data-org="${i}">`;
    s += `<clipPath id="oc${i}"><path d="${tubePath(x, y, w, h, 3)}"/></clipPath>`;
    s += `<rect x="${x - 26}" y="${y - 22}" width="52" height="${h + 34}" fill="transparent"/>`;
    s += `<g clip-path="url(#oc${i})"><rect x="${x - w}" y="${liq}" width="${w * 2}" height="${h}" fill="${CULTURE}"/>${turb(x - 12, x + 12, liq + 4, y + h - 6, 16, i * 13)}</g>`;
    s += glass(x, y, w, h) + `<rect x="${x - 19}" y="${y - 18}" width="38" height="20" rx="5" fill="${o.cap}"/>`;
    if (hot) s += `<rect class="pulse" x="${x - 24}" y="${y - 24}" width="48" height="${h + 30}" rx="12" fill="none" stroke="#3f4cc0" stroke-width="3" stroke-dasharray="7 6"/>`;
    s += txt(x, y + L.rackLabelDy - 10 + (L.stagger && i % 2 ? 17 * L.fs : 0), o.short, {fs:11.5 * L.fs, it:true, col:"#343b4a"});
    return s + `</g>`;
  }

  /* the test medium */
  function medBox(){
    const t = T();
    if (t.medium === "plate") return {x0:L.plate.x - L.plate.r, x1:L.plate.x + L.plate.r, y0:L.plate.y - L.plate.r, y1:L.plate.y + L.plate.r};
    if (t.medium === "strip" || t.medium === "slide") return {x0:L.med.x - 120, x1:L.med.x + 120, y0:L.plate.y - 60, y1:L.plate.y + 60};
    if (t.medium === "of") return {x0:L.med.x - 110, x1:L.med.x + 110, y0:L.med.top - 30, y1:L.med.top + L.med.h};
    return {x0:L.med.x - 50, x1:L.med.x + 50, y0:L.med.top - 30, y1:L.med.top + L.med.h};
  }
  function streakPts(){
    /* a hand-drawn serpentine: gently bowed passes joined by rounded turns, sampled densely */
    const {x, y, r} = L.plate, pts = [], rows = [];
    for (let k = 0; k < 5; k++){
      const yy = y - r * .58 + k * r * .29, half = Math.sqrt(Math.max(r * r * .66 - (yy - y) * (yy - y), 0));
      const a = [x - half + 10, yy], b = [x + half - 10, yy + r * .06];
      rows.push(k % 2 ? [b, a] : [a, b]);
    }
    const bez = (p0, p1, p2, p3, n, skip) => { for (let i = skip ? 1 : 0; i <= n; i++){ const u = i / n, v = 1 - u; pts.push([v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0], v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]]); } };
    rows.forEach(([a, b2], k) => {
      const bow = (k % 2 ? 1 : -1) * r * .05, m1 = [lerp(a[0], b2[0], .33), lerp(a[1], b2[1], .33) + bow], m2 = [lerp(a[0], b2[0], .67), lerp(a[1], b2[1], .67) + bow];
      bez(a, m1, m2, b2, 16, k > 0);
      if (k < rows.length - 1){ const nx = rows[k + 1][0], d = Math.sign(b2[0] - a[0]) * r * .22; bez(b2, [b2[0] + d, b2[1]], [nx[0] + d, nx[1]], nx, 10, true); }
    });
    return pts;
  }
  const polyAt = (pts, k) => {
    const lens = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1])), tot = lens.reduce((a, b) => a + b, 0);
    let d = k * tot, out = [pts[0]];
    for (let i = 0; i < lens.length; i++){ if (d >= lens[i]){ out.push(pts[i + 1]); d -= lens[i]; } else { const q = d / lens[i]; out.push([lerp(pts[i][0], pts[i + 1][0], q), lerp(pts[i][1], pts[i + 1][1], q)]); break; } }
    return out;
  };
  const ptsStr = p => p.map(q => `${f1(q[0])},${f1(q[1])}`).join(" ");
  function slantGeom(){
    const cx = L.med.x, w = 76, top = L.med.top, b = top + L.med.h, l = cx - w / 2 + 4, r = cx + w / 2 - 4;
    return T().deep ? {cx, w, top, b, l, r, yHigh:top + 80, yLow:top + 80} : {cx, w, top, b, l, r, yHigh:top + 92, yLow:top + 168};
  }
  /* liquid top for broths */
  const liqTop = () => L.med.top + 70;

  function drawMedium(vis, opts){
    const t = T(), {x0, x1, y0, y1} = medBox();
    let s = "";
    if (opts.hot) s += `<rect class="pulse" x="${x0 - 12}" y="${y0 - 6}" width="${x1 - x0 + 24}" height="${y1 - y0 + 18}" rx="18" fill="none" stroke="#3f4cc0" stroke-width="3" stroke-dasharray="8 6"/>`;
    if (t.medium === "broth"){
      const cx = L.med.x, w = 76, top = L.med.top, h = L.med.h, b = top + h, yl = liqTop();
      s += `<clipPath id="mc"><path d="${tubePath(cx, top, w, h, 3)}"/></clipPath><g clip-path="url(#mc)">`;
      s += `<rect x="${cx - w}" y="${yl}" width="${w * 2}" height="${h}" fill="${vis.fill}"/>`;
      s += `<rect x="${cx - w}" y="${yl}" width="${w * 2}" height="${h}" fill="url(#liqShade)"/>`;
      if (vis.turbid) s += `<rect x="${cx - w}" y="${yl}" width="${w * 2}" height="${h}" fill="#fff" opacity=".16"/>` + turb(cx - 30, cx + 30, yl + 6, b - 8, 70, 5);
      if (vis.ring) s += `<rect x="${cx - w}" y="${yl - 16}" width="${w * 2}" height="18" fill="${vis.ring}"/>`;
      if (t.durham){
        const dt = b - 132, db = b - 22;
        s += `<path d="M${cx - 11},${db} L${cx - 11},${dt + 11} A11,11 0 0 1 ${cx + 11},${dt + 11} L${cx + 11},${db}" fill="${vis.fill}" stroke="#6d7686" stroke-width="2.4"/>`;
        s += `<line x1="${cx - 6}" y1="${dt + 12}" x2="${cx - 6}" y2="${db - 4}" stroke="#fff" stroke-width="2" opacity=".6"/>`;
        if (vis.gas) s += `<path d="M${cx - 9},${dt + 42} L${cx - 9},${dt + 11} A9,9 0 0 1 ${cx + 9},${dt + 11} L${cx + 9},${dt + 42} Q${cx},${dt + 47} ${cx - 9},${dt + 42} Z" fill="#fbfcfe"/>`;
      }
      s += `</g>` + glass(cx, top, w, h);
      if (t.durham) s += txt(cx + 50, b - 80, "Durham", {fs:11 * L.fs, a:"start", col:"#5a6376"}) + txt(cx + 50, b - 66, "tube", {fs:11 * L.fs, a:"start", col:"#5a6376"}) + `<line x1="${cx + 47}" y1="${b - 84}" x2="${cx + 14}" y2="${b - 90}" stroke="#8b93a3" stroke-width="1.5"/>`;
      if (opts.drops) s += opts.drops;
    } else if (t.medium === "slant"){
      const g = slantGeom();
      const tot = g.b - g.yHigh, o1 = (g.yLow - 8 - g.yHigh) / tot, o2 = (g.yLow + 22 - g.yHigh) / tot;
      s += `<linearGradient id="sg" x1="0" y1="${g.yHigh}" x2="0" y2="${g.b}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${vis.slant}"/><stop offset="${f1(o1 * 100) / 100}" stop-color="${vis.slant}"/><stop offset="${f1(o2 * 100) / 100}" stop-color="${vis.butt}"/><stop offset="1" stop-color="${vis.butt}"/></linearGradient>`;
      s += `<clipPath id="mc"><path d="${tubePath(g.cx, g.top, g.w, L.med.h, 3)}"/></clipPath><g clip-path="url(#mc)">`;
      s += `<path d="M${g.l - 4},${g.yHigh} L${g.r + 4},${g.yLow} L${g.r + 4},${g.b + 4} L${g.l - 4},${g.b + 4} Z" fill="url(#sg)"/>`;
      s += `<path d="M${g.l - 4},${g.yHigh} L${g.r + 4},${g.yLow} L${g.r + 4},${g.b + 4} L${g.l - 4},${g.b + 4} Z" fill="url(#liqShade)"/>`;
      if (vis.black){ const y0 = g.yLow + 22;
        s += `<path d="M${g.cx - 2},${y0} C${g.cx - 6},${y0 + 40} ${g.cx - 16},${y0 + 70} ${g.l - 4},${g.b - 70} L${g.l - 4},${g.b + 4} L${g.r + 4},${g.b + 4} L${g.r + 4},${g.b - 82} C${g.cx + 14},${y0 + 66} ${g.cx + 6},${y0 + 40} ${g.cx + 2},${y0} Z" fill="#231e1b" opacity=".93" filter="url(#soft2)"/>`; }
      if (vis.gas) s += `<path d="M${g.l},${g.b - 50} l14,-6 l10,8 l16,-10 M${g.cx - 6},${g.b - 104} l9,10 l-5,9 l11,7 M${g.cx + 8},${g.b - 30} l12,-4 l6,7" fill="none" stroke="#fdfcf8" stroke-width="3" stroke-linecap="round"/><rect x="${g.l - 4}" y="${g.b - 16}" width="${g.w}" height="14" fill="#fdfcf8" opacity=".9"/>`;
      if (vis.bubbles) s += Array.from({length:26}, (_, k) => { const q = rnd(k + 5), bx = lerp(g.l + 8, g.r - 8, q) + (rnd(k) - .5) * 8, by = lerp(g.yHigh + 4, g.yLow, q) - 2 - rnd(k + 2) * 18, br = 3.5 + rnd(k + 9) * 5;
        return `<circle cx="${f1(bx)}" cy="${f1(by)}" r="${f1(br)}" fill="#fff" fill-opacity=".6" stroke="#6fa8cc" stroke-width="1.4"><animate attributeName="r" values="${f1(br * .6)};${f1(br * 1.2)};${f1(br * .6)}" dur="${f1(.7 + rnd(k + 3) * .8)}s" repeatCount="indefinite"/></circle>`; }).join("");
      if (t.deep && vis.gel === "solid") s += `<path d="M${g.l - 4},${g.yHigh} L${g.r + 4},${g.yHigh} L${g.r + 4},${g.b + 4} L${g.l - 4},${g.b + 4} Z" fill="#fff" opacity=".34"/>`;
      if (t.deep && vis.gel === "liquid") s += `<path d="M${g.l - 4},${g.yHigh} L${g.r + 4},${g.yHigh} L${g.r + 4},${g.b + 4} L${g.l - 4},${g.b + 4} Z" fill="#c8861a" opacity=".3"/><path d="M${g.l - 4},${g.yHigh + 4} Q${g.cx},${g.yHigh - 6} ${g.r + 4},${g.yHigh + 4}" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>`
        + Array.from({length:7}, (_, k) => `<circle cx="${f1(lerp(g.l + 8, g.r - 8, rnd(k + 2)))}" cy="${f1(lerp(g.yHigh + 20, g.b - 30, rnd(k + 7)))}" r="${f1(2 + rnd(k + 4) * 2)}" fill="#fff" fill-opacity=".5"/>`).join("");
      if (vis.haze) s += `<ellipse cx="${g.cx}" cy="${f1((g.yHigh + g.b - 24) / 2)}" rx="${f1(g.w / 2 - 12)}" ry="${f1((g.b - 24 - g.yHigh) / 2)}" fill="#fff" opacity=".42" filter="url(#soft)"/>`;
      if (t.deep && vis.growth && !vis.black) s += `<line x1="${g.cx}" y1="${g.yHigh + 6}" x2="${g.cx}" y2="${g.b - 24}" stroke="#f6efd8" stroke-width="3.5" opacity=".95"/>`;
      if (vis.ring) s += `<rect x="${g.l - 4}" y="${g.yHigh - 12}" width="${g.r - g.l + 8}" height="16" fill="${vis.ring}" opacity=".95"/>`;
      if (opts.stab) s += `<line x1="${g.cx}" y1="${g.yLow + 10}" x2="${g.cx}" y2="${g.b - 24}" stroke="${vis.growth ? "#f6efd8" : "#fff7df"}" stroke-width="${vis.growth ? 3.5 : 2}" opacity=".9"/>`;
      if (opts.streak){
        let z = `M${g.l + 6},${g.yHigh + 6}`; const n = 8;
        for (let k = 1; k <= n; k++){ const q = k / n, x = lerp(g.l + 6, g.r - 6, q), y = lerp(g.yHigh + 6, g.yLow + 4, q) + (k % 2 ? 10 : 0); z += ` L${f1(x)},${f1(y)}`; }
        s += `<path d="${z}" fill="none" stroke="${vis.growth ? "#f8f1dc" : "#fff7df"}" stroke-width="${vis.growth ? 6 : 2}" stroke-linejoin="round" stroke-linecap="round" opacity="${vis.growth ? .95 : .8}"/>`;
      }
      s += `</g>` + glass(g.cx, g.top, g.w, L.med.h);
      if (!t.deep) s += txt(g.cx + 52, g.yHigh + 30, "slant", {fs:11 * L.fs, a:"start", col:"#5a6376"}) + txt(g.cx + 52, g.b - 50, "butt", {fs:11 * L.fs, a:"start", col:"#5a6376"});
    } else if (t.medium === "of"){
      const w = 64, top = L.med.top, h = L.med.h, b = top + h, y0 = top + 70;
      [[-70, vis.open, false, "Open to air"], [70, vis.sealed, true, "Oil layer"]].forEach(([dx, c, isOil, lab], n) => {
        const cx = L.med.x + dx;
        s += `<linearGradient id="ofg${n}" x1="0" y1="${y0}" x2="0" y2="${b}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${c.top}"/><stop offset="1" stop-color="${c.bot}"/></linearGradient>`;
        s += `<clipPath id="ofc${n}"><path d="${tubePath(cx, top, w, h, 3)}"/></clipPath><g clip-path="url(#ofc${n})">`;
        s += `<rect x="${cx - w}" y="${y0}" width="${w * 2}" height="${h}" fill="url(#ofg${n})"/><rect x="${cx - w}" y="${y0}" width="${w * 2}" height="${h}" fill="url(#liqShade)"/>`;
        const ok = vis.oilK != null ? vis.oilK : vis.oil ? 1 : 0;
        if (isOil && ok > 0) s += `<rect x="${cx - w}" y="${f1(y0 - 28 * ok)}" width="${w * 2}" height="${f1(28 * ok + 2)}" fill="#f3e7a6" opacity=".92"/><line x1="${cx - w / 2}" y1="${f1(y0 - 28 * ok)}" x2="${cx + w / 2}" y2="${f1(y0 - 28 * ok)}" stroke="#d9c46a" stroke-width="2"/>`;
        if (opts.stab || vis.growth) s += `<line x1="${cx}" y1="${y0 + 4}" x2="${cx}" y2="${b - 26}" stroke="${vis.growth ? "#f6efd8" : "#fff7df"}" stroke-width="${vis.growth ? 4 : 2}" opacity=".9"/>`;
        s += `</g>` + glass(cx, top, w, h) + txt(cx, top - 10, lab, {fs:12 * L.fs, col:"#5a6376"});
      });
    } else if (t.medium === "plate"){
      const {x, y, r} = L.plate;
      s += `<circle cx="${x}" cy="${y + 6}" r="${r + 12}" fill="#d9dee7" opacity=".6"/><circle cx="${x}" cy="${y}" r="${r + 10}" fill="#f2f5f9" stroke="#b9c2cf" stroke-width="3"/>`;
      s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${vis.iodine ? "#2b2340" : vis.agar}"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#agarShade)"/>`;
      if (vis.iodine && vis.halo && opts.streakK) s += `<polyline points="${ptsStr(polyAt(streakPts(), 1))}" fill="none" stroke="${vis.agar}" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>`;
      if (vis.coloniesHalo) s += `<polyline points="${ptsStr(polyAt(streakPts(), 1))}" fill="none" stroke="${vis.coloniesHalo}" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" opacity=".7" filter="url(#soft)"/>`;
      if (opts.streakK && !vis.colonies) s += `<polyline points="${ptsStr(polyAt(streakPts(), opts.streakK))}" fill="none" stroke="#fffbea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;
      if (vis.colonies) s += colonies(vis.colonies);
      s += `<path d="M${x - r * .62},${y - r * .7} A${r * .95},${r * .95} 0 0 1 ${x + r * .3},${y - r * .9}" fill="none" stroke="#fff" stroke-width="5" opacity=".55" stroke-linecap="round"/>`;

  /* ---------------- interaction ---------------- */
  const svgPt = e => { const svg = $("benchSvg"), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };

  const say = m => { msgOverride = m; updateUI(); };

  function canGrab(item){

    if (item === "dropper" && oilDrop()){ if (oilPhase()) return true; say(S.stepDone ? "The oil is already on. Tap Incubate." : S.incubated ? "No reagents to add. Read the tubes." : "Inoculate both tubes first, then add the oil."); return false; }

  function dropAt(){

  const TIPS = {
