<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microscopy and Growth | MicroLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
<style>
  .labtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .labtab{border:2px solid var(--line);background:#fff;color:var(--muted);font:700 .95rem var(--font);padding:9px 16px;border-radius:12px;cursor:pointer}
  .labtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .labwrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
  .labhead h2{margin:0 0 4px;font-size:1.3rem}
  .labq{color:var(--muted);font-size:1rem;margin:0 0 12px}
  .labhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .tmodal{position:fixed;inset:0;background:rgba(20,24,36,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
  .tmodal[hidden]{display:none}
  .tcard{background:#fff;border-radius:22px;max-width:820px;width:100%;padding:22px 24px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:tpop .25s ease-out}
  @keyframes tpop{from{transform:translateY(14px);opacity:0}}
  .thead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
  .thead h2{margin:2px 0 0;font-size:1.35rem}
  .tkick{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9a6212}
  .tclose{border:none;background:#eef1f5;border-radius:50%;width:38px;height:38px;font-size:1.4rem;cursor:pointer;color:var(--ink);flex:none}
  .tasks{background:linear-gradient(135deg,#fff4de,#fdeceb);border-radius:16px;padding:12px 16px;margin-bottom:12px}
  .tasks p{margin:4px 0 0;font-size:1.08rem;line-height:1.45}
  .tlabel{display:block;font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .tsec{margin:14px 0}
  .tsec h3{font-size:.95rem;margin:0 0 8px;color:var(--accent)}
  .tsec ul{margin:6px 0 0;padding-left:20px;line-height:1.6;font-size:1rem}
  .tsec li{margin-bottom:8px}
  .tfoot{display:flex;justify-content:flex-end;margin-top:8px}
  .quizhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
  .quizhead h3{margin:0}
  .btn.sm{font-size:.85rem;padding:6px 14px}
  .howbox{background:#f3effd;border:1px solid #d9cdf5;border-radius:12px;padding:8px 14px;margin:0 0 14px;color:#3d2a6b;font-size:.95rem}
  .howbox summary{cursor:pointer;font-weight:700}
  .howbox ul{margin:8px 0 4px;padding-left:20px;line-height:1.5}
  .sect{font-size:.82rem;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin:20px 0 8px}
  .panel{background:#f7f8fb;border:1px solid var(--line);border-radius:16px;padding:12px}
  .panel svg{display:block;width:100%;height:auto}
  .benchhint{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:1rem;color:#2c3796;min-height:1.5em;line-height:1.45;margin:8px 0}
  .benchhint.good{background:var(--good-soft);color:#14593a}
  .benchhint.warn{background:#fff3d6;color:#7a4b00}
  .btn{font:700 .95rem var(--font);border-radius:999px;padding:8px 18px;cursor:pointer;border:2px solid var(--accent)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.secondary{background:#fff;color:var(--accent)}
  .btn.hint{border-color:#e5c56a;background:#fff8e6;color:#8a5a00}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
  .chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:700 .9rem var(--font);color:var(--ink);cursor:pointer}
  .chip.on{border-color:var(--accent);background:var(--accent-soft)}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:820px){.grid2{grid-template-columns:1fr}}
  .info{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:5.5em}
  .info h4{margin:0 0 4px;font-size:1.05rem}
  .mpart{cursor:pointer}
  .mpart:hover{filter:brightness(1.18)}
  .mpart.sel{filter:drop-shadow(0 0 5px #f2b134) brightness(1.1)}
  .mpart.flash{filter:drop-shadow(0 0 6px #1b7f4e)}
  .ans{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .ans button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font:700 .95rem var(--font);color:var(--ink);cursor:pointer}
  .ans button:hover:not(:disabled){border-color:var(--accent)}
  .ans button.right{border-color:var(--good);background:var(--good-soft)}
  .ans button.wrong{border-color:#eab3af;background:var(--bad-soft)}
  .tbl{width:100%;border-collapse:collapse;font-size:.95rem;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  .tbl th{background:#eef1f8}
  .tblwrap{overflow-x:auto}
  .ogame .odone{margin:8px 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .ogame .odone li{background:var(--good-soft);border:2px solid #9fd3b5;border-radius:12px;padding:8px 12px;font-size:.95rem}
  .ogame .odone li small{display:block;color:#14593a;margin-top:2px}
  .ogame .opool{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .ogame .opool button{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font:400 .95rem var(--font);color:var(--ink);cursor:pointer}
  .ogame .opool button:hover{border-color:var(--accent)}
  .ogame .opool button.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .numrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
  .numrow input{width:110px;font:400 1rem var(--font);padding:7px 10px;border-radius:10px;border:2px solid var(--line)}
  .why{background:#f3effd;border:1px solid #d9cdf5;border-radius:10px;padding:10px 14px;font-size:.92rem;color:#3d2a6b;margin-top:10px}
  .quiz{margin-top:24px;border-top:2px dashed var(--line);padding-top:14px}
  .quiz h3{margin:0 0 10px;font-size:1.1rem;color:var(--more)}
  .qcard{background:#faf8ff;border:1px solid #e3dbf6;border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .qq{margin:0 0 8px;font-weight:700}
  .qopts{display:flex;flex-direction:column;gap:6px}
  .qopt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:400 .95rem var(--font);color:var(--ink);cursor:pointer}
  .qopt:hover:not(:disabled){border-color:var(--more)}
  .qopt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
  .qopt.wrong{border-color:#eab3af;background:var(--bad-soft);opacity:.75;cursor:default}
  .qcard.done .qopt:not(.right){opacity:.55}
  .qfb{margin-top:8px;font-size:.92rem;border-radius:10px;padding:7px 12px}
  .qfb.good{background:var(--good-soft);color:#14593a}
  .qfb.bad{background:var(--bad-soft);color:#7a2e28}
  .qscore{font-weight:700;color:var(--more)}
  .benchsteps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
  .bstep{font-size:.88rem;font-weight:700;border-radius:999px;padding:4px 11px;background:#eef1f5;color:var(--muted)}
  .bstep.cur{background:var(--accent);color:#fff}
  .bstep.ok{background:var(--good-soft);color:var(--good)}
  .pgpic svg{max-height:270px;margin:0 auto}
  .rulebox{border:2px solid var(--accent);border-radius:16px;padding:14px 16px;margin:4px 0 6px;background:#fbfbff}
  .rulehead{font-size:1.15rem;font-weight:700;color:#2c3796;margin:0 0 10px}
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .rule{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center}
  .rule svg{width:100%;max-width:130px;height:auto;display:block;margin:0 auto}
  .rule p{margin:4px 0 0;font-size:1rem;line-height:1.35}
  .rulelist{margin:12px 0 0;padding-left:20px;font-size:1.02rem;line-height:1.55}
  .rulelist li{margin-bottom:4px}
  .hdbench{padding:6px;max-width:none;max-height:none}
  .hdbench svg{touch-action:none;user-select:none;-webkit-user-select:none}
  .hdbench [data-item]{cursor:grab}
  .pulse{animation:benchpulse 1.1s ease-in-out infinite}
  @keyframes benchpulse{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="drag.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const f1 = n => Math.round(n * 10) / 10;
  const rnd = k => { const v = Math.sin(k * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"})[c]);
  const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const q = (qq, opts, a, why) => ({q:qq, opts, a, why});
  let cleanups = [];
  const onCleanup = fn => cleanups.push(fn);

  /* ================================================================= shared widgets */
  /* put the steps in order */
  function orderGame(host, steps){
    let i, wrong, hints, pool;
    const start = () => {
      i = 0; wrong = 0; hints = 0;
      do { pool = shuffle(steps); } while (pool.length > 1 && pool.every((s, k) => s.id === steps[k].id));
      draw("Tap the steps in the order they happen. Wrong turns are counted.", "");
    };
    const draw = (msg, kind, shakeId) => {
      host.innerHTML = `<div class="ogame"><div class="benchhint ${kind || ""}" role="status">${msg}</div>
        <ol class="odone">${steps.slice(0, i).map((s, k) => `<li><b>${k + 1}.</b> ${s.text}${s.why ? `<small>${s.why}</small>` : ""}</li>`).join("")}</ol>
        ${i < steps.length ? `<div class="opool">${pool.filter(p => steps.findIndex(s => s.id === p.id) >= i).map(p => `<button data-id="${p.id}" class="${p.id === shakeId ? "shake" : ""}">${p.text}</button>`).join("")}</div>` : ""}
        <div class="row">${i < steps.length ? `<button class="btn hint" data-h="1">💡 Hint</button>` : ""}<button class="btn secondary" data-r="1">↺ Start over</button></div></div>`;
    };
    host.onclick = e => {
      if (e.target.closest("[data-r]")) { start(); return; }
      if (e.target.closest("[data-h]")) { hints++; draw("Hint: the next step is about <b>" + esc(steps[i].cue) + "</b>.", "warn"); return; }
      const b = e.target.closest("[data-id]"); if (!b) return;
      if (b.dataset.id === steps[i].id){ i++; if (i >= steps.length) draw(`All ${steps.length} steps in order! Wrong turns: <b>${wrong}</b>. Hints used: <b>${hints}</b>.`, "good"); else draw("Yes! What comes next?", "good"); }
      else { wrong++; draw("Not yet. Think about what has to happen first.", "warn", b.dataset.id); }
    };
    start();
  }

  /* picture identification: items = [{cat, term, svg, desc}] */
  function pictureGame(host, cats, items, label){
    let cat = cats[0], order = [], idx = 0, score = 0, tries = 0, answered = false;
    const next = () => { order = shuffle(items.filter(x => x.cat === cat)); idx = 0; score = 0; tries = 0; show(); };
    const show = () => {
      answered = false;
      const cur = order[idx], terms = items.filter(x => x.cat === cat).map(x => x.term);
      host.innerHTML = `<div class="row">${cats.map(c => `<button class="chip ${c === cat ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
        <div class="grid2"><div class="panel pgpic" style="max-width:300px">${cur.svg}</div>
        <div><p class="qq" style="margin:0 0 6px">${esc(label(cat))}</p><div class="ans">${terms.map(t => `<button data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
        <div class="benchhint" data-fb="1">Picture ${idx + 1} of ${order.length}. Score so far: ${score} of ${tries}.</div>
        <div class="row"><button class="btn primary pgNext" hidden>${idx + 1 >= order.length ? "Start this set again" : "Next picture"}</button></div></div></div>`;
    };
    host.onclick = e => {
      const c = e.target.closest("[data-cat]"); if (c){ cat = c.dataset.cat; next(); return; }
      if (e.target.closest(".pgNext")){ if (idx + 1 >= order.length) next(); else { idx++; show(); } return; }
      const b = e.target.closest("[data-t]"); if (!b || answered) return;
      const cur = order[idx], ok = b.dataset.t === cur.term; tries++;
      if (ok){ score++; answered = true; b.classList.add("right"); const fb = host.querySelector("[data-fb]"); fb.className = "benchhint good"; fb.innerHTML = `<b>Yes: ${esc(cur.term)}.</b> ${cur.desc} Score: ${score} of ${tries}.`; host.querySelectorAll(".ans button").forEach(x => x.disabled = true); host.querySelector(".pgNext").hidden = false; }
      else { b.classList.add("wrong"); b.disabled = true; const fb = host.querySelector("[data-fb]"); fb.className = "benchhint warn"; fb.textContent = "Not quite. Look at the picture again and try another."; }
    };
    next();
  }

  /* quiz */
  function quizHTML(t){
    return `<section class="quiz"><div class="quizhead"><h3>Test yourself</h3><button class="btn secondary sm" id="theoryBtn2">📖 Review the theory first</button></div>` + t.quiz.map((qq, i) => {
      const order = qq.opts.map((_, k) => k).sort((a, b) => rnd(i * 7 + a + tabKey.length) - rnd(i * 7 + b + tabKey.length));
      return `<div class="qcard" data-q="${i}"><p class="qq">${i + 1}. ${qq.q}</p><div class="qopts">${order.map(k => `<button class="qopt" data-k="${k}">${qq.opts[k]}</button>`).join("")}</div><div class="qfb" hidden></div></div>`;
    }).join("") + `<p class="qscore" id="qScore"></p></section>`;
  }
  function bindQuiz(t){
    const box = $("quizBox"), got = {};
    box.querySelectorAll(".qcard").forEach(card => card.addEventListener("click", e => {
      const b = e.target.closest(".qopt"); if (!b || card.classList.contains("done")) return;
      const qq = t.quiz[+card.dataset.q], ok = +b.dataset.k === qq.a, fb = card.querySelector(".qfb");
      if (ok){ card.classList.add("done"); b.classList.add("right"); fb.className = "qfb good"; fb.innerHTML = `<b>Yes!</b> ${qq.why}`; if (!(card.dataset.q in got)) got[card.dataset.q] = true; }
      else { b.classList.add("wrong"); b.disabled = true; fb.className = "qfb bad"; fb.innerHTML = "Not quite. Try another answer."; if (!(card.dataset.q in got)) got[card.dataset.q] = false; }
      fb.hidden = false;
      if (box.querySelectorAll(".qcard.done").length === t.quiz.length) $("qScore").textContent = `Finished! ${Object.values(got).filter(Boolean).length} of ${t.quiz.length} right on the first try.`;
    }));
  }

  /* ================================================================= EXERCISE 1: microscope */
  const PARTS = {
    ocular:{name:"Ocular lens (eyepiece)", fn:"Remagnifies the image formed by the objective lens (usually 10x)."},
    bodytube:{name:"Body tube", fn:"Transmits the image from the objective to the ocular."},
    objectives:{name:"Objective lenses", fn:"The primary magnification lenses, mounted on the nosepiece: 4x, 10x, 40x, and 100x (oil)."},
    stage:{name:"Stage (mechanical stage)", fn:"The platform that holds your slide. The mechanical stage holds and moves it."},
    condenser:{name:"Condenser", fn:"Focuses light through the specimen."},
    iris:{name:"Iris diaphragm", fn:"Controls the cone of light entering the condenser: contrast versus brightness."},
    coarse:{name:"Coarse focus knob", fn:"The large knob. It moves the stage long distances and is for low power (4x, 10x) only."},
    fine:{name:"Fine focus knob", fn:"The small knob for small adjustments. Use it with 40x and oil immersion."},
    arm:{name:"Arm", fn:"Carry the microscope here, with your other hand under the base. Always use two hands."},
    base:{name:"Base", fn:"The foundation. It houses the illuminator (the light source)."}
  };
  function scopeSVG(){
    const knurl = (cx, cy, r, n) => Array.from({length:n}, (_, k) => { const t = k / n * Math.PI * 2; return `<line x1="${f1(cx + Math.cos(t) * (r - 5))}" y1="${f1(cy + Math.sin(t) * (r - 5))}" x2="${f1(cx + Math.cos(t) * r)}" y2="${f1(cy + Math.sin(t) * r)}" stroke="#151a24" stroke-width="2"/>`; }).join("");
    const obj = (x, len, ang, ring) => `<g transform="rotate(${ang} ${x} 186)"><rect x="${x - 8}" y="186" width="16" height="${len}" rx="3" fill="url(#mSilver)" stroke="#5d6676" stroke-width="1"/><rect x="${x - 8}" y="${186 + len * .45}" width="16" height="5" fill="${ring}"/><rect x="${x - 5}" y="${186 + len - 3}" width="10" height="6" rx="2" fill="#2a3040"/></g>`;
    return `<svg viewBox="0 0 420 460" role="img" aria-label="Compound microscope with parts to tap">
      <defs>
        <linearGradient id="mBody" x1="0" x2="1"><stop offset="0" stop-color="#3f4a61"/><stop offset=".45" stop-color="#6d7b97"/><stop offset="1" stop-color="#343d50"/></linearGradient>
        <linearGradient id="mDark" x1="0" x2="1"><stop offset="0" stop-color="#20263a"/><stop offset=".5" stop-color="#45516b"/><stop offset="1" stop-color="#1c2232"/></linearGradient>
        <linearGradient id="mSilver" x1="0" x2="1"><stop offset="0" stop-color="#9aa5b8"/><stop offset=".45" stop-color="#eef1f6"/><stop offset="1" stop-color="#8691a5"/></linearGradient>
        <radialGradient id="mLamp"><stop offset="0" stop-color="#fff7c2"/><stop offset="1" stop-color="#f2c94c"/></radialGradient>
      </defs>
      <line x1="204" y1="388" x2="214" y2="232" stroke="#f2c94c" stroke-width="10" opacity=".22" stroke-linecap="round"/>
      <g class="mpart" data-part="arm"><path d="M262,396 C318,372 340,312 330,250 C322,200 302,166 270,138 L240,160 C266,184 282,212 290,250 C298,300 288,352 244,388 Z" fill="url(#mBody)" stroke="#2a3244" stroke-width="1.5"/></g>
      <g class="mpart" data-part="base"><path d="M58,440 L342,440 Q354,440 349,428 L332,398 Q328,390 318,390 L82,390 Q72,390 68,398 L51,428 Q46,440 58,440 Z" fill="url(#mBody)" stroke="#2a3244" stroke-width="1.5"/>
        <ellipse cx="204" cy="391" rx="32" ry="7.5" fill="url(#mLamp)" stroke="#c9a23a" stroke-width="1.5"/><rect x="88" y="410" width="22" height="12" rx="4" fill="#1c2232"/><circle cx="99" cy="416" r="3" fill="#7de08f"/></g>
      <g class="mpart" data-part="bodytube"><path d="M180,96 L262,96 Q272,96 272,106 L272,134 Q272,144 262,144 L232,144 L232,176 L196,176 L196,144 L188,144 Q178,144 178,134 Z" fill="url(#mBody)" stroke="#2a3244" stroke-width="1.5"/><rect x="196" y="150" width="36" height="5" fill="#2a3244" opacity=".35"/></g>
      <g class="mpart" data-part="ocular"><g transform="rotate(-28 196 98)"><rect x="176" y="36" width="24" height="64" rx="4" fill="url(#mDark)"/><rect x="172" y="30" width="32" height="14" rx="5" fill="#151a24"/></g><g transform="rotate(-28 226 98)"><rect x="210" y="40" width="24" height="60" rx="4" fill="url(#mDark)"/><rect x="206" y="34" width="32" height="14" rx="5" fill="#151a24"/></g></g>
      <g class="mpart" data-part="objectives"><path d="M184,176 L244,176 L250,190 L178,190 Z" fill="url(#mSilver)" stroke="#5d6676" stroke-width="1.2"/>${obj(190, 28, 24, "#d9443a")}${obj(238, 34, -24, "#f2c94c")}${obj(226, 46, -8, "#ffffff")}${obj(204, 42, 8, "#3f7bd1")}</g>
      <g class="mpart" data-part="stage"><rect x="104" y="238" width="214" height="14" rx="3" fill="url(#mDark)"/><rect x="104" y="238" width="214" height="3" rx="1.5" fill="#fff" opacity=".18"/>
        <rect x="150" y="230" width="124" height="8" rx="1.5" fill="#d6ebf5" stroke="#8fb0c8"/><rect x="156" y="231" width="26" height="6" fill="#c3d3e0"/><rect x="236" y="226" width="40" height="5" rx="2" fill="#8b93a3"/>
        <rect x="118" y="252" width="10" height="26" rx="3" fill="#2a3244"/><circle cx="123" cy="282" r="7" fill="#1c2232"/><circle cx="123" cy="296" r="6" fill="#1c2232"/></g>
      <g class="mpart" data-part="condenser"><rect x="190" y="254" width="48" height="26" rx="4" fill="url(#mSilver)" stroke="#5d6676" stroke-width="1.2"/><ellipse cx="214" cy="255" rx="16" ry="3" fill="#cfe6f5"/></g>
      <g class="mpart" data-part="iris"><rect x="184" y="282" width="60" height="11" rx="5" fill="#c9a24a" stroke="#8a6d1a" stroke-width="1"/><rect x="242" y="285" width="30" height="5" rx="2.5" fill="#c9a24a"/><circle cx="273" cy="287.5" r="5" fill="#8a6d1a"/></g>
      <g class="mpart" data-part="coarse"><circle cx="320" cy="314" r="30" fill="url(#mDark)" stroke="#151a24" stroke-width="1.5"/>${knurl(320, 314, 30, 24)}</g>
