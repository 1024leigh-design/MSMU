<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identifying Bacteria | MicroLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
<link rel="stylesheet" href="lab.css">
<style>
  .fizz circle{animation:fizz 1.6s ease-in infinite}
  @keyframes fizz{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.fizz circle{animation:none}}
  .keybox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:820px){.keybox{grid-template-columns:1fr}}
  .pathlist{margin:6px 0 0;padding-left:20px;line-height:1.6}
  .cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .cols3 .card ul{margin:4px 0 0;padding-left:18px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="lab.js"></script>
<script>
(function(){
  const {$, f1, clamp, rnd, esc, shuffle, q, T, plateSVG, tubeSVG, orderGame, pictureGame} = MicroLab;
  const C_RED = "#d9443a", C_YEL = "#f2d23c";

  /* ================================================================= result pictures */
  /* catalase: a slide with a suspension; stage 0 bare, 1 water, 2 suspension, 3 + peroxide */
  function catalaseSVG(stage, pos){
    let s = `<rect x="20" y="70" width="260" height="70" rx="6" fill="#eef4fb" stroke="#9aa5b8" stroke-width="2"/><rect x="24" y="74" width="40" height="62" fill="#e2e8f2"/>`;
    if (stage >= 1) s += `<ellipse cx="160" cy="105" rx="${stage >= 3 ? 46 : 34}" ry="${stage >= 3 ? 22 : 16}" fill="${stage >= 2 ? "#efe6c8" : "#dcebfa"}" stroke="#b9c6d8"/>`;
    if (stage >= 3 && pos){
      s += `<g class="fizz">${Array.from({length:22}, (_, i) => `<circle cx="${f1(122 + rnd(i) * 76)}" cy="${f1(96 + rnd(i + 40) * 20)}" r="${f1(2.5 + rnd(i + 9) * 4)}" fill="#fff" stroke="#8fa3bf" stroke-width="1.2" style="animation-delay:${f1(rnd(i + 3) * 1.5)}s"/>`).join("")}</g>`;
      s += Array.from({length:14}, (_, i) => `<circle cx="${f1(124 + rnd(i + 70) * 72)}" cy="${f1(98 + rnd(i + 90) * 16)}" r="${f1(2 + rnd(i + 5) * 3)}" fill="#fff" stroke="#8fa3bf" stroke-width="1"/>`).join("");
    }
    if (stage === 2) s += `<line x1="200" y1="40" x2="168" y2="100" stroke="#c8a46a" stroke-width="6" stroke-linecap="round"/>`;
    s += T(150, 170, stage < 3 ? ["Clean slide", "Loopful of water", "Colony mixed in with a toothpick", ""][stage] : pos ? "Bubbles: catalase-positive" : "No bubbles: catalase-negative", {fs:15, c:stage < 3 ? "#5a6376" : pos ? "#1b7f4e" : "#b83a34"});
    return `<svg class="gsvg" viewBox="0 0 300 180" role="img" aria-label="Catalase test on a slide">${s}</svg>`;
  }
  /* oxidase strip: stage 0 clean, 1 rubbed, 2 read */
  function oxidaseSVG(stage, pos){
    let s = `<rect x="40" y="40" width="220" height="90" rx="10" fill="#fbfaf2" stroke="#d9cfa6" stroke-width="2.5"/>` + T(150, 60, "oxidase test strip", {fs:12, c:"#8a7a4a"});
    s += `<circle cx="150" cy="95" r="26" fill="#fffdf6" stroke="#e2d9b6"/>`;
    if (stage >= 1) s += `<ellipse cx="150" cy="96" rx="16" ry="9" fill="${stage >= 2 && pos ? "#4b2a8a" : "#efe6c8"}"/>`;
    if (stage >= 2 && pos) s += `<ellipse cx="150" cy="96" rx="22" ry="13" fill="#5b3fb0" opacity=".35"/>`;
    s += T(150, 160, stage < 2 ? ["Clean reaction area", "Colony rubbed on with a wooden stick"][stage] : pos ? "Dark purple: oxidase-positive" : "No color change: oxidase-negative", {fs:15, c:stage < 2 ? "#5a6376" : pos ? "#1b7f4e" : "#b83a34"});
    return `<svg class="gsvg" viewBox="0 0 300 172" role="img" aria-label="Oxidase strip">${s}</svg>`;
  }
  /* OF-dextrose pair, colors match the biochem bench: F both yellow, O open yellow / sealed red, N both red */
  function ofSVG(r){
    const open = r === "N" ? C_RED : C_YEL, openB = r === "O" ? "#e9923a" : open, sealed = r === "F" ? C_YEL : C_RED;
    const t = (x, top, bot, oil) => tubeSVG(x, 20, 40, 150, top, `<rect x="${x - 20}" y="120" width="40" height="60" fill="${bot}"/>${oil ? `<rect x="${x - 20}" y="50" width="40" height="16" fill="#f3e7a6"/>` : ""}`);
    return `<svg class="gsvg" viewBox="0 0 300 210" role="img" aria-label="OF-dextrose tubes">${t(100, open, openB, false)}${t(200, sealed, sealed, true)}${T(100, 196, "open", {fs:14})}${T(200, 196, "oil-sealed", {fs:14})}</svg>`;
  }
  function msaSVG(ferm){
    const pts = [[110, 90], [150, 80], [190, 96], [120, 130], [165, 125], [140, 160], [185, 155], [105, 170]];
    let inner = ferm ? `<circle cx="150" cy="125" r="78" fill="${C_YEL}" opacity=".85"/>` : "";
    inner += pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="7" fill="${ferm ? "#f0c13a" : "#f7f3ea"}" stroke="#b8a067"/>`).join("");
    return `<svg class="gsvg" viewBox="0 0 300 260" role="img" aria-label="Mannitol salt agar plate">${plateSVG(150, 125, 105, "#ef9a8c", inner)}${T(150, 252, "Mannitol salt agar (MSA)", {fs:14})}</svg>`;
  }
  function vpSVG(pos){ return `<svg class="gsvg" viewBox="0 0 300 210" role="img" aria-label="MR-VP broth after Barritt's reagents">${tubeSVG(150, 20, 44, 160, pos ? "#d0455d" : "#b98a52")}${T(150, 202, "MR-VP broth + Barritt's reagents", {fs:13})}</svg>`; }
  function lactoseSVG(ag){
    const ex = `<path d="M140,186 L140,120 A10,10 0 0 1 160,120 L160,186" fill="${ag ? C_YEL : C_RED}" stroke="#6d7686" stroke-width="2"/>${ag ? `<rect x="142" y="112" width="16" height="26" rx="6" fill="#fbfcfe"/>` : ""}`;
    return `<svg class="gsvg" viewBox="0 0 300 220" role="img" aria-label="Lactose broth with a Durham tube">${tubeSVG(150, 20, 50, 176, ag ? C_YEL : C_RED, ex)}${T(150, 214, "Lactose broth + Durham tube", {fs:13})}</svg>`;
  }
  function citrateSVG(pos){
    const c = pos ? "#2f5fbf" : "#4f9a4a";
    return `<svg class="gsvg" viewBox="0 0 300 210" role="img" aria-label="Simmons citrate slant">${tubeSVG(150, 20, 46, 170, c, `<path d="M127,60 L173,96 L173,200 L127,200 Z" fill="${c}"/><rect x="127" y="20" width="46" height="40" fill="#fff"/><path d="M127,60 L173,96 L173,40 L127,40 Z" fill="#fff"/>${pos ? `<path d="M134,70 l8,6 l-6,4 l10,7 l-6,4 l10,7" stroke="#f3f0e2" stroke-width="3" fill="none"/>` : ""}`)}${T(150, 204, "Simmons citrate slant", {fs:13})}</svg>`;
  }
  /* microscope field for the Gram stain and endospore stain */
  function fieldSVG(kind){
    let cells = "";
    const rod = (x, y, a, c, L, W) => `<rect x="${f1(x - L / 2)}" y="${f1(y - W / 2)}" width="${L}" height="${W}" rx="${W / 2}" fill="${c}" transform="rotate(${f1(a)} ${f1(x)} ${f1(y)})"/>`;
    const P = "#5a2a98", K = "#e5588a";
    for (let i = 0; i < 9; i++){
      const x = 60 + rnd(i * 3 + kind.length) * 180, y = 50 + rnd(i * 7 + 11 + kind.length) * 150, a = rnd(i + 5) * 180;
      if (kind === "clusters") for (let j = 0; j < 6; j++) cells += `<circle cx="${f1(x + (rnd(i * 9 + j) - .5) * 20)}" cy="${f1(y + (rnd(i * 5 + j + 2) - .5) * 20)}" r="5" fill="${P}"/>`;
      if (kind === "tetrads") [[0, 0], [10, 0], [0, 10], [10, 10]].forEach(([dx, dy]) => { cells += `<circle cx="${f1(x + dx)}" cy="${f1(y + dy)}" r="5" fill="${P}"/>`; });
      if (kind === "chains") for (let j = 0; j < 4; j++) cells += `<circle cx="${f1(x + Math.cos(a) * j * 10)}" cy="${f1(y + Math.sin(a) * j * 10)}" r="4.6" fill="${P}"/>`;
      if (kind === "rods") cells += rod(x, y, a, P, 26, 9);
      if (kind === "bigrods") cells += rod(x, y, a, P, 40, 15);
      if (kind === "gnr") cells += rod(x, y, a, K, 22, 8);
      if (kind === "spores"){ cells += rod(x, y, a, K, 28, 10) + `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="5" ry="3.6" fill="#2f9e4f" transform="rotate(${f1(a)} ${f1(x)} ${f1(y)})"/>`; if (i % 3 === 0) cells += `<ellipse cx="${f1(x + 30)}" cy="${f1(y - 18)}" rx="5" ry="3.6" fill="#2f9e4f"/>`; }
    }
    const k = MicroLab.id("fc");
    return `<svg class="gsvg" viewBox="0 0 300 260" role="img" aria-label="Microscope field at 1000x"><circle cx="150" cy="125" r="120" fill="#1d2030"/><circle cx="150" cy="125" r="112" fill="#f6f4f7"/><clipPath id="${k}"><circle cx="150" cy="125" r="112"/></clipPath><g clip-path="url(#${k})">${cells}</g>${T(150, 254, kind === "spores" ? "Endospore stain, 1000×" : "Gram stain, 1000×", {fs:13})}</svg>`;
  }

  /* ================================================================= EXERCISE 17: catalase and oxidase */
  const CAT = [["Staphylococcus aureus", 1], ["Staphylococcus epidermidis", 1], ["Lactococcus lactis", 0], ["Bacillus subtilis", 1], ["Escherichia coli", 1], ["Pseudomonas aeruginosa", 1]];
  const OXI = [["Pseudomonas aeruginosa", 1], ["Alcaligenes faecalis", 1], ["Escherichia coli", 0], ["Enterobacter aerogenes", 0], ["Proteus vulgaris", 0]];
  function renderResp(body){
    body.innerHTML = `
      <div class="note">You streaked a TSA plate for isolation on Oct 13 so you'd have <b>isolated colonies</b> for these two tests, and a nitrate broth to read after the midterm.</div>
      <div class="sect">1. Catalase test</div>
      <div class="row"><span class="lbl">Colony from</span><span id="cOrg"></span></div>
      <div class="bench2"><div class="panel tight" id="cPic" style="max-width:380px;justify-self:center;width:100%"></div><div><div class="benchhint" id="cMsg" role="status"></div><div class="row" id="cBtns"></div></div></div>
      <div class="sect">2. Oxidase test</div>
      <div class="row"><span class="lbl">Colony from</span><span id="oOrg"></span></div>
      <div class="bench2"><div class="panel tight" id="oPic" style="max-width:380px;justify-self:center;width:100%"></div><div><div class="benchhint" id="oMsg" role="status"></div><div class="row" id="oBtns"></div></div></div>
      <div class="sect">3. Nitrate reduction</div>
      <div class="bridge"><b>The nitrate test is on the Biochemical Tests bench.</b><span>Add Reagent A, then B, wait 1 minute. Red = positive. No color? Add zinc and wait 5 minutes: red now = negative; still no color = positive (reduced past nitrite).</span><div class="links"><a class="btn primary" href="biochem-tests.html#nitrate">Open the nitrate bench</a></div></div>
      <div class="sect">4. Which test is it?</div><div id="rGame"></div>`;
    const bench = (key, list, pic, steps) => {
      let org = 0, stage = 0;
      const chips = () => { $(key + "Org").innerHTML = list.map(([n], i) => `<button class="chip ${i === org ? "on" : ""}" data-i="${i}"><i>${n.replace(/^(\w)\w+ /, "$1. ")}</i></button>`).join(" "); };
      const draw = () => {
        $(key + "Pic").innerHTML = pic(stage, list[org][1]);
        const st = steps[stage];
        $(key + "Msg").className = "benchhint " + (stage === steps.length - 1 ? "good" : "");
        $(key + "Msg").innerHTML = typeof st.msg === "function" ? st.msg(list[org]) : st.msg;
        $(key + "Btns").innerHTML = (st.btn ? `<button class="btn primary" data-go="1">${st.btn}</button>` : "") + `<button class="btn secondary" data-re="1">↺ Start over</button>`;
      };
      $(key + "Org").onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; org = +b.dataset.i; stage = 0; chips(); draw(); };
      $(key + "Btns").onclick = e => { if (e.target.closest("[data-go]")) stage++; if (e.target.closest("[data-re]")) stage = 0; draw(); };
      chips(); draw();
    };
    bench("c", CAT, catalaseSVG, [
      {msg:"Start with a clean slide.", btn:"Put a loopful of water on the slide"},
      {msg:"Now pick up one <b>isolated colony</b>.", btn:"Mix a colony into the water with a toothpick"},
      {msg:"That's your suspension. Discard the toothpick in the biohazard container.", btn:"Add a drop of 3% H₂O₂"},
      {msg:([n, p]) => p ? `<b>Bubbles!</b> <i>${n}</i> is <b>catalase-positive</b>. Catalase breaks hydrogen peroxide into water and oxygen gas: 2 H₂O₂ → 2 H₂O + O₂. The O₂ is the bubbles.` : `<b>No bubbles.</b> <i>${n}</i> is <b>catalase-negative</b>. With no catalase, the H₂O₂ isn't broken down, so no O₂ gas forms. In your unknown key, this is how <i>L. lactis</i> splits off from the other gram-positive cocci.`}]);
    bench("o", OXI, oxidaseSVG, [
      {msg:"Pick up one isolated colony with a <b>wooden stick or toothpick</b>. A metal loop can give a false positive.", btn:"Rub the colony onto the strip"},
      {msg:"Watch the spot where you rubbed the colony. A positive changes color quickly, within seconds. Check your strip's directions for the exact time.", btn:"Read the strip"},
      {msg:([n, p]) => p ? `<b>Dark purple.</b> <i>${n}</i> is <b>oxidase-positive</b>: it has cytochrome c oxidase, the ETC enzyme that hands electrons to O₂. The reagent in the strip gets oxidized and turns purple.` : `<b>No color change.</b> <i>${n}</i> is <b>oxidase-negative</b>: no cytochrome c oxidase. In the gram-negative key, oxidase is the first split: <i>P. aeruginosa</i> and <i>A. faecalis</i> are positive; <i>E. coli</i>, <i>E. aerogenes</i>, and <i>P. vulgaris</i> are negative.`}]);
    const TESTS = ["Catalase", "Oxidase", "Nitrate reduction"];
    pictureGame($("rGame"), [
      {svg:catalaseSVG(3, true), ask:"Which test is this, and what enzyme does it detect?", opts:["Catalase: breaks down hydrogen peroxide", "Oxidase: cytochrome c oxidase", "Nitrate reductase", "Urease"], a:0, why:"Bubbles of O₂ after 3% H₂O₂."},
      {svg:oxidaseSVG(2, true), ask:"Which test is this, and what does purple mean?", opts:["Oxidase: positive, it has cytochrome c oxidase", "Catalase: positive", "Oxidase: negative", "Nitrate: positive"], a:0, why:"Dark purple on the strip = oxidase-positive."},
      {svg:oxidaseSVG(2, false), ask:"No color change on the oxidase strip. What's the result?", opts:["Oxidase-negative", "Oxidase-positive", "Catalase-negative", "Redo it with a metal loop"], a:0, why:"Use a wooden stick, not a metal loop, which can give a false positive."},
      {svg:catalaseSVG(3, false), ask:"No bubbles after the H₂O₂. Which gram-positive coccus from your unknown list does this point to?", opts:["Lactococcus lactis", "Staphylococcus aureus", "Micrococcus luteus", "Staphylococcus epidermidis"], a:0, why:"In the key, catalase-negative gram-positive cocci = L. lactis."}], {picW:300});
  }

  /* ================================================================= EXERCISE 18: the unknown */
  const ORGS = {
    saur:{n:"Staphylococcus aureus", col:"gpc", gram:"clusters", path:{cat:1, glu:1, man:1}},
    sepi:{n:"Staphylococcus epidermidis", col:"gpc", gram:"clusters", path:{cat:1, glu:1, man:0}},
    mlut:{n:"Micrococcus luteus", col:"gpc", gram:"tetrads", path:{cat:1, glu:0}},
    llac:{n:"Lactococcus lactis", col:"gpc", gram:"chains", path:{cat:0}},
    bsub:{n:"Bacillus subtilis", col:"gpr", gram:"rods", path:{spore:1, vp:1}},
    bmeg:{n:"Bacillus megaterium", col:"gpr", gram:"bigrods", path:{spore:1, vp:0}},
    paer:{n:"Pseudomonas aeruginosa", col:"gnr", gram:"gnr", path:{oxi:1, ofo:1}},
    afae:{n:"Alcaligenes faecalis", col:"gnr", gram:"gnr", path:{oxi:1, ofo:0}},
    ecol:{n:"Escherichia coli", col:"gnr", gram:"gnr", path:{oxi:0, lac:1, cit:0}},
    eaer:{n:"Enterobacter aerogenes", col:"gnr", gram:"gnr", path:{oxi:0, lac:1, cit:1}},
    pvul:{n:"Proteus vulgaris", col:"gnr", gram:"gnr", path:{oxi:0, lac:0}}};
  const COLS = {gpc:"Gram-positive cocci", gpr:"Gram-positive rods", gnr:"Gram-negative rods"};
  /* the keys from the class slides (Figures H.1 and H.2) */
  const KEYS = {
    gpc:{t:"cat", fig:"Figure H.2", "+":{t:"glu", "+":{t:"man", "+":"saur", "-":"sepi"}, "-":"mlut"}, "-":"llac"},
    gpr:{t:"spore", fig:"Figure H.2", "+":{t:"vp", "+":"bsub", "-":"bmeg"}},
    gnr:{t:"oxi", fig:"Figure H.1", "+":{t:"ofo", "+":"paer", "-":"afae"}, "-":{t:"lac", "+":{t:"cit", "+":"eaer", "-":"ecol"}, "-":"pvul"}}};
  const TINFO = {
    cat:{n:"Catalase", how:"3% hydrogen peroxide", pic:p => catalaseSVG(3, p), read:"Bubbles = +, no bubbles = −."},
    glu:{n:"Acid from glucose", how:"OF-dextrose tubes", pic:p => ofSVG(p ? "F" : "N"), read:"Yellow = acid = +. Red (no change) = −."},
    man:{n:"Acid from mannitol", how:"MSA plate", pic:p => msaSVG(p), read:"Yellow around the growth = mannitol fermented = +. Stays red = −."},
    spore:{n:"Endospore stain", how:"to confirm Bacillus", pic:() => fieldSVG("spores"), read:"Green endospores in pink cells = +."},
    vp:{n:"V-P test", how:"MR-VP broth", pic:p => vpSVG(p), read:"Red after Barritt's reagents = +. No red = −."},
    oxi:{n:"Oxidase", how:"oxidase strip", pic:p => oxidaseSVG(2, p), read:"Dark purple = +. No color change = −."},
    ofo:{n:"Glucose oxidized", how:"OF-dextrose tubes", pic:p => ofSVG(p ? "O" : "N"), read:"Open tube yellow (oxidized) = +. No change = −."},
    lac:{n:"Acid and gas from lactose", how:"lactose broth + Durham tube", pic:p => lactoseSVG(p), read:"Yellow AND a bubble = +. Red, no bubble = −."},
    cit:{n:"Citrate", how:"Simmons citrate slant", pic:p => citrateSVG(p), read:"Blue = +. Stays green = −."}};
  const short = k => ORGS[k].n.replace(/^(\w)\w+ /, "$1. ");

  function keySVG(col, path, cur){
    /* lay out the tree; path = list of node objects visited, cur = current node or leaf key */
    const root = KEYS[col], nodes = [], edges = [];
    const place = (nd, x, y, w, depth) => {
      const isLeaf = typeof nd === "string", id = nodes.length;
      nodes.push({nd, x, y, isLeaf});
      if (!isLeaf){
        const kids = ["+", "-"].filter(s => nd[s] !== undefined);
        kids.forEach((s, i) => {
          const cx = kids.length === 1 ? x : x + (i === 0 ? -w / 4 : w / 4);
          const cid = place(nd[s], cx, y + 78, kids.length === 1 ? w : w / 2, depth + 1);
          edges.push({a:id, b:cid, s});
        });
      }
      return id;
    };
    place(root, 300, 34, 600, 0);
    const H = Math.max(...nodes.map(n => n.y)) + 40;
    const onPath = n => path.includes(n.nd) || n.nd === cur;
    let s = "";
    edges.forEach(({a, b, s:sg}) => { const A = nodes[a], B = nodes[b], hot = onPath(A) && onPath(B); s += `<line x1="${A.x}" y1="${A.y + 16}" x2="${B.x}" y2="${B.y - 16}" stroke="${hot ? "#3f4cc0" : "#c3c9d4"}" stroke-width="${hot ? 3.5 : 2}"/>` + T((A.x + B.x) / 2 + (B.x < A.x ? -10 : B.x > A.x ? 10 : 12), (A.y + B.y) / 2 + 4, sg === "-" ? "−" : "+", {fs:16, c:hot ? "#3f4cc0" : "#8b93a3"}); });
    nodes.forEach(n => {
      const label = n.isLeaf ? short(n.nd) : TINFO[n.nd.t].n, w = Math.max(96, label.length * 8.2 + 20), here = n.nd === cur, hot = onPath(n);
      s += `<rect x="${f1(n.x - w / 2)}" y="${n.y - 16}" width="${f1(w)}" height="32" rx="8" fill="${here ? "#3f4cc0" : n.isLeaf ? (hot ? "#e1f3e8" : "#fbe8ef") : hot ? "#e7e9fb" : "#fff4d6"}" stroke="${here ? "#3f4cc0" : "#b9a8e0"}" stroke-width="1.5"/>` + T(n.x, n.y + 5, label, {fs:13, c:here ? "#fff" : "#343b4a", it:n.isLeaf});
    });
    return `<svg class="gsvg" viewBox="0 0 600 ${H}" role="img" aria-label="${esc(COLS[col])} key, based on ${root.fig}">${s}</svg><p class="mini" style="margin:4px 0 0">${COLS[col]}: based on ${root.fig}</p>`;
  }

  function renderUnknown(body){
    body.innerHTML = `
      <div class="sect">Your unknown is one of these 11</div>
      <div class="cols3">${Object.keys(COLS).map(c => `<div class="card"><h4>${COLS[c]}</h4><ul>${Object.keys(ORGS).filter(k => ORGS[k].col === c).map(k => `<li><i>${ORGS[k].n}</i></li>`).join("")}</ul></div>`).join("")}</div>
      <p class="mini">Your Gram stain tells you which column. Then go to Figure H.2 (positive) or Figure H.1 (negative).</p>
      <div class="sect">1. Identify a mystery unknown</div>
      <div class="row"><button class="btn primary" id="uNew">🎲 New mystery unknown</button><span class="mini" id="uCount"></span></div>
      <div class="keybox"><div class="panel tight" id="uPic" style="max-width:320px;justify-self:center;width:100%"></div><div><div class="benchhint" id="uMsg" role="status"></div><div class="ans" id="uAns" style="flex-direction:column;align-items:stretch"></div><div id="uDone"></div></div></div>
      <div class="panel" id="uKey" style="margin-top:12px"></div>
      <div class="sect">2. Cheat sheet: what to set up</div>
      <div class="cols3">
        <div class="card"><h4>Gram-positive cocci</h4><ul><li>Catalase: 3% hydrogen peroxide</li><li>Acid from glucose: OF-dextrose tubes</li><li>Acid from mannitol: MSA plate</li></ul></div>
        <div class="card"><h4>Gram-positive rods</h4><ul><li>V-P: MR-VP broth</li><li>Endospore stain to confirm <i>Bacillus</i></li></ul></div>
        <div class="card"><h4>Gram-negative rods</h4><ul><li>Oxidase: oxidase strip</li><li>Glucose oxidized: OF-dextrose tubes</li><li>Lactose: lactose broth + Durham tube</li><li>Citrate: Simmons citrate slant</li></ul></div>
        <div class="card"><h4>Gram-negative cocci</h4><ul><li>None of your 11 options</li><li>Redo your Gram stain</li></ul></div></div>
      <p class="mini">Everything is up front. Inoculate from your <b>working slant</b> (slant 2). Slant 1 is your stock: fridge, emergency only.</p>
