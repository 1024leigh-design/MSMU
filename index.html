<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroLab | Lab Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
<style>
  .wrap{max-width:1100px}
  .hero{text-align:center;margin:10px 0 22px}
  .hero h1{font-size:2.3rem}
  .hero .sub{color:var(--muted);font-size:1.15rem;margin-top:8px}
  .status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:0 0 22px}
  .pill{display:inline-block;font-size:.95rem;font-weight:700;border-radius:999px;padding:5px 14px}
  .pill.ready{color:var(--good);background:var(--good-soft)}
  .pill.soon{color:var(--muted);background:#e4e8ef}
  .msg{min-height:1.5em;text-align:center;color:var(--muted);font-weight:700;font-size:1.05rem;margin:0 0 6px}
  .group{margin:0 0 28px}
  .group h2{font-size:1.4rem;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .tile{display:flex;flex-direction:column;gap:6px;text-align:left;text-decoration:none;color:var(--ink);
    background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:16px 18px;font:inherit;cursor:pointer;
    transition:transform .15s,box-shadow .15s}
  .tile:hover,.tile:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(29,36,51,.12);outline:none}
  .tile:focus-visible{outline:3px solid #f2b134;outline-offset:2px}
  .tile .ex{font-size:.95rem;font-weight:700;color:var(--accent)}
  .tile .name{font-size:1.2rem;font-weight:700;line-height:1.2}
  .tile .desc{font-size:1rem;color:var(--muted);line-height:1.35}
  .tile .tag{margin-top:auto;padding-top:6px;font-size:.92rem;font-weight:700;color:var(--good)}
  .tile.soon{border:2px dashed #aeb6c4;background:#f6f7fa;cursor:default}
  .tile.soon .ex{color:var(--muted)}
  .tile.soon .tag{color:var(--muted)}
  .tile.soon:hover{transform:none;box-shadow:none}
  footer{text-align:center;color:var(--muted);font-size:.95rem;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>MicroLab</h1>
    <div class="sub">BIO 3L General Microbiology Lab: Midterm Review, Exercises 1 through 17</div>
  </div>

  <div class="status" id="status"></div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <main id="groups"></main>

  <footer>MicroLab review for BIO 3L General Microbiology Lab</footer>
</div>

<script>
(function(){
  /* To make a page live, give its tile an href. Tiles without one show as "Coming soon". */
  const T = "biochem-tests.html";
  const GROUPS = [
    {title:"Microscopy and growth", items:[
      {ex:"Exercise 1", name:"Parts of the Microscope", desc:"Parts, magnification, resolution, and oil immersion"},
      {ex:"Exercise 2", name:"Living Microorganisms", desc:"Wet mounts, hanging drops, and motility"},
      {ex:"Exercise 3", name:"Microbes in the Environment", desc:"Media, colonies, and describing growth"},
      {ex:"Exercise 4", name:"Aseptic Technique", desc:"Transfers into broth, slants, and deeps"}]},
    {title:"Staining", items:[
      {ex:"Exercise 5", name:"Smears and Simple Staining", desc:"Heat fixing, morphology, and arrangement"},
      {ex:"Exercise 7", name:"Gram Stain", desc:"Gram-positive versus gram-negative"},
      {ex:"Exercise 9", name:"Endospore Stain", desc:"Schaeffer-Fulton: green spores, pink cells"}]},
    {title:"Isolation and special media", items:[
      {ex:"Exercise 11", name:"Streak Plate", desc:"Isolating a pure culture"},
      {ex:"Exercise 12", name:"Mannitol Salt Agar (MSA)", desc:"Selective and differential for staph", href:T + "#msa"},
      {ex:"Exercise 12", name:"EMB Agar", desc:"Lactose fermenters and the green sheen", href:T + "#emb"}]},
    {title:"Biochemical tests: Exercises 13 to 15", items:[
      {ex:"Exercise 13", name:"Starch Hydrolysis", desc:"Amylase and the clear zone", href:T + "#starch"},
      {ex:"Exercise 13", name:"OF-Glucose", desc:"Oxidative versus fermentative"},
      {ex:"Exercise 14", name:"Fermentation Tubes", desc:"Glucose, lactose, sucrose, and the Durham tube", href:T + "#durham"},
      {ex:"Exercise 14", name:"Methyl Red (MR)", desc:"Mixed-acid fermentation", href:T + "#mr"},
      {ex:"Exercise 14", name:"Voges-Proskauer (VP)", desc:"Butanediol fermentation and acetoin", href:T + "#vp"},
      {ex:"Exercise 14", name:"Citrate", desc:"Citrate as the only carbon source", href:T + "#citrate"},
      {ex:"Exercise 15", name:"Gelatin and Urea", desc:"Gelatinase and urease"},
      {ex:"Exercise 15", name:"Litmus Milk", desc:"Acid, alkaline, reduction, curd, and peptonization"}]},
    {title:"Biochemical tests: Exercises 16 and 17", items:[
      {ex:"Exercise 16", name:"Phenylalanine Deaminase", desc:"Ferric chloride turns the slant green", href:T + "#phe"},
      {ex:"Exercise 16", name:"Peptone Iron Deep (H₂S)", desc:"Black along the stab line", href:T + "#h2s"},
      {ex:"Exercise 16", name:"MIO Medium", desc:"Motility, indole, and ornithine decarboxylase"},
      {ex:"Exercise 17", name:"Respiration", desc:"Aerobic, anaerobic, and fermentation"},
      {ex:"Exercise 17", name:"Nitrate Reduction", desc:"Nitrate, nitrite, and zinc", href:T + "#nitrate"}]}
  ];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"})[c]);
  const all = GROUPS.reduce((a, g) => a.concat(g.items), []);
  const ready = all.filter(i => i.href).length;
  document.getElementById("status").innerHTML =
    `<span class="pill ready">${ready} ready</span><span class="pill soon">${all.length - ready} coming soon</span>`;

  document.getElementById("groups").innerHTML = GROUPS.map(g => `
    <section class="group" aria-labelledby="g-${esc(g.title).replace(/\W+/g, "-")}">
      <h2 id="g-${esc(g.title).replace(/\W+/g, "-")}">${esc(g.title)}</h2>
      <div class="grid">${g.items.map(i => i.href
        ? `<a class="tile" href="${esc(i.href)}"><span class="ex">${esc(i.ex)}</span><span class="name">${esc(i.name)}</span><span class="desc">${esc(i.desc)}</span><span class="tag">Open</span></a>`
        : `<button type="button" class="tile soon" aria-disabled="true" data-name="${esc(i.name)}"><span class="ex">${esc(i.ex)}</span><span class="name">${esc(i.name)}</span><span class="desc">${esc(i.desc)}</span><span class="tag">Coming soon</span></button>`).join("")}
      </div>
    </section>`).join("");

  document.getElementById("groups").addEventListener("click", e => {
    const b = e.target.closest(".tile.soon"); if (!b) return;
    document.getElementById("msg").textContent = b.dataset.name + " is coming soon.";
  });
})();
</script>
</body>
</html>
