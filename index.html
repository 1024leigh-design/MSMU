<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroLab | Lab Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
<style>
  .wrap{max-width:1100px}
  .hero{text-align:center;margin:10px 0 22px}
  .hero h1{font-size:2.3rem}
  .hero .sub{color:var(--muted);font-size:1.15rem;margin-top:8px}
  .status{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:0 0 22px}
  .pill{display:inline-block;font-size:.95rem;font-weight:700;border-radius:999px;padding:5px 14px}
  .pill.ready{color:var(--good);background:var(--good-soft)}
  .pill.soon{color:var(--muted);background:#e4e8ef}
  .msg{min-height:1.5em;text-align:center;color:var(--muted);font-weight:700;font-size:1.05rem;margin:0 0 6px}
  .group{margin:0 0 28px}
  .group h2{font-size:1.4rem;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  .tile{display:grid;grid-template-columns:76px 1fr;grid-template-rows:auto auto 1fr auto;column-gap:14px;row-gap:4px;text-align:left;text-decoration:none;color:var(--ink);
    background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:16px 18px;font:inherit;cursor:pointer;
    transition:transform .15s,box-shadow .15s}
  .tile:hover,.tile:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(29,36,51,.12);outline:none}
  .tile:focus-visible{outline:3px solid #f2b134;outline-offset:2px}
  .tile .pic{grid-row:1 / 5;width:76px;height:76px;border-radius:14px;background:#f3f5f9;display:flex;align-items:center;justify-content:center;align-self:start}
  .tile .pic svg{width:68px;height:68px;display:block}
  .tile.soon .pic{filter:grayscale(.85);opacity:.6}
  .tile .ex{font-size:.95rem;font-weight:700;color:var(--accent)}
  .tile .name{font-size:1.2rem;font-weight:700;line-height:1.2}
  .tile .desc{font-size:1rem;color:var(--muted);line-height:1.35}
  .tile .tag{margin-top:auto;padding-top:6px;font-size:.92rem;font-weight:700;color:var(--good)}
  .tile.soon{border:2px dashed #aeb6c4;background:#f6f7fa;cursor:default}
  .tile.soon .ex{color:var(--muted)}
  .tile.soon .tag{color:var(--muted)}
  .tile.soon:hover{transform:none;box-shadow:none}
  footer{text-align:center;color:var(--muted);font-size:.95rem;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>MicroLab</h1>
    <div class="sub">BIO 3L General Microbiology Lab: Midterm Review, Exercises 1 through 17</div>
  </div>

  <div class="status" id="status"></div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <main id="groups"></main>

  <footer>MicroLab review for BIO 3L General Microbiology Lab</footer>
</div>

<script>
(function(){
  /* To make a page live, give its tile an href. Tiles without one show as "Coming soon". */
  const T = "biochem-tests.html", ST = "stains.html", B = "basics.html";
  const GROUPS = [
    {title:"Microscopy and growth", items:[
      {pic:"scope", ex:"Exercise 1", name:"Parts of the Microscope", desc:"Parts, magnification, resolution, and oil immersion", href:B + "#scope"},
      {pic:"living", ex:"Exercise 2", name:"Living Microorganisms", desc:"Wet mounts, hanging drops, and motility", href:B + "#living"},
      {pic:"environment", ex:"Exercise 3", name:"Microbes in the Environment", desc:"Media, colonies, and describing growth", href:B + "#environment"},
      {pic:"aseptic", ex:"Exercise 4", name:"Aseptic Technique", desc:"Transfers into broth, slants, and deeps", href:B + "#aseptic"}]},
    {title:"Staining", items:[
      {pic:"smear", ex:"Exercise 5", name:"Smears and Simple Staining", desc:"Heat fixing, morphology, and arrangement", href:ST + "#smear"},
      {pic:"gram", ex:"Exercise 7", name:"Gram Stain", desc:"Gram-positive versus gram-negative", href:ST + "#gram"},
      {pic:"spore", ex:"Exercise 9", name:"Endospore Stain", desc:"Schaeffer-Fulton: green spores, pink cells", href:ST + "#spore"}]},
    {title:"Isolation and special media", items:[
      {pic:"streak", ex:"Exercise 11", name:"Streak Plate", desc:"Isolating a pure culture"},
      {pic:"msa", ex:"Exercise 12", name:"Mannitol Salt Agar (MSA)", desc:"Selective and differential for staph", href:T + "#msa"},
      {pic:"emb", ex:"Exercise 12", name:"EMB Agar", desc:"Lactose fermenters and the green sheen", href:T + "#emb"}]},
    {title:"Biochemical tests: Exercises 13 to 15", items:[
      {pic:"starch", ex:"Exercise 13", name:"Starch Hydrolysis", desc:"Amylase and the clear zone", href:T + "#starch"},
      {pic:"of", ex:"Exercise 13", name:"OF-Dextrose", desc:"Oxidative versus fermentative", href:T + "#of"},
      {pic:"durham", ex:"Exercise 14", name:"Fermentation Tubes", desc:"Glucose, lactose, sucrose, and the Durham tube", href:T + "#durham"},
      {pic:"mr", ex:"Exercise 14", name:"Methyl Red (MR)", desc:"Mixed-acid fermentation", href:T + "#mr"},
      {pic:"vp", ex:"Exercise 14", name:"Voges-Proskauer (VP)", desc:"Butanediol fermentation and acetoin", href:T + "#vp"},
      {pic:"citrate", ex:"Exercise 14", name:"Citrate", desc:"Citrate as the only carbon source", href:T + "#citrate"},
      {pic:"gel", ex:"Exercise 15", name:"Gelatin Hydrolysis", desc:"Gelatinase and the crushed ice check", href:T + "#gel"},
      {pic:"urea", ex:"Exercise 15", name:"Urease (Urea Agar)", desc:"Urease turns the slant bright pink", href:T + "#urea"}]},
    {title:"Biochemical tests: Exercises 16 and 17", items:[
      {pic:"phe", ex:"Exercise 16", name:"Phenylalanine Deaminase", desc:"Ferric chloride turns the slant green", href:T + "#phe"},
      {pic:"h2s", ex:"Exercise 16", name:"Peptone Iron Deep (H₂S)", desc:"Black along the stab line", href:T + "#h2s"},
      {pic:"mio", ex:"Exercise 16", name:"MIO Medium", desc:"Motility, indole, and ornithine decarboxylase", href:T + "#mio"},
      {pic:"resp", ex:"Exercise 17", name:"Respiration", desc:"Aerobic, anaerobic, and fermentation"},
      {pic:"nitrate", ex:"Exercise 17", name:"Nitrate Reduction", desc:"Nitrate, nitrite, and zinc", href:T + "#nitrate"}]}
  ];

  /* little pictures of what each lab looks like */
  const f1 = n => Math.round(n * 10) / 10;
  const rnd = k => { const v = Math.sin(k * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
  const svg = (body, label) => `<svg viewBox="0 0 80 80" role="img" aria-label="${label}">${body}</svg>`;
  const tube = (fill, extra, cap) => `<path d="M28,12 L28,62 A12,12 0 0 0 52,62 L52,12" fill="none" stroke="#8b93a3" stroke-width="2.6"/><clipPath id="c${tube.n = (tube.n || 0) + 1}"><path d="M29.5,12 L29.5,62 A10.5,10.5 0 0 0 50.5,62 L50.5,12 Z"/></clipPath><g clip-path="url(#c${tube.n})">${fill}${extra || ""}</g><rect x="25" y="5" width="30" height="9" rx="3" fill="${cap || "#8b93a3"}"/>`;
  const broth = (c, extra, cap) => tube(`<rect x="28" y="26" width="24" height="52" fill="${c}"/>`, extra, cap);
  const slant = (top, butt, extra) => tube(`<path d="M28,30 L52,46 L52,80 L28,80 Z" fill="${butt || top}"/><path d="M28,30 L52,46 L52,54 L28,40 Z" fill="${top}"/>`, extra);
  const deep = (c, extra) => tube(`<rect x="28" y="24" width="24" height="56" fill="${c}"/>`, extra);
  const plate = (agar, inner) => `<circle cx="40" cy="40" r="33" fill="#e3e7ee" stroke="#aab3c2" stroke-width="2"/><circle cx="40" cy="40" r="29" fill="${agar}"/>${inner || ""}<path d="M22,22 A26,26 0 0 1 46,14" fill="none" stroke="#fff" stroke-width="2.5" opacity=".5"/>`;
  const dots = (pts, c, r, stroke) => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r || 3.2}" fill="${c}" stroke="${stroke || "rgba(0,0,0,.25)"}" stroke-width=".8"/>`).join("");
  const STREAK = [[22,32],[30,28],[38,31],[46,27],[54,31],[58,38],[50,42],[42,40],[34,44],[26,46],[30,54],[38,56],[46,53],[54,56]];
  const field = cells => `<circle cx="40" cy="40" r="34" fill="#1d2030"/><circle cx="40" cy="40" r="31" fill="#f6f4f7"/><clipPath id="fc${field.n = (field.n || 0) + 1}"><circle cx="40" cy="40" r="31"/></clipPath><g clip-path="url(#fc${field.n})">${cells}</g>`;
  const rods = (n, c, seed, spore) => Array.from({length:n}, (_, k) => { const x = 14 + rnd(seed + k) * 52, y = 14 + rnd(seed + k + 40) * 52, a = f1(rnd(seed + k + 80) * 180);
    return `<rect x="${f1(x - 6)}" y="${f1(y - 2.4)}" width="12" height="4.8" rx="2.4" fill="${c}" transform="rotate(${a} ${f1(x)} ${f1(y)})"/>` + (spore && rnd(seed + k + 9) < spore ? `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="2.4" ry="1.7" fill="#2f9e4f" transform="rotate(${a} ${f1(x)} ${f1(y)})"/>` : ""); }).join("");
  const cocci = (c, seed) => Array.from({length:5}, (_, i) => { const x = 18 + rnd(seed + i) * 44, y = 18 + rnd(seed + i + 9) * 44; return Array.from({length:5}, (_, j) => `<circle cx="${f1(x + (rnd(seed + i * 7 + j) - .5) * 9)}" cy="${f1(y + (rnd(seed + i * 5 + j + 3) - .5) * 9)}" r="2.6" fill="${c}"/>`).join(""); }).join("");
  const PIC = {
    scope:svg(`<path d="M18,72 L62,72 L58,64 L22,64 Z" fill="#56647c"/><path d="M50,64 C62,56 62,38 50,24 L44,28 C52,38 52,52 44,62 Z" fill="#6d7b97"/><rect x="30" y="20" width="12" height="18" fill="#6d7b97"/><rect x="25" y="6" width="9" height="16" rx="2" fill="#2f3b52" transform="rotate(-25 30 14)"/><rect x="28" y="38" width="16" height="5" fill="#9aa5b8"/><rect x="31" y="43" width="5" height="8" fill="#9aa5b8"/><rect x="18" y="51" width="34" height="4" rx="1" fill="#2f3b52"/><ellipse cx="36" cy="64" rx="7" ry="2" fill="#f2c94c"/>`, "Microscope"),
    living:svg(field(rods(9, "#4f6fae", 3)) + `<path d="M20,24 l10,-4 M50,58 l8,4 M54,24 l6,-6" stroke="#3f4cc0" stroke-width="2.2" stroke-linecap="round"/>`, "Motile cells"),
    environment:svg(plate("#e7d39a", dots([[28,30],[50,26],[36,48],[56,46],[26,52],[46,60]], "#fbf3dc", 4.5, "#b8a067") + dots([[42,36],[60,36]], "#f2c94c", 3) + dots([[32,62]], "#f0f0f0", 6, "#c9c2b0")), "Colonies on a plate"),
    aseptic:svg(`<g transform="translate(-8 0)">${broth("#e3d29a", "", "#3f7bd1")}</g><line x1="64" y1="16" x2="64" y2="62" stroke="#9aa3b2" stroke-width="2"/><rect x="60" y="4" width="8" height="16" rx="3" fill="#3f4cc0"/><circle cx="64" cy="66" r="4" fill="none" stroke="#9aa3b2" stroke-width="2"/>`, "Loop and broth tube"),
    smear:svg(field(cocci("#3858b8", 5)), "Blue cocci in clusters"),
    gram:svg(field(cocci("#5a2a98", 11) + rods(6, "#e5588a", 21)), "Purple cocci and pink rods"),
    spore:svg(field(rods(11, "#e0506c", 31, .6) + dots([[22,58],[58,22],[40,62]], "#2f9e4f", 2.4)), "Pink cells with green endospores"),
    streak:svg(plate("#e7d39a", `<path d="M20,30 l14,-8 M22,34 l14,-8 M24,38 l14,-8 M44,18 l14,10 M46,24 l12,8 M58,42 l-8,14 M54,40 l-8,14" stroke="#fbf3dc" stroke-width="3" stroke-linecap="round"/>` + dots([[30,58],[22,52],[38,62]], "#fbf3dc", 3, "#b8a067")), "Streak plate"),
    msa:svg(plate("#ef9a8c", `<polyline points="${STREAK.map(p => p.join(",")).join(" ")}" fill="none" stroke="#f2d23c" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>` + dots(STREAK, "#f2d23c", 3, "#c9a21a")), "Yellow MSA plate"),
    emb:svg(plate("#6c4a7e", dots(STREAK, "#1f2f28", 3.4) + STREAK.map(([x, y]) => `<path d="M${x - 2},${y - .5} a2.2,2.2 0 0 1 3,-2" fill="none" stroke="#63e08f" stroke-width="1.3"/>`).join("")), "EMB plate with green sheen"),
    starch:svg(plate("#2b2340", `<path d="M22,30 L58,30 M22,44 L58,44 M24,58 L56,58" stroke="#efe2bf" stroke-width="10" stroke-linecap="round"/><path d="M22,30 L58,30 M22,44 L58,44 M24,58 L56,58" stroke="#f4ecd6" stroke-width="3" stroke-linecap="round"/>`), "Starch plate with clear zones"),
    of:svg(`<g transform="translate(-14 0)">${broth("#f2d23c")}</g><g transform="translate(14 0)">${broth("#d9443a", `<rect x="28" y="18" width="24" height="8" fill="#f3e7a6"/>`)}</g>`, "Two OF tubes"),
    durham:svg(broth("#f2d23c", `<path d="M35,74 L35,50 A5,5 0 0 1 45,50 L45,74" fill="#f2d23c" stroke="#6d7686" stroke-width="1.6"/><rect x="36.5" y="46" width="7" height="12" rx="3" fill="#fbfcfe"/>`), "Yellow tube with gas bubble"),
    mr:svg(broth("#d9443a"), "Red MR tube"),
    vp:svg(broth("#d0455d"), "Pink-red VP tube"),
    citrate:svg(slant("#2f5fbf"), "Blue citrate slant"),
    gel:svg(broth("#dcb95f") + `<rect x="6" y="56" width="11" height="11" rx="2" fill="#dff1fb" stroke="#9cc6e4" transform="rotate(-12 11 61)"/><rect x="60" y="58" width="11" height="11" rx="2" fill="#dff1fb" stroke="#9cc6e4" transform="rotate(10 65 63)"/>`, "Liquid gelatin with ice"),
    urea:svg(slant("#d62a76"), "Pink urea slant"),
    phe:svg(slant("#2f6b3a", "#f1e6b8"), "Green phenylalanine slant"),
    h2s:svg(deep("#ecdcab", `<path d="M39,26 C37,40 30,54 29,64 L29,80 L51,80 L51,62 C48,52 43,40 41,26 Z" fill="#231e1b"/>`), "Black peptone iron deep"),
    mio:svg(deep("#7d55a8", `<rect x="28" y="20" width="24" height="7" fill="#d0243a"/><ellipse cx="40" cy="50" rx="9" ry="18" fill="#fff" opacity=".3"/>`), "Purple MIO with a red ring"),
    resp:svg(`<circle cx="40" cy="40" r="30" fill="#e7e9fb"/><text x="40" y="47" font-size="20" font-weight="700" fill="#3f4cc0" text-anchor="middle">O₂</text><text x="22" y="30" font-size="11" font-weight="700" fill="#5b3fb0">e⁻</text><path d="M26,32 l6,4" stroke="#5b3fb0" stroke-width="2"/>`, "Respiration"),
    nitrate:svg(broth("#d9443a") + `<rect x="58" y="44" width="16" height="20" rx="3" fill="#f7f8fa" stroke="#8b93a3"/><rect x="58" y="40" width="16" height="6" rx="2" fill="#5a6376"/><rect x="60" y="54" width="12" height="8" fill="#b8bec8"/>`, "Red nitrate tube and zinc")
  };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"})[c]);
  const all = GROUPS.reduce((a, g) => a.concat(g.items), []);
  const ready = all.filter(i => i.href).length;
  document.getElementById("status").innerHTML =
    `<span class="pill ready">${ready} ready</span><span class="pill soon">${all.length - ready} coming soon</span>`;

  document.getElementById("groups").innerHTML = GROUPS.map(g => `
    <section class="group" aria-labelledby="g-${esc(g.title).replace(/\W+/g, "-")}">
      <h2 id="g-${esc(g.title).replace(/\W+/g, "-")}">${esc(g.title)}</h2>
      <div class="grid">${g.items.map(i => i.href
        ? `<a class="tile" href="${esc(i.href)}"><span class="pic" aria-hidden="true">${PIC[i.pic] || ""}</span><span class="ex">${esc(i.ex)}</span><span class="name">${esc(i.name)}</span><span class="desc">${esc(i.desc)}</span><span class="tag">Open</span></a>`
        : `<button type="button" class="tile soon" aria-disabled="true" data-name="${esc(i.name)}"><span class="pic" aria-hidden="true">${PIC[i.pic] || ""}</span><span class="ex">${esc(i.ex)}</span><span class="name">${esc(i.name)}</span><span class="desc">${esc(i.desc)}</span><span class="tag">Coming soon</span></button>`).join("")}
      </div>
    </section>`).join("");

  document.getElementById("groups").addEventListener("click", e => {
    const b = e.target.closest(".tile.soon"); if (!b) return;
    document.getElementById("msg").textContent = b.dataset.name + " is coming soon.";
  });
})();
</script>
</body>
</html>
