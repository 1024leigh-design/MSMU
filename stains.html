<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smears and Stains | MicroLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
<style>
  .labtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .labtab{border:2px solid var(--line);background:#fff;color:var(--muted);font:700 .95rem var(--font);padding:9px 16px;border-radius:12px;cursor:pointer}
  .labtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .labwrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
  .labhead h2{margin:0 0 4px;font-size:1.3rem}
  .labq{color:var(--muted);font-size:1rem;margin:0 0 12px}
  .labnote{background:#fff8e6;border:1px solid #f0d99a;border-radius:10px;padding:9px 14px;font-size:.95rem;color:#7a4b00;margin:0 0 12px;line-height:1.45}
  .labhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .tmodal{position:fixed;inset:0;background:rgba(20,24,36,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
  .tmodal[hidden]{display:none}
  .tcard{background:#fff;border-radius:22px;max-width:920px;width:100%;padding:22px 24px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:tpop .25s ease-out}
  @keyframes tpop{from{transform:translateY(14px);opacity:0}}
  .thead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
  .thead h2{margin:2px 0 0;font-size:1.35rem}
  .tkick{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9a6212}
  .tclose{border:none;background:#eef1f5;border-radius:50%;width:38px;height:38px;font-size:1.4rem;cursor:pointer;color:var(--ink);flex:none}
  .tasks{background:linear-gradient(135deg,#fff4de,#fdeceb);border-radius:16px;padding:12px 16px;margin-bottom:12px}
  .tasks p{margin:4px 0 0;font-size:1.08rem;line-height:1.45}
  .tlabel{display:block;font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .tsec{margin:18px 0}
  .tsec h3{font-size:1rem;margin:0 0 8px;color:var(--accent)}
  .tsec p{margin:0 0 8px;line-height:1.6;font-size:1rem}
  .tsec ul{margin:6px 0 0;padding-left:20px;line-height:1.6;font-size:1rem}
  .tsec li{margin-bottom:8px}
  .tflowwrap{background:#f7f8fb;border-radius:14px;padding:8px;overflow-x:auto}
  .tflow{display:block;width:100%;height:auto}
  .ttbl{width:100%;border-collapse:collapse;font-size:.98rem;min-width:520px}
  .ttbl th,.ttbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  .ttbl th{background:#eef1f8;font-size:.9rem}
  .ttbl .sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.25)}
  .tres{display:flex;flex-wrap:wrap;gap:14px}
  .tres > div{flex:1;min-width:150px;max-width:220px;background:#f7f8fb;border-radius:14px;padding:10px;text-align:center}
  .tres svg{width:100%;max-width:150px;height:auto;display:block;margin:0 auto 6px}
  .tres b{display:block;font-size:.98rem}
  .tres span{font-size:.92rem;color:var(--muted)}
  .tmist li{margin-bottom:10px}
  .tmist b{color:#7a2e28}
  .tfoot{display:flex;justify-content:flex-end;margin-top:8px}
  @media (max-width:720px){.tcard{padding:16px}}
  .quizhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
  .quizhead h3{margin:0}
  .btn.sm{font-size:.85rem;padding:6px 14px}
  .sect{font-size:.82rem;font-weight:800;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin:12px 0 6px}
  .benchsteps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
  .bstep{font-size:.88rem;font-weight:700;border-radius:999px;padding:4px 11px;background:#eef1f5;color:var(--muted)}
  .bstep.cur{background:var(--accent);color:#fff}
  .bstep.ok{background:var(--good-soft);color:var(--good)}
  .benchhint{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:1.02rem;color:#2c3796;min-height:1.5em;line-height:1.45}
  .benchhint.warn{background:#fff3d6;color:#7a4b00}
  .busy{display:flex;align-items:center;gap:12px;margin:8px 0 0;font-weight:700;color:#2c3796;font-size:.98rem}
  .busy[hidden]{display:none}
  .busy .bar{flex:1;max-width:320px;height:10px;border-radius:5px;background:#e4e8f5;overflow:hidden}
  .busy .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:5px}
  .bench{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;margin:8px 0 10px}
  .bench svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
  .bench [data-item]{cursor:grab}
  .pulse{animation:benchpulse 1.1s ease-in-out infinite}
  @keyframes benchpulse{50%{opacity:.25}}
  .palette{display:flex;flex-wrap:wrap;gap:8px}
  .act{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font:700 .92rem var(--font);color:var(--ink);cursor:pointer}
  .act:hover:not(:disabled){border-color:var(--accent)}
  .act:disabled{opacity:.4;cursor:not-allowed}
  .act .dot{width:14px;height:14px;border-radius:50%;background:var(--dot,#9aa3b2);border:1px solid rgba(0,0,0,.25);flex:none}
  .kbd{margin:6px 0 10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fafbfd}
  .kbd summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:.95rem}
  .benchbtns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 6px}
  .btn{font:700 .96rem var(--font);border-radius:999px;padding:9px 20px;cursor:pointer;border:2px solid var(--accent)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.secondary{background:#fff;color:var(--accent)}
  .btn.hint{border-color:#e5c56a;background:#fff8e6;color:#8a5a00}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .scope{margin-top:16px;border-top:2px dashed var(--line);padding-top:14px}
  .scope h3{margin:0 0 8px;font-size:1.1rem}
  .scopegrid{display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:18px;align-items:start}
  @media (max-width:820px){.scopegrid{grid-template-columns:1fr}}
  .fieldbox{background:#15171d;border-radius:18px;padding:10px}
  .fieldbox svg{display:block;width:100%;height:auto;border-radius:50%}
  .magrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .magnote{font-size:.98rem;color:var(--muted);min-height:2.6em}
  .recgrid{display:grid;grid-template-columns:1fr;gap:10px}
  .recrow label{display:block;font-weight:700;font-size:.95rem;margin-bottom:4px}
  .recrow select{width:100%;font:400 1rem var(--font);padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
  .recrow.ok select{border-color:var(--good);background:var(--good-soft)}
  .recrow.bad select{border-color:#eab3af;background:var(--bad-soft)}
  .recfb{font-size:.92rem;margin-top:4px}
  .recfb.ok{color:#14593a}
  .recfb.bad{color:#7a2e28}
  .summary{background:#f3f5f9;border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:12px;font-size:1rem;line-height:1.55}
  .quiz{margin-top:22px;border-top:2px dashed var(--line);padding-top:14px}
  .quiz h3{margin:0 0 10px;font-size:1.1rem;color:var(--more)}
  .qcard{background:#faf8ff;border:1px solid #e3dbf6;border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .qq{margin:0 0 8px;font-weight:700}
  .qopts{display:flex;flex-direction:column;gap:6px}
  .qopt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:400 .95rem var(--font);color:var(--ink);cursor:pointer}
  .qopt:hover:not(:disabled){border-color:var(--more)}
  .qopt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
  .qopt.wrong{border-color:#eab3af;background:var(--bad-soft);opacity:.75;cursor:default}
  .qcard.done .qopt:not(.right){opacity:.55}
  .qfb{margin-top:8px;font-size:.92rem;border-radius:10px;padding:7px 12px}
  .qfb.good{background:var(--good-soft);color:#14593a}
  .qfb.bad{background:var(--bad-soft);color:#7a2e28}
  .qscore{font-weight:700;color:var(--more)}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="drag.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const f1 = n => Math.round(n * 10) / 10;
  const rnd = k => { const v = Math.sin(k * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
  const hash = s => { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100003; return h; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"})[c]);
  const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16), ch = s => clamp(Math.round(((n >> s) & 255) * (1 + k)), 0, 255); return "#" + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, "0")).join(""); };

  /* ---------------------------------------------------------------- organisms */
  const ORG = {
    se:{short:"S. epidermidis", name:"Staphylococcus epidermidis", shape:"coccus", gram:"pos", cap:"#9a6212"},
    bm:{short:"B. megaterium", name:"Bacillus megaterium", shape:"bacillus", gram:"pos", L:46, W:16, chain:.35, cap:"#6b4bb8"},
    bs:{short:"B. subtilis", name:"Bacillus subtilis", shape:"bacillus", gram:"pos", L:32, W:11, chain:.3, cap:"#2f9e63"},
    ec:{short:"E. coli", name:"Escherichia coli", shape:"bacillus", gram:"neg", L:24, W:10, chain:.08, cap:"#3f7bd1"},
    ea:{short:"E. aerogenes", name:"Enterobacter aerogenes", shape:"bacillus", gram:"neg", L:22, W:11, chain:.08, cap:"#c4532f"}
  };
  const SHAPE = ["Coccus (sphere)", "Bacillus (rod)", "Spirillum (spiral)"];
  const ARR = ["Pairs (diplo)", "Chains (strepto)", "Clusters (staphylo)", "Tetrads (4)", "Sarcinae (cube of 8)"];

  /* ---------------------------------------------------------------- reagents and actions */
  const ACT = {
    water:{label:"Drop of water", g:"slide", c:"#cfe6f5", code:"H₂O", name:["Water", "(a drop)"]},
    cells:{label:"Add cells from the culture", g:"slide"},
    dry:{label:"Air dry", g:"slide"},
    flame:{label:"Pass through the flame", g:"slide"},
    paper:{label:"Lay absorbent paper on the smear", g:"slide", name:["Absorbent", "paper"]},
    steam:{label:"Steam over the boiling water bath", g:"slide"},
    addstain:{label:"Add more stain", g:"slide"},
    unpaper:{label:"Remove the paper", g:"slide"},
    rinse:{label:"Rinse with water", g:"slide", name:["Wash", "bottle"]},
    blot:{label:"Blot dry", g:"slide", name:["Bibulous", "paper"]},
    cv:{label:"Crystal violet", g:"stain", c:"#5a2a98", code:"CV", name:["Crystal", "violet"]},
    iodine:{label:"Gram's iodine", g:"stain", c:"#8a5a1a", code:"I", name:["Gram's", "iodine"]},
    etoh:{label:"95% ethanol", g:"stain", c:"#c9dbee", code:"EtOH", name:["95%", "ethanol"]},
    safranin:{label:"Safranin", g:"stain", c:"#d8456b", code:"S", name:["Safranin"]},
    mb:{label:"Methylene blue", g:"stain", c:"#2a4fb0", code:"MB", name:["Methylene", "blue"]},
    mg:{label:"Malachite green", g:"stain", c:"#2f9e4f", code:"MG", name:["Malachite", "green"]},
    cf:{label:"Carbolfuchsin", g:"stain", c:"#c2185b", code:"CF", name:["Carbol-", "fuchsin"]},
    eosin:{label:"Eosin", g:"stain", c:"#e0507a", code:"E", name:["Eosin"]}
  };
  /* what to do on the bench for each step (used by the hint button) */
  const HOW = {
    water:"Drag the <b>Water</b> dropper bottle onto the slide.", cells:"Drag the <b>loop</b> (with cells on it) onto the slide.",
    dry:"Tap the <b>Air dry</b> button.", flame:"Drag the <b>slide</b> onto the burner flame. Each drop on the flame is one pass.",
    paper:"Drag the <b>absorbent paper</b> onto the slide.", steam:"Tap the <b>Steam over the water bath</b> button.",
    unpaper:"Drag the <b>paper</b> off the slide.", rinse:"Drag the <b>wash bottle</b> onto the slide.", blot:"Drag the <b>bibulous paper</b> onto the slide.",
    etoh:"Drag the <b>95% ethanol</b> bottle onto the slide. Each time is about 2.5 seconds of dripping."
  };
  const DISTRACT = {
    mb:"Methylene blue is a simple stain. It isn't part of this procedure.",
    mg:"Malachite green is the endospore stain. It isn't part of this procedure.",
    cf:"Carbolfuchsin is the acid-fast stain. It isn't part of this procedure.",
    cv:"Crystal violet isn't part of this procedure.",
    safranin:"Safranin isn't part of this procedure.",
    eosin:"Eosin is an acidic dye. Acidic dyes are repelled by the negatively charged cell surface, so they don't stain the cells directly. Use a basic dye.",
    iodine:"Gram's iodine isn't part of this procedure.",
    etoh:"95% ethanol isn't part of this procedure.",
    water:"Water isn't needed for this culture."
  };

  /* ---------------------------------------------------------------- the three stains */
  const st = (id, stage, say, why, x) => Object.assign({id, stage, say, why:why || ""}, x || {});
  const prep = c => {
    const a = [], S1 = "Make the smear";
    if (c.src === "slant") a.push(st("water", S1, "Place a drop of water on the slide.", "A slant is solid growth, so it needs a drop of water to make a light, milky suspension."));
    a.push(st("cells", S1, c.src === "slant" ? "Scrape a SMALL amount of growth into the water and mix it into a light, milky suspension." : c.src === "broth" ? "Put 2 to 3 loopfuls of the broth directly on the slide. No water needed." : "Spread a thin smear of the culture on the slide.",
      "Spread it in a thin circle. A thick smear hides the cells."));
    a.push(st("dry", S1, "Let the smear air dry at room temperature.", "Dry it before fixing."));
    a.push(st("flame", S1, "Heat-fix: pass the dried slide through the flame 3 to 5 times.", "Heat-fixing kills the bacteria and attaches them to the slide.", {min:3}));
    return a;
  };
  const reagent = (id, stage, say, time, color) => [
    st(id, stage, say, "", {wait:time, color}),
    st("rinse", stage, "Rinse gently with water.", "Rinse after each reagent."),
    st("blot", stage, "Blot dry with bibulous paper. Don't rub.", "Blot, don't rub.")];

  const TABS = {
    smear:{
      tab:"Smear + simple stain", title:"Smear Preparation and Simple Staining", ex:"Exercise 5",
      question:"How do you turn a culture into a smear, stain it, and read its shape and arrangement?",
      how:["A stain is a salt with a colored ion (the chromophore). <b>Basic (cationic)</b> dyes like methylene blue carry a positive charge, and most bacterial cells carry a net negative charge, so the dye binds readily. <b>Acidic (anionic)</b> dyes are repelled by the cell surface.",
        "A simple stain uses one dye: the <b>cells are colored</b> and the background is clear, which gives contrast so you can see <b>morphology</b> and <b>arrangement</b>.",
        "A <b>smear</b> is a thin film of cells on a slide. <b>Fixation</b> kills the bacteria and attaches them to the slide. Heat-fixing means 3 to 5 passes through the flame."],
      cultures:[{o:"se", src:"slant", sub:"slant"}, {o:"bm", src:"broth", sub:"broth"}],
      pal:{slide:["water", "cells", "dry", "flame", "rinse", "blot"], stain:["mb", "eosin"]},
      seq:c => prep(c).concat(reagent("mb", "Methylene blue", "Flood the smear with methylene blue for 30 to 60 seconds.", "30 to 60 seconds", "#2a4fb0")),
      quiz:[
        q("Why does a basic (cationic) dye like methylene blue stain bacteria so well?", ["Bacterial cells are slightly negative, so a positively charged dye is attracted to them", "Bacterial cells are positive, so they attract the dye", "Basic dyes dissolve the cell wall", "Basic dyes are neutral"], 0, "Opposites attract: a positive dye binds the negatively charged cell surface."),
        q("Why don't acidic (anionic) dyes stain bacterial cells directly?", ["They are negatively charged and repelled by the negatively charged cell surface", "They are too large", "They kill the cells", "They need heat"], 0, "Like charges repel, so the dye doesn't bind."),
        q("What does heat-fixing do?", ["Kills the bacteria and attaches them to the slide", "Adds color to the cells", "Makes the cells bigger", "Dissolves the agar"], 0, "Fixation kills the cells and sticks them to the slide so they don't wash off."),
        q("How do you make a smear from a slant culture?", ["Mix a small amount of growth into a drop of water on the slide", "Put 2 to 3 loopfuls of broth on the slide", "Flood the slant with stain", "Smear the whole slant"], 0, "A slant is solid, so it needs a drop of water. A broth culture goes straight on the slide."),
        q("In a simple stain, what does the slide look like?", ["Cells are colored and the background is clear", "Cells are clear and the background is colored", "Everything is the same color", "Only the cell walls are colored"], 0, "That is the contrast that lets you see shape and arrangement."),
        q("Which organism in this exercise is a bacillus?", ["B. megaterium", "S. epidermidis", "Both of them", "Neither"], 0, "B. megaterium is a large rod. S. epidermidis is a coccus in clusters."),
        q("Which pair of choices matches S. epidermidis?", ["Cocci in clusters", "Large rods", "Spirals in chains", "Rods in tetrads"], 0, "Staphylococci form grape-like clusters.")]
    },
    gram:{
      tab:"Gram stain", title:"Gram Staining", ex:"Exercise 7",
      question:"Is this bacterium gram-positive or gram-negative?",
      note:"<b>Note:</b> the times and numbers here (60 seconds of crystal violet, 30 seconds of iodine, about 10 seconds of ethanol, 60 seconds of safranin) can vary a little between handouts and instructors. Use them as a guide, and follow the numbers your instructor gives you.",
      how:["<b>Crystal violet</b> (primary stain) stains every cell purple. <b>Gram's iodine</b> (mordant) forms a crystal violet-iodine complex. <b>95% ethanol</b> (decolorizer) removes that complex from gram-negative cells. <b>Safranin</b> (counterstain) stains the gram-negative cells pink.",
        "<b>Gram-positive = purple.</b> The thick peptidoglycan traps the crystal violet-iodine complex. <b>Gram-negative = pink.</b> Ethanol dissolves the outer lipid membrane, and the complex washes out of the thin peptidoglycan.",
        "Decolorizing is the <b>trickiest step</b>: ethanol until the runoff runs clear (about 10 seconds), and don't overdo it. It guides antibiotic choice before culture results are back."],
      cultures:[{o:"se", src:"slant", sub:"slant"}, {o:"bs", src:"slant", sub:"slant"}, {o:"ec", src:"broth", sub:"broth"}],
      pal:{slide:["water", "cells", "dry", "flame", "rinse", "blot"], stain:["cv", "iodine", "etoh", "safranin", "mb", "mg", "cf"]},
      seq:c => prep(c)
        .concat(reagent("cv", "Crystal violet", "Cover the smear with crystal violet (the primary stain) for 60 seconds.", "60 seconds", "#5a2a98"))
        .concat(reagent("iodine", "Gram's iodine", "Cover the smear with Gram's iodine (the mordant) for 30 seconds.", "30 seconds", "#8a5a1a"))
        .concat([st("etoh", "Decolorize (ethanol)", "Drip 95% ethanol on the slide until the runoff runs clear (about 10 seconds). Don't overdo it.", "Decolorizing comes after the mordant.", {special:"decolor"}),
          st("rinse", "Decolorize (ethanol)", "Stop the ethanol and rinse gently with water.", "Rinse to stop decolorizing."),
          st("blot", "Decolorize (ethanol)", "Blot dry with bibulous paper. Don't rub.", "Blot, don't rub.")])
        .concat(reagent("safranin", "Safranin", "Cover the smear with safranin (the counterstain) for 60 seconds.", "60 seconds", "#d8456b")),
      quiz:[
        q("What is the correct order of the Gram stain?", ["Crystal violet, Gram's iodine, 95% ethanol, safranin", "Safranin, ethanol, crystal violet, iodine", "Crystal violet, safranin, iodine, ethanol", "Iodine, crystal violet, safranin, ethanol"], 0, "Primary stain, mordant, decolorizer, counterstain."),
        q("What does Gram's iodine do?", ["Acts as a mordant: it forms the crystal violet-iodine complex", "Decolorizes the cells", "Counterstains the cells", "Kills the cells"], 0, "The complex is what the thick peptidoglycan of gram-positive cells holds on to."),
        q("Which step is the trickiest?", ["Decolorizing with 95% ethanol", "Air drying", "Blotting", "Rinsing the safranin"], 0, "Ethanol until it runs clear (about 10 seconds): too short or too long gives the wrong color."),
        q("Why are gram-positive cells purple?", ["The thick peptidoglycan traps the crystal violet-iodine complex", "They absorb safranin", "They have no cell wall", "Iodine turns them purple"], 0, "The complex can't wash out of thick peptidoglycan."),
        q("Why are gram-negative cells pink?", ["Ethanol dissolves the outer lipid membrane, the complex washes out of the thin peptidoglycan, and safranin stains them", "They absorb crystal violet", "They are killed by safranin", "Iodine turns them pink"], 0, "After decolorizing they are colorless until the safranin counterstain."),
        q("You over-decolorize a gram-positive smear. What will the cells look like?", ["Pink, like gram-negative cells", "Even darker purple", "Blue", "Green"], 0, "Too much ethanol pulls the complex out of gram-positive cells too, so safranin colors them."),
        q("Which of the three organisms in this exercise is a gram-negative rod?", ["E. coli", "S. epidermidis", "B. subtilis", "None of them"], 0, "S. epidermidis (cocci) and B. subtilis (rods) are gram-positive."),
        q("Why does the Gram stain matter clinically?", ["It guides antibiotic choice before culture results are back", "It identifies the exact species", "It shows whether the patient is infected", "It measures cell size"], 0, "Gram-positive and gram-negative cells respond differently to antibiotics.")]
    },
    spore:{
      tab:"Endospore stain", title:"Endospore Stain (Schaeffer-Fulton)", ex:"Exercise 9",
      question:"Does this culture contain endospores, and how can you tell?",
      how:["An <b>endospore</b> is a dormant, tough structure made by <b>Bacillus</b> and <b>Clostridium</b> when nutrients are scarce. It resists heat, desiccation, harsh chemicals, and UV light.",

  /* ---------------------------------------------------------------- the microscope field */
  function buildWorld(){

    if (o.shape === "coccus"){
      for (let i = 0; i < 190; i++){

        for (let j = 0; j < n; j++){ const a = rnd(seed + i * 31 + j) * 6.283, r = Math.sqrt(rnd(seed + i * 37 + j * 5)) * (12 + n * 1.6); pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); }

  /* ================================================================ "Understand the stain" */
  const SV = (w, h, body, label, minw) => `<svg viewBox="0 0 ${w} ${h}" class="tflow" style="min-width:${minw || 560}px" role="img" aria-label="${label}">${body}</svg>`;

  const rod = (cx, cy, w, h, fill, stroke, spore) => `<rect x="${f1(cx - w / 2)}" y="${f1(cy - h / 2)}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${stroke || shade(fill === "none" ? "#c9b98f" : fill, -.3)}" stroke-width="2.2"/>`

  const CLEAR = "#f6f0de";

  /* Gram: what the two kinds of cell wall look like */
  function wallSVG(){
    const bil = (x0, x1, y, head) => { let s = `<rect x="${x0}" y="${y + 5}" width="${x1 - x0}" height="12" fill="#f7e8c4"/>`; for (let x = x0 + 5; x < x1; x += 10) s += `<circle cx="${x}" cy="${y + 3}" r="4.2" fill="${head}"/><circle cx="${x}" cy="${y + 19}" r="4.2" fill="${head}"/>`; return s; };
    const pg = (x0, x1, y, h) => { let s = `<rect x="${x0}" y="${y}" width="${x1 - x0}" height="${h}" rx="3" fill="#cdbbe8" stroke="#7d5fb8" stroke-width="1.5"/>`; for (let yy = y + 7; yy < y + h; yy += 8) s += `<line x1="${x0 + 3}" y1="${yy}" x2="${x1 - 3}" y2="${yy}" stroke="#7d5fb8" stroke-width="1" opacity=".6"/>`; for (let x = x0 + 12; x < x1; x += 18) s += `<line x1="${x}" y1="${y + 2}" x2="${x}" y2="${y + h - 2}" stroke="#7d5fb8" stroke-width="1" opacity=".5"/>`; return s; };
    let s = "";
    [[20, "Gram-positive", "#5a2a98"], [410, "Gram-negative", "#c23a6a"]].forEach(([px, name, col], n) => {
      s += `<rect x="${px}" y="8" width="370" height="330" rx="16" fill="#fff" stroke="#d9dee7"/>` + T2(px + 185, 36, name, {fs:17, col});
      s += T2(px + 18, 62, "outside the cell", {fs:12.5, col:"#8b93a3", a:"start", w:400});
      const x0 = px + 18, x1 = px + 196, lx = px + 206;
      if (!n){
        s += pg(x0, x1, 74, 70) + T2(lx, 104, "thick", {fs:13.5, a:"start"}) + T2(lx, 121, "peptidoglycan", {fs:13.5, a:"start"});
        s += bil(x0, x1, 158, "#e0a63a") + T2(lx, 174, "plasma membrane", {fs:13.5, a:"start"});
      } else {
        s += bil(x0, x1, 74, "#d9534f") + T2(lx, 84, "outer membrane", {fs:13.5, a:"start"}) + T2(lx, 100, "(lipid)", {fs:13.5, a:"start", w:400});
        s += pg(x0, x1, 116, 14) + T2(lx, 128, "thin peptidoglycan", {fs:13.5, a:"start"});
        s += bil(x0, x1, 158, "#e0a63a") + T2(lx, 174, "plasma membrane", {fs:13.5, a:"start"});
      }
      s += T2(px + 18, 204, "inside the cell", {fs:12.5, col:"#8b93a3", a:"start", w:400});
      const lines = !n ? ["Ethanol can't pull the crystal violet-", "iodine complex out of the thick wall.", "The cell stays PURPLE."] : ["Ethanol dissolves the outer membrane,", "and the complex washes out of the thin", "wall. Safranin then makes it PINK."];
      s += `<rect x="${px + 14}" y="226" width="342" height="98" rx="12" fill="${!n ? "#f1ebfa" : "#fbedf2"}"/>` + lines.map((l, k) => T2(px + 185, 256 + k * 24, l, {fs:14, w:k === 2 ? 700 : 400})).join("");
    });
    return SV(800, 346, s, "Gram-positive and gram-negative cell walls", 600);
  }
  /* a step-by-step chart: columns are reagents, rows are cells */
  function stepChart(cols, rows){
    const lw = 150, cw = 140, W = lw + cols.length * cw + 10, rh = 92, H = 120 + rows.length * rh;
    let s = "";
    cols.forEach((c, j) => {
      const x = lw + j * cw + cw / 2;
      if (j) s += `<line x1="${lw + j * cw}" y1="12" x2="${lw + j * cw}" y2="${H - 10}" stroke="#e3e7ee" stroke-width="2"/>`;
      if (c.color) s += `<circle cx="${x}" cy="28" r="14" fill="${c.color}" stroke="${shade(c.color, -.3)}" stroke-width="1.5"/>`; else s += `<rect x="${x - 26}" y="18" width="52" height="20" rx="4" fill="#e9f1f6" stroke="#a9b8c6" stroke-width="1.5"/>`;
      c.name.forEach((nm, k) => { s += T2(x, 62 + k * 17, nm, {fs:14}); });
      s += T2(x, 62 + c.name.length * 17 + 2, c.role, {fs:12.5, col:"#5a6376", w:400});
      if (c.time) s += T2(x, 62 + c.name.length * 17 + 19, c.time, {fs:12.5, col:"#9a6212"});
    });
    rows.forEach((r, i) => {
      const y = 132 + i * rh + 20;
      r.label.forEach((l, k) => { s += T2(12, y - 4 + k * 18, l, {fs:14, a:"start"}); });
      r.cells.forEach((c, j) => { const x = lw + j * cw + cw / 2; s += rod(x, y - 6, 78, 30, c.f === CLEAR ? CLEAR : c.f, c.f === CLEAR ? "#c9b98f" : null, c.sp) + T2(x, y + 28, c.t, {fs:12.5, col:"#343b4a", w:400}); });
    });
    return SV(W, H, s, "What the cells look like after each step", 620);
  }
  /* simple stain: why a basic dye sticks and an acidic dye doesn't */
  function chargeSVG(){
    let s = rod(230, 120, 250, 96, "#eef2fb", "#8b9ac0");
    const per = Array.from({length:14}, (_, k) => { const a = k / 14 * Math.PI * 2; return [230 + Math.cos(a) * 112, 120 + Math.sin(a) * 38]; });
    per.forEach(([x, y]) => { s += T2(x, y + 5, "−", {fs:20, col:"#343b4a"}); });

  /* simple stain: making the smear */
  function smearStripSVG(){
    const steps = [["Drop of water", "(slant cultures only)"], ["Add cells and", "spread thin"], ["Air dry", ""], ["Heat-fix:", "3 to 5 passes"], ["Methylene blue", "30 to 60 s"], ["Rinse, then", "blot dry"]];

      if (k === 2) s += E(17, 10, "#f1ead6", "#e0d6b8");
      if (k === 3) s += E(17, 10, "#e6dcc2", "#cdbf99") + `<path d="M${cx + 10},${cy + 52} C${cx},${cy + 40} ${cx + 4},${cy + 30} ${cx + 10},${cy + 24} C${cx + 16},${cy + 30} ${cx + 20},${cy + 40} ${cx + 10},${cy + 52} Z" fill="#7fb2ff"/>`;

  /* shapes and arrangements */
  function arrangeSVG(){
    const col = "#3858b8", sk = "#243f8f", c = (x, y, r) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r || 8}" fill="${col}" stroke="${sk}" stroke-width="1.5"/>`;
    const items = [

      ["Bacillus", "rod", x => rod(x, 60, 56, 18, col, sk)],
      ["Spirillum", "spiral", x => `<path d="M${x - 34},60 q8.5,-16 17,0 t17,0 t17,0 t17,0" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"/>`],

      ["Staphylo-", "clusters", x => [[-12, -8], [4, -12], [16, 0], [-4, 4], [10, 14], [-16, 10], [-2, 20]].map(([a, b]) => c(x + a, 56 + b, 7.5)).join("")],
      ["Tetrad", "4 cells", x => [[-8, -8], [8, -8], [-8, 8], [8, 8]].map(([a, b]) => c(x + a, 60 + b)).join("")],
      ["Sarcina", "cube of 8", x => [[-8, -8], [8, -8], [-8, 8], [8, 8]].map(([a, b]) => c(x + a + 6, 60 + b - 6, 7) ).join("") + [[-8, -8], [8, -8], [-8, 8], [8, 8]].map(([a, b]) => c(x + a - 4, 60 + b + 4, 7.5)).join("")]];
    let s = T2(14, 20, "Shapes", {fs:13, a:"start", col:"#5a6376"}) + T2(326, 20, "Arrangements (how the cells group)", {fs:13, a:"start", col:"#5a6376"}) + `<line x1="312" y1="10" x2="312" y2="132" stroke="#e3e7ee" stroke-width="2"/>`;
    items.forEach(([n, sub, fn], k) => { const x = 54 + k * 100 + (k > 2 ? 12 : 0); s += fn(x) + T2(x, 106, n, {fs:14}) + T2(x, 124, sub, {fs:12.5, col:"#5a6376", w:400}); });
    return SV(820, 136, s, "Bacterial shapes and arrangements", 640);
  }
  /* endospores: where they come from */
  function sporeSVG(){
    let s = rod(110, 70, 120, 42, "#e0506c") + T2(110, 128, "Vegetative cell", {fs:14}) + T2(110, 146, "growing, dividing", {fs:12.5, col:"#5a6376", w:400});
    s += `<line x1="186" y1="70" x2="262" y2="70" stroke="#8a93a3" stroke-width="2.5"/><path d="M270,70 l-10,-6 v12 Z" fill="#8a93a3"/>` + T2(226, 56, "nutrients", {fs:12.5, col:"#5865d6"}) + T2(226, 92, "run low", {fs:12.5, col:"#5865d6"});
    s += rod(350, 70, 120, 42, "#e0506c", null, "#35a34f") + T2(350, 128, "Cell with an endospore", {fs:14}) + T2(350, 146, "spore forms inside", {fs:12.5, col:"#5a6376", w:400});
    s += `<line x1="426" y1="70" x2="502" y2="70" stroke="#8a93a3" stroke-width="2.5"/><path d="M510,70 l-10,-6 v12 Z" fill="#8a93a3"/>` + T2(466, 56, "the cell", {fs:12.5, col:"#5865d6"}) + T2(466, 92, "breaks open", {fs:12.5, col:"#5865d6"});
    s += `<ellipse cx="580" cy="70" rx="24" ry="15" fill="#35a34f" stroke="#1f6a32" stroke-width="5"/>` + T2(580, 128, "Free endospore", {fs:14}) + T2(580, 146, "dormant, very tough", {fs:12.5, col:"#5a6376", w:400});
    s += `<path d="M604,60 L660,36" stroke="#5a6376" stroke-width="1.5"/>` + T2(664, 30, "tough spore coat:", {fs:12.5, a:"start"}) + T2(664, 46, "keeps simple stains out", {fs:12.5, a:"start", w:400});
    return SV(830, 158, s, "How an endospore forms", 620);
  }
  /* small microscope fields for the expected results */
  function miniField(sp, seed){
    let s = `<defs><clipPath id="mf${seed}"><circle cx="70" cy="70" r="64"/></clipPath></defs><circle cx="70" cy="70" r="66" fill="#1b1d25"/><circle cx="70" cy="70" r="64" fill="${sp.bg || "#f6f6f8"}"/><g clip-path="url(#mf${seed})">`;
    if (sp.shape === "coccus"){
      for (let i = 0; i < 9; i++){ const x = 14 + rnd(seed + i) * 112, y = 14 + rnd(seed + i + 40) * 112, n = 4 + Math.floor(rnd(seed + i + 9) * 5);
        for (let j = 0; j < n; j++){ const a = rnd(seed + i * 9 + j) * 6.28, r = rnd(seed + i * 7 + j) * 9; s += `<circle cx="${f1(x + Math.cos(a) * r)}" cy="${f1(y + Math.sin(a) * r)}" r="4.2" fill="${sp.fill}" stroke="${shade(sp.fill, -.3)}" stroke-width="1"/>`; } }
    } else {
      for (let i = 0; i < (sp.n || 18); i++){ const x = 8 + rnd(seed + i) * 124, y = 8 + rnd(seed + i + 40) * 124, a = rnd(seed + i + 80) * 180, Lr = sp.L || 16, Wr = sp.W || 6.5, chain = rnd(seed + i + 3) < (sp.chain || 0) ? 2 : 1;
        for (let j = 0; j < chain; j++){ const off = (j - (chain - 1) / 2) * (Lr + 2), rr = a * Math.PI / 180, cx = x + Math.cos(rr) * off, cy = y + Math.sin(rr) * off;
          s += `<rect x="${f1(cx - Lr / 2)}" y="${f1(cy - Wr / 2)}" width="${Lr}" height="${Wr}" rx="${Wr / 2}" fill="${sp.fill}" stroke="${shade(sp.fill, -.3)}" stroke-width="1" transform="rotate(${f1(a)} ${f1(cx)} ${f1(cy)})"/>`;
          if (sp.spores && rnd(seed + i * 5 + j) < sp.spores) s += `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(Lr * .2)}" ry="${f1(Wr * .32)}" fill="#35a34f" stroke="#1f7a37" stroke-width="1" transform="rotate(${f1(a)} ${f1(cx)} ${f1(cy)})"/>`; } }
      for (let i = 0; i < (sp.free || 0); i++){ const x = 10 + rnd(seed + 300 + i) * 120, y = 10 + rnd(seed + 340 + i) * 120; s += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="3.6" ry="2.6" fill="#35a34f" stroke="#1f7a37" stroke-width="1"/>`; }
    }
    return `<svg viewBox="0 0 140 140" role="img" aria-label="Expected microscope view">${s}</g></svg>`;
  }

  const THEORY = {
    smear:{
      graphics:[["Why a basic dye stains the cells", chargeSVG], ["Making and staining a smear", smearStripSVG]],
      reagents:[["Water (slant cultures only)", "", "Makes a light, milky suspension of solid growth", "Before the cells go on"], ["Methylene blue", "#2a4fb0", "Basic (cationic) dye: the simple stain. Colors the cells blue", "30 to 60 seconds"]],
      results:[{t:"S. epidermidis", s:"blue cocci in clusters", sp:{shape:"coccus", fill:"#3858b8", bg:"#f5f7fc"}}, {t:"B. megaterium", s:"large blue rods, some in chains", sp:{shape:"bacillus", fill:"#3858b8", bg:"#f5f7fc", L:22, W:8, chain:.35, n:14}}],
      extra:["Shapes and arrangements to know", arrangeSVG],
      mistakes:[["Too much growth from a slant", "The smear is too thick and cells pile up, so you can't see single cells. Use a SMALL amount and spread it thin."],
        ["Adding water to a broth culture", "Not needed. A broth culture is already liquid, so 2 to 3 loopfuls go straight on the slide."],
        ["Heat-fixing before the smear is dry", "Let the smear air dry at room temperature first, then heat-fix."],
        ["More than 5 passes through the flame", "Too much heat shrinks and distorts the cells. Use 3 to 5 passes."],
        ["Using an acidic dye like eosin", "It is repelled by the negatively charged cell surface, so the cells don't stain."],
        ["Rubbing instead of blotting", "Blot gently with bibulous paper. Don't rub."]]},
    gram:{
      graphics:[["Two kinds of cell wall", wallSVG], ["What the cells look like after each step", () => stepChart(
        [{name:["Heat-fixed", "smear"], role:"before staining"}, {name:["Crystal", "violet"], role:"primary stain", time:"60 s", color:"#5a2a98"}, {name:["Gram's", "iodine"], role:"mordant", time:"30 s", color:"#8a5a1a"}, {name:["95%", "ethanol"], role:"decolorizer", time:"about 10 s", color:"#c9dbee"}, {name:["Safranin", ""], role:"counterstain", time:"60 s", color:"#d8456b"}],
        [{label:["Gram-", "positive"], cells:[{f:CLEAR, t:"colorless"}, {f:"#5a2a98", t:"purple"}, {f:"#3c1a70", t:"purple (CV-I)"}, {f:"#4a2a85", t:"stays purple"}, {f:"#5a2a98", t:"PURPLE"}]},
         {label:["Gram-", "negative"], cells:[{f:CLEAR, t:"colorless"}, {f:"#5a2a98", t:"purple"}, {f:"#3c1a70", t:"purple (CV-I)"}, {f:CLEAR, t:"colorless"}, {f:"#e5588a", t:"PINK"}]}])]],
      reagents:[["Crystal violet", "#5a2a98", "Primary stain: colors every cell purple", "60 seconds"], ["Gram's iodine", "#8a5a1a", "Mordant: forms the crystal violet-iodine (CV-I) complex", "30 seconds"],
        ["95% ethanol", "#c9dbee", "Decolorizer: pulls the CV-I complex out of gram-negative cells", "Until the runoff runs clear (about 10 seconds)"], ["Safranin", "#d8456b", "Counterstain: colors the now colorless gram-negative cells pink", "60 seconds"]],
      results:[{t:"S. epidermidis", s:"gram-positive cocci (purple)", sp:{shape:"coccus", fill:"#5a2a98", bg:"#f7f2f3"}}, {t:"B. subtilis", s:"gram-positive rods (purple)", sp:{shape:"bacillus", fill:"#5a2a98", bg:"#f7f2f3", L:16, W:6, chain:.3}}, {t:"E. coli", s:"gram-negative rods (pink)", sp:{shape:"bacillus", fill:"#e5588a", bg:"#f7f2f3", L:12, W:6}}],
      mistakes:[["Stopping the ethanol too soon", "The complex isn't fully removed, so gram-negative cells stay purple: a false gram-positive."],
        ["Too much ethanol", "Over-decolorizing pulls the complex out of gram-positive cells too, so they turn pink: a false gram-negative."],
        ["Ethanol before the iodine", "The mordant goes on before the decolorizer. Without the CV-I complex, the crystal violet washes out of every cell."],
        ["Skipping the safranin", "Gram-negative cells stay colorless after the ethanol, so they are very hard to see."],
        ["More than 5 passes through the flame", "Too much heat distorts the cells."]]},
    spore:{
      graphics:[["Where endospores come from", sporeSVG], ["What the cells look like after each step", () => stepChart(
        [{name:["Heat-fixed", "smear"], role:"before staining"}, {name:["Malachite", "green + steam"], role:"primary stain", time:"5 minutes", color:"#2f9e4f"}, {name:["Water", "rinse"], role:"decolorizer", time:"30 s", color:"#cfe6f5"}, {name:["Safranin", ""], role:"counterstain", time:"30 s", color:"#d8456b"}],
        [{label:["Cell with an", "endospore"], cells:[{f:CLEAR, sp:CLEAR, t:"colorless"}, {f:"#2f9e4f", sp:"#2f9e4f", t:"all green"}, {f:CLEAR, sp:"#2f9e4f", t:"spore stays green"}, {f:"#e0506c", sp:"#2f9e4f", t:"green spore, pink cell"}]}])]],
      reagents:[["Malachite green", "#2f9e4f", "Primary stain. Steam drives it into the tough endospore", "Steam 5 minutes over the boiling water bath on absorbent paper. Add more stain so it never dries out"],
        ["Water", "#cfe6f5", "Decolorizer: washes the green out of the vegetative cells, but not out of the spores", "30 seconds"], ["Safranin", "#d8456b", "Counterstain: colors the vegetative cells pink/red", "30 seconds"]],
      results:[{t:"B. subtilis, 72-hr", s:"many green endospores, pink cells", sp:{shape:"bacillus", fill:"#e0506c", bg:"#f2f6f1", L:17, W:6.5, spores:.7, free:12}}, {t:"B. subtilis, 24-hr", s:"some green endospores", sp:{shape:"bacillus", fill:"#e0506c", bg:"#f2f6f1", L:17, W:6.5, spores:.2, free:3}}, {t:"E. coli", s:"pink cells, no endospores", sp:{shape:"bacillus", fill:"#e0506c", bg:"#f2f6f1", L:12, W:6}}],
      mistakes:[["Letting the stain dry while steaming", "Dark stain crystals cover the slide. Keep adding malachite green so the paper stays wet."],
        ["Rinsing with the paper still on", "Take the paper off before the water rinse."],
        ["Skipping the steam", "The spore coat keeps stain out. Without heat, malachite green can't get into the endospore."],
        ["Expecting spores from E. coli or E. aerogenes", "They don't form endospores, so every cell is pink."],
        ["Using a young culture", "A 24-hour culture has fewer endospores than a 72-hour culture, because spores form when nutrients run out."]]}
  };

  (function(){
    const m = document.createElement("div");
    m.className = "tmodal"; m.id = "tModal"; m.hidden = true;
    m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); m.setAttribute("aria-labelledby", "tTitle");
    m.innerHTML = `<div class="tcard"></div>`;
    document.body.appendChild(m);
  })();
  function theoryHTML(){
    const t = TABS[tabKey], th = THEORY[tabKey];
    return `<div class="thead"><div><div class="tkick">Understand the stain</div><h2 id="tTitle">${t.title}</h2></div><button class="tclose" id="tClose" aria-label="Close">×</button></div>
      <div class="tasks"><span class="tlabel">The question it answers</span><p>${t.question}</p></div>
      <div class="tsec"><h3>How it works</h3><ul>${t.how.map(x => `<li>${x}</li>`).join("")}</ul></div>
      ${th.graphics.map(([h, fn]) => `<div class="tsec"><h3>${h}</h3><div class="tflowwrap">${fn()}</div></div>`).join("")}
      <div class="tsec"><h3>Reagents, in order</h3><div class="tflowwrap" style="background:none;padding:0"><table class="ttbl"><tr><th>Reagent</th><th>Its job</th><th>Time</th></tr>
        ${th.reagents.map(([n, c, job, time]) => `<tr><td><b>${c ? `<span class="sw" style="background:${c}"></span>` : ""}${n}</b></td><td>${job}</td><td>${time}</td></tr>`).join("")}</table></div></div>
      <div class="tsec"><h3>What you should see at 1000x</h3><div class="tres">${th.results.map((r, k) => `<div>${miniField(r.sp, k * 50 + 7)}<b><i>${r.t.split(",")[0]}</i>${r.t.includes(",") ? "," + r.t.split(",")[1] : ""}</b><span>${r.s}</span></div>`).join("")}</div></div>
      ${th.extra ? `<div class="tsec"><h3>${th.extra[0]}</h3><div class="tflowwrap">${th.extra[1]()}</div></div>` : ""}
      <div class="tsec"><h3>What can go wrong</h3><ul class="tmist">${th.mistakes.map(([a, b]) => `<li><b>${a}:</b> ${b}</li>`).join("")}</ul></div>
      ${t.note ? `<div class="tsec"><p class="labnote" style="margin:0">${t.note}</p></div>` : ""}
      <div class="tfoot"><button class="btn primary" id="tBack">Back to the bench</button></div>`;
  }
  function openTheory(){
    const m = $("tModal");
    m.querySelector(".tcard").innerHTML = theoryHTML();
    m.hidden = false; document.body.style.overflow = "hidden"; m.querySelector(".tcard").scrollTop = 0;
    const close = () => { m.hidden = true; document.body.style.overflow = ""; const b = $("theoryBtn"); if (b) b.focus({preventScroll:true}); };
    $("tClose").onclick = close; $("tBack").onclick = close;
    m.onclick = e => { if (e.target === m) close(); };
    m.onkeydown = e => { if (e.key === "Escape") close(); };
    $("tClose").focus();
  }

  /* ---------------------------------------------------------------- start */
  const h = location.hash.slice(1); if (TABS[h]) tabKey = h;
  window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (TABS[k] && k !== tabKey){ tabKey = k; renderTab(); window.scrollTo({top:0, behavior:"smooth"}); } });
  window.addEventListener("resize", () => { if (!L) return; const was = L.narrow; layout(); if (was !== L.narrow) draw(); });
  renderTab();
  window.__st = {S:() => S, L:() => L, act, pickCulture, dropItem, tipOf};
})();
</script>
